function makeLabelTexture(line1, bg, fg, line2, accent) {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, c.width, c.height);
  if (accent) { x.fillStyle = accent; x.fillRect(0, c.height-18, c.width, 18); x.fillRect(0, 0, c.width, 8); }
  x.fillStyle = fg; x.font = 'bold 62px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(line1, c.width/2, line2 ? 100 : c.height/2);
  if (line2) { x.fillStyle = accent || '#94A3B8'; x.font = '600 28px sans-serif'; x.fillText(line2, c.width/2, 175); }
  const t = new THREE.CanvasTexture(c); t.needsUpdate = true; return t;
}
function makeSpriteLabel(line1, bg, fg, line2, accent) {
  const tex = makeLabelTexture(line1, bg, fg, line2, accent);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  const s = new THREE.Sprite(mat);
  s.scale.set(10, 2.5, 1); return s;
}
function makeStripedTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = '#0F172A'; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = '#F59E0B';
  for (let i = -c.height; i < c.width + c.height; i += 64) {
    x.beginPath(); x.moveTo(i, c.height); x.lineTo(i+32, c.height); x.lineTo(i+32+c.height, 0); x.lineTo(i+c.height, 0); x.closePath(); x.fill();
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(12, 1); t.needsUpdate = true; return t;
}

/* ============================================================
   OrbitControls minimalista
   ============================================================ */
class SimpleOrbitControls {
  constructor(camera, dom) {
    this.camera = camera; this.dom = dom;
    this.target = new THREE.Vector3();
    this.enableDamping = true; this.dampingFactor = 0.08;
    this.minDistance = 6; this.maxDistance = 180;
    this.maxPolarAngle = Math.PI / 2 - 0.03;
    this.minPolarAngle = 0.1;
    this.spherical = new THREE.Spherical();
    this.sphericalDelta = new THREE.Spherical(0, 0, 0);
    this.scale = 1;
    this.panOffset = new THREE.Vector3();
    this.isDown = false; this.isPan = false;
    this.lastX = 0; this.lastY = 0;
    this.downX = 0; this.downY = 0;
    this._onDown = this._onDown.bind(this);
    this._onMove = this._onMove.bind(this);
    this._onUp = this._onUp.bind(this);
    this._onWheel = this._onWheel.bind(this);
    this._onCtx = e => e.preventDefault();
    dom.addEventListener('pointerdown', this._onDown);
    window.addEventListener('pointermove', this._onMove);
    window.addEventListener('pointerup', this._onUp);
    dom.addEventListener('wheel', this._onWheel, { passive: false });
    dom.addEventListener('contextmenu', this._onCtx);
    this.update();
  }
  _onDown(e) { this.isDown = true; this.isPan = (e.button === 2) || e.shiftKey; this.lastX = e.clientX; this.lastY = e.clientY; this.downX = e.clientX; this.downY = e.clientY; }
  _onMove(e) {
    if (!this.isDown) return;
    const dx = e.clientX - this.lastX, dy = e.clientY - this.lastY;
    this.lastX = e.clientX; this.lastY = e.clientY;
    if (this.isPan) {
      const dist = this.camera.position.distanceTo(this.target);
      const f = dist * 0.0018;
      const m = this.camera.matrixWorld.elements;
      const right = new THREE.Vector3(m[0], m[1], m[2]);
      const up = new THREE.Vector3(m[4], m[5], m[6]);
      this.panOffset.addScaledVector(right, -dx * f);
      this.panOffset.addScaledVector(up, dy * f);
    } else {
      this.sphericalDelta.theta -= dx * 0.005;
      this.sphericalDelta.phi   -= dy * 0.005;
    }
  }
  _onUp(e) {
    this.isDown = false;
    const moved = Math.hypot(e.clientX - this.downX, e.clientY - this.downY);
    if (moved < 5 && this.onClick) this.onClick(e);
  }
  _onWheel(e) { e.preventDefault(); const f = e.deltaY > 0 ? 1.08 : 0.92; this.scale *= f; }
  update() {
    const off = new THREE.Vector3().subVectors(this.camera.position, this.target);
    this.spherical.setFromVector3(off);
    this.spherical.theta += this.sphericalDelta.theta * (this.enableDamping ? this.dampingFactor : 1);
    this.spherical.phi   += this.sphericalDelta.phi   * (this.enableDamping ? this.dampingFactor : 1);
    this.spherical.phi = Math.max(this.minPolarAngle, Math.min(this.maxPolarAngle, this.spherical.phi));
    this.spherical.radius = Math.max(this.minDistance, Math.min(this.maxDistance, this.spherical.radius * this.scale));
    this.target.add(this.panOffset.clone().multiplyScalar(this.enableDamping ? this.dampingFactor : 1));
    off.setFromSpherical(this.spherical);
    this.camera.position.copy(this.target).add(off);
    this.camera.lookAt(this.target);
    if (this.enableDamping) {
      this.sphericalDelta.theta *= (1 - this.dampingFactor);
      this.sphericalDelta.phi   *= (1 - this.dampingFactor);
      this.panOffset.multiplyScalar(1 - this.dampingFactor);
    } else { this.sphericalDelta.set(0,0,0); this.panOffset.set(0,0,0); }
    this.scale = 1;
  }
  dispose() {
    this.dom.removeEventListener('pointerdown', this._onDown);
    window.removeEventListener('pointermove', this._onMove);
    window.removeEventListener('pointerup', this._onUp);
    this.dom.removeEventListener('wheel', this._onWheel);
    this.dom.removeEventListener('contextmenu', this._onCtx);
  }
}

    scene.add(additiveStream);
    auxRef.current.additiveStream = additiveStream;
    auxRef.current.additiveGeo = additiveGeo;
    auxRef.current.addCount = addCount;

    const pig = new THREE.Mesh(pigGeo, pigMat);
    pig.userData.pickKey = 'pig';
    pig.visible = false;
    scene.add(pig);
    const pigGlowGeo = new THREE.SphereGeometry(0.62, 12, 10);
    const pigGlowMat = new THREE.MeshBasicMaterial({ color: 0xf97316, transparent: true, opacity: 0.28, blending: THREE.AdditiveBlending, depthWrite: false });
    const pigGlow = new THREE.Mesh(pigGlowGeo, pigGlowMat);
    pig.add(pigGlow);

      new THREE.Vector3(-14, 2.2, 0),
      new THREE.Vector3(-7.5, 2.2, 0),
      new THREE.Vector3(-7.5, 2.2, -6)
    ]);

    auxRef.current.pigCurve = pigCurve;
    auxRef.current.pigT = 0;

        new THREE.MeshBasicMaterial({ color: 0xfca5a5, transparent: true, opacity: 0.32, side: THREE.DoubleSide, depthWrite: false })
      );
      fc.position.set(pos.x, 12, pos.z);
      fc.rotation.x = Math.PI;

      fireCones.push(fc);
    });

      const px = ev.clientX, py = ev.clientY;
      mouse.x = ((px - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((py - rect.top) / rect.height) * 2 + 1;
      ray.setFromCamera(mouse, camera);
      const hits = ray.intersectObjects(scene.children, true);
      for (const h of hits) {

        while (o && o !== scene) {
          if (o.userData && o.userData.tankId) {
            onSelectTankRef.current(o.userData.tankId);
            if (onPickObjectRef.current) onPickObjectRef.current('tank', { px, py });
            return;
          }
          if (o.userData && o.userData.pickKey) {
            if (onPickObjectRef.current) onPickObjectRef.current(o.userData.pickKey, { px, py });
            return;
          }
          o = o.parent;
        }

    };

    controls.onClick = handleClick;

      const hits = ray.intersectObjects(scene.children, true);
      let newHover = null;
      for (const h of hits) {
        let o = h.object;

          if (o.userData && o.userData.tankId) { newHover = o.userData.tankId; break; }
          o = o.parent;
        }

        d.rotors.forEach((r, idx) => { r.rotation.y += rSpd * (idx % 2 === 0 ? 1 : -1); });

      });

      // Sensores
      sensorRefs.current.forEach((s, i) => {
        const spd = (mode === 'lockout' || mode === 'emergency_fire') ? 0 : (mode === 'quarantine' ? 0.2 : (mode === 'swarm_sync' ? 1.4 : 0.7));
        s.rotation.x = t * spd + i;
        s.rotation.y = t * spd * 1.3 + i;
        s.position.y += Math.sin(t * 2 + i) * 0.003;
      });

      // Partículas
      if (showParticles && particlesRef.current) {
        particlesRef.current.visible = true;
        const data = particleDataRef.current;
        let spd = data.baseSpeed * 0.3;
        if (mode === 'active') spd = data.baseSpeed * 2;
        else if (mode === 'quarantine') spd = data.baseSpeed * 0.6;
        else if (mode === 'lockout' || mode === 'emergency_fire') spd = 0;
        else if (mode === 'swarm_sync') spd = data.baseSpeed * 1.4;
        else if (mode === 'vru_active') spd = data.baseSpeed * 1.0;
        else if (mode === 'additive_injection') spd = data.baseSpeed * 1.5;
        const dir = mode === 'quarantine' ? -1 : 1;
        for (let i = 0; i < 200; i++) {
          data.t[i] = (data.t[i] + spd * dir + 1) % 1;
          const v = data.curve.getPoint(data.t[i]);
          data.positions[i*3] = v.x;
          data.positions[i*3+1] = v.y + Math.sin(t * 8 + i) * 0.06;
          data.positions[i*3+2] = v.z;
        }
        particlesRef.current.geometry.attributes.position.needsUpdate = true;
        let pcolor = 0x38bdf8;
        if (mode === 'quarantine') pcolor = 0xf59e0b;
        else if (mode === 'lockout' || mode === 'emergency_fire') pcolor = 0xef4444;
        else if (mode === 'vru_active') pcolor = 0x10b981;
        else if (mode === 'additive_injection') pcolor = 0xfbbf24;
        particlesRef.current.material.color.setHex(pcolor);
      } else if (particlesRef.current) {
        particlesRef.current.visible = false;
      }

      tankRefs.current.forEach(ref => {

        else if (mode === 'quarantine' && ref.id === 1) ringColor = 0xf59e0b;
        else if (mode === 'swarm_sync') ringColor = 0xa855f7;
        else if (mode === 'vru_active') ringColor = 0x10b981;
        else if (mode === 'additive_injection') ringColor = 0xfbbf24;
        ref.ring.material.color.setHex(ringColor);
        ref.ring.material.emissive.setHex(ringColor);

        } else {

          ref.ring.scale.set(1, 1, 1);
        }

        if (ref.isoDisc) {
          ref.isoDisc.visible = !!tk.isolated;
          if (ref.isoDisc.visible) {
            ref.isoDisc.material.emissiveIntensity = 0.7 + Math.sin(t * 6) * 0.3;
          }
        }
      });

      // --- VRU animation (added module) ---
      const aux = auxRef.current;
      const vruActive = (mode === 'vru_active');
      if (aux.vaporParticles) {
        aux.vaporParticles.visible = vruActive;
        if (vruActive) {
          const vp = aux.vaporGeo.attributes.position.array;
          for (let i = 0; i < aux.vaporCount; i++) {
            vp[i*3+1] += aux.vaporSpeed[i] * (1 + Math.sin(t + i) * 0.2);
            if (vp[i*3+1] > 10.5) {
              vp[i*3+1] = 1.2;
              vp[i*3] = -25 + (Math.random()-0.5)*3;
              vp[i*3+2] = 8 + (Math.random()-0.5)*3;
            }
          }
          aux.vaporGeo.attributes.position.needsUpdate = true;
        }
      }
      if (aux.vruRing) {
        aux.vruRing.material.emissiveIntensity = vruActive ? (0.7 + Math.sin(t * 5) * 0.4) : 0.35;
        aux.vruRing.material.color.setHex(vruActive ? 0x10b981 : 0x06b6d4);
        aux.vruRing.material.emissive.setHex(vruActive ? 0x10b981 : 0x06b6d4);
      }

      // --- Additive stream animation ---
      const addActive = (mode === 'additive_injection');
      if (aux.additiveStream) {
        aux.additiveStream.visible = addActive;
        if (addActive) {
          const ap = aux.additiveGeo.attributes.position.array;
          for (let i = 0; i < aux.addCount; i++) {
            ap[i*3] += 0.22;
            ap[i*3+2] -= 0.16;
            if (ap[i*3] > -7) {
              ap[i*3] = -14;
              ap[i*3+1] = 2.2;
              ap[i*3+2] = 5;
            }
          }
          aux.additiveGeo.attributes.position.needsUpdate = true;
        }
      }

      // --- PIG animation ---
      const pigVisible = (mode === 'active' || mode === 'additive_injection' || mode === 'vru_active');
      if (aux.pig) {
        aux.pig.visible = pigVisible;
        if (pigVisible && aux.pigCurve) {
          aux.pigT = (aux.pigT + 0.0035) % 1;
          const p = aux.pigCurve.getPoint(aux.pigT);
          aux.pig.position.copy(p);
          aux.pig.rotation.y += 0.06;
          aux.pig.rotation.x += 0.03;
          if (aux.pig.children[0]) {
            aux.pig.children[0].material.opacity = 0.2 + Math.sin(t * 6) * 0.12;
            aux.pig.children[0].scale.setScalar(1 + Math.sin(t * 4) * 0.08);
          }
        }
      }

      // --- Fire suppression cones ---
      const fireActive = (mode === 'emergency_fire');
      aux.fireCones.forEach((fc, i) => {
        fc.visible = fireActive;
        if (fireActive) {
          fc.material.opacity = 0.28 + Math.sin(t * 8 + i) * 0.14;
          fc.scale.y = 1 + Math.sin(t * 6 + i) * 0.12;
          fc.rotation.y += 0.02;
        }
      });

      renderer.render(scene, camera);
    };
    animate();

    const ro = new ResizeObserver(entries => {
      for (const e of entries) {
        const w = Math.max(e.contentRect.width, 300);
        const h = Math.max(e.contentRect.height, 200);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
    });
    ro.observe(mount);

    return () => {
      cancelAnimationFrame(rafId);
      ro.disconnect();
      renderer.domElement.removeEventListener('click', handleClick);
      renderer.domElement.removeEventListener('pointermove', handlePointerMove);
      renderer.domElement.removeEventListener('dblclick', handleDblClick);
      controls.dispose();
      renderer.dispose();
      if (mount.contains(renderer.domElement)) mount.removeChild(renderer.domElement);
    };
    // eslint-disable-next-line
  }, []);

  useEffect(() => {
    if (mode === 'lockout' || mode === 'emergency_fire') shakeRef.current.until = performance.now() + 900;
  }, [mode]);

  useEffect(() => {
    const cam = cameraRef.current, controls = controlsRef.current;
    if (!cam || !controls) return;
    let pos = new THREE.Vector3(...CAMERA_INITIAL.pos), target = new THREE.Vector3(...CAMERA_INITIAL.target);
    switch (cameraPreset) {
      case 'reset':
      case 'global': pos.set(...CAMERA_INITIAL.pos); target.set(...CAMERA_INITIAL.target); break;
      case 'truck':  pos.set(-36, 12, 24); target.set(-20, 3, 11); break;
      case 'tanks':  pos.set(0, 16, 26);   target.set(0, 4, 0); break;
      case 'lab':    pos.set(-54, 18, 12); target.set(-44, 7, -20); break;
      case 'drone':  pos.set(14, 18, 16);  target.set(0, 8, 0); break;
    }
    cameraAnimRef.current = {
      t: 0,
      fromPos: cam.position.clone(),
      fromTarget: controls.target.clone(),
      toPos: pos,
      toTarget: target
    };
  }, [cameraPreset, cameraNonce]);  // [v4.3] nonce: permite re-disparar 'global' aunque ya esté seleccionado

  return <div ref={mountRef} className="absolute inset-0 w-full h-full overflow-hidden select-none bg-slate-950" />;
}

function Toast({ message, onDone }) {
  useEffect(() => {
    const id = setTimeout(onDone, 2200);
    return () => clearTimeout(id);
  }, [message, onDone]);
  return (
    <div className="pointer-events-none absolute top-20 left-1/2 -translate-x-1/2 z-40 px-4 py-2.5 rounded-xl bg-cyan-950/95 border border-cyan-500/50 text-cyan-200 text-xs font-semibold shadow-2xl animate-pulse max-w-md text-center">
      {message}
    </div>
  );
}

function ObjectTooltip({ objectKey, lang }) {
  const [leaving, setLeaving] = useState(false);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    setVisible(true); setLeaving(false);
    const t1 = setTimeout(() => setLeaving(true), 3600);
    const t2 = setTimeout(() => setVisible(false), 4000);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, [objectKey]);
  if (!visible) return null;
  const obj = I18N[lang].objects[objectKey];
  if (!obj) return null;
  return (
    <div className={'tooltip-card pointer-events-none absolute left-1/2 top-1/2 z-50 max-w-md w-[88%] sm:w-auto sm:min-w-[380px] -translate-x-1/2 -translate-y-1/2 ' + (leaving ? 'leaving' : '')}>
      <div className="bg-white/95 backdrop-blur-md border-2 border-cyan-600 rounded-xl shadow-2xl overflow-hidden">
        <div className="bg-gradient-to-r from-cyan-100 to-white px-4 py-2.5 flex items-center gap-2 border-b border-cyan-600/30">
          <div className="w-7 h-7 rounded-lg bg-cyan-600/15 border border-cyan-600/60 flex items-center justify-center">
            <IcInfo className="w-4 h-4 text-cyan-700" />
          </div>
          <div className="flex-1">
            <div className="text-[9px] uppercase font-mono tracking-widest text-cyan-800">IPIRANGA FUEL-HARMONY™ · {I18N[lang].layoutLabel}</div>
            <div className="text-sm font-extrabold text-slate-900 leading-tight">{obj.title}</div>
          </div>
          <div className="w-1 h-8 rounded-full bg-gradient-to-b from-cyan-600 to-transparent animate-pulse" />
        </div>
        <div className="p-4">
          <p className="text-[12px] text-slate-900 leading-relaxed font-medium">{obj.desc}</p>
        </div>
        <div className="px-4 py-1.5 bg-slate-100 border-t border-slate-300 flex items-center justify-between text-[9px] font-mono text-slate-600">
          <span className="flex items-center gap-1"><IcPointer className="w-3 h-3 text-cyan-700" /> click-to-inspect</span>
          <span>auto-dismiss · 4s</span>
        </div>
      </div>
    </div>
  );
}

function ClickRipple({ x, y, id }) {
  return <div key={id} className="click-ripple" style={{ left: x + 'px', top: y + 'px' }} />;
}

function Row({ label, value, valueClass }) {
  return (
    <div className="flex justify-between items-center py-0.5">
      <span className="text-slate-400 text-[11px]">{label}</span>
      <span className={'font-mono font-bold text-[11px] ' + (valueClass || 'text-slate-200')}>{value}</span>
    </div>
  );
}
function MiniStat({ label, value, valueClass }) {
  return (
    <div className="bg-slate-950/70 p-1.5 rounded border border-slate-800">
      <span className="text-slate-400 block text-[9px]">{label}</span>
      <span className={'font-mono font-bold text-[11px] ' + (valueClass || 'text-white')}>{value}</span>
    </div>
  );
}

function HudCard({ title, icon, children, onPulse, pulseActive, collapsed, onToggleCollapse, accent }) {
  const borderColor = accent || 'rgba(6,182,212,0.3)';
  return (
    <div
      className={'bg-slate-900/90 backdrop-blur-md rounded-xl border shadow-2xl text-slate-100 transition-all ' + (pulseActive ? 'panel-active scanline' : '')}
      style={{ borderColor }}

        <button onClick={onToggleCollapse} className="p-0.5 text-slate-400 hover:text-cyan-300 transition-colors" title="Toggle">
          <IcChevronDown className={'w-3.5 h-3.5 panel-collapse-btn ' + (collapsed ? 'collapsed' : '')} />

    </div>
  );
}

function ManualGuide({ open, onClose, lang, mode, decision, onMode, onCam }) {
  useEffect(() => {
    if (!open) return;
    const k = ev => { if (ev.key === 'Escape') onClose(); };
    window.addEventListener('keydown', k);
    return () => window.removeEventListener('keydown', k);
  }, [open]);
  const [tab, setTab] = useState(0);
  const [step, setStep] = useState(0);
  const [auto, setAuto] = useState(false);
  const [lvl, setLvl] = useState(2);
  const t = o => o[lang] || o.pt;
  useEffect(() => {
    if (!auto || !open || tab !== 1) return;
    const iv = setInterval(() => setStep(s => (s + 1) % GD_STEPS.length), 3000);
    return () => clearInterval(iv);
  }, [auto, open, tab]);
  const go = i => { setStep(i); const s = GD_STEPS[i]; if (s.mode) onMode(s.mode); if (s.cam) onCam(s.cam); };
  useEffect(() => { if (open && tab === 1 && auto) go(step); }, [step]);
  const I = I18N[lang] || I18N.pt;
  const cur = GD_STEPS[step];
  return (
    <>
      {open && (
        <aside className="shrink-0 w-full md:w-[380px] h-[46%] md:h-auto min-h-0 z-30 flex flex-col bg-slate-900 border-t-2 md:border-t-0 md:border-l-2 border-cyan-500/50 shadow-2xl">
          <div className="flex items-center justify-between gap-2 px-3 py-1.5 border-b border-slate-700 select-none">
            <div className="min-w-0">
              <span className="text-[11px] font-bold text-cyan-300">▶ {t(GD_TXT.btn)}</span>
              <span className="ml-2 text-[9px] font-mono text-amber-300">{t(GD_TXT.badge)}</span>
            </div>
            <button onClick={onClose} className="px-1.5 text-slate-400 hover:text-white" aria-label="close">✕</button>
          </div>
          <div className="flex text-[11px] font-semibold border-b border-slate-700">
            {t(GD_TXT.tabs).map((n, i) => (
              <button key={i} onClick={() => setTab(i)} className={'flex-1 py-2 ' + (tab === i ? 'text-cyan-300 border-b-2 border-cyan-400' : 'text-slate-400 hover:text-slate-200')}>{n}</button>
            ))}
          </div>
          <div className="flex-1 min-h-0 overflow-y-auto scrollbar-thin p-3 text-[12px] leading-relaxed text-slate-200">
            {tab === 0 && t(GD_TXT.what).map(([h, b], i) => (
              <div key={i} className="mb-3"><div className="text-cyan-300 font-bold text-[11px] uppercase">{h}</div><div>{b}</div></div>
            ))}
            {tab === 1 && (
              <div>
                <div className="flex flex-wrap gap-1 mb-2">
                  {GD_STEPS.map((s, i) => (
                    <button key={i} onClick={() => go(i)} className={'w-7 h-7 rounded-full text-[11px] font-bold border ' + (i === step ? 'bg-cyan-500 border-cyan-200 text-slate-900 animate-pulse' : i < step ? 'bg-cyan-900 border-cyan-600 text-cyan-200' : 'border-slate-600 text-slate-400')}>{i + 1}</button>
                  ))}
                </div>
                <div className="h-1 bg-slate-700 rounded mb-3"><div className="h-1 bg-cyan-400 rounded transition-all duration-700" style={{ width: ((step + 1) / GD_STEPS.length * 100) + '%' }} /></div>
                <div className="p-2 rounded border border-cyan-500/40 bg-slate-800/70">
                  <div className="font-bold text-cyan-300 text-[12px]">{cur.k} <span className="text-slate-400 font-mono text-[10px]">cap. {cur.c}</span></div>
                  <div className="mt-1">{t(cur.d)}</div>
                </div>
                <div className="mt-2 flex gap-2">
                  <button onClick={() => go((step + GD_STEPS.length - 1) % GD_STEPS.length)} className="px-2 py-1 rounded bg-slate-700 hover:bg-slate-600">◀</button>
                  <button onClick={() => { setAuto(a => !a); go(step); }} className="flex-1 py-1 rounded bg-cyan-700 hover:bg-cyan-600 font-semibold">{auto ? '❚❚' : '▶'} {t(GD_TXT.see)}</button>
                  <button onClick={() => go((step + 1) % GD_STEPS.length)} className="px-2 py-1 rounded bg-slate-700 hover:bg-slate-600">▶</button>
                </div>
                <div className="mt-3 p-2 rounded bg-slate-800/60 border border-slate-700 text-[11px]">
                  <div className="text-slate-400 uppercase text-[10px] font-bold">{t(GD_TXT.now)}</div>
                  <div>{(I.modeLabels || {})[mode] || mode}</div>
                  <div className="font-mono text-amber-300">{(I.recommendation || {})[decision.recommendation] || decision.recommendation} · HAZOP {(I.hazopStatus || {})[decision.hazopStatus] || decision.hazopStatus}</div>
                </div>
              </div>
            )}
            {tab === 2 && (
              <div>
                {t(GD_TXT.lv).map((n, i) => (
                  <button key={i} onClick={() => setLvl(i)} className={'w-full text-left mb-1 px-2 py-1.5 rounded border ' + (i === lvl ? 'border-cyan-400 bg-cyan-900/40' : 'border-slate-700') + (i > 2 ? ' opacity-80' : '')}>
                    <span className="font-mono text-cyan-300">{i + 1}.</span> {n} {i <= 2 ? '✔' : '⚠'}
                  </button>

                <div className="mt-2 text-[11px] text-slate-300">{lvl <= 2 ? t(GD_TXT.lvNote)[0] : t(GD_TXT.lvNote)[1]}</div>
              </div>
            )}
            {tab === 3 && (
              <div>
                {t(GD_TXT.ph).map(([n, c, d], i) => (
                  <div key={i} className="flex gap-2 mb-2"><div className="w-6 h-6 shrink-0 rounded-full bg-cyan-800 text-cyan-100 text-[11px] font-bold flex items-center justify-center">{i + 1}</div><div><b>{n}</b> <span className="text-slate-400 text-[10px] font-mono">{c}</span><div className="text-[11px]">{d}</div></div></div>
                ))}
                <button onClick={() => onMode('shadow')} className="w-full mt-1 py-1.5 rounded bg-slate-700 hover:bg-slate-600 font-semibold">{t(GD_TXT.shadow)}</button>
                <div className="mt-3 text-[11px] text-amber-200">{t(GD_TXT.status)}</div>
              </div>
            )}
            {tab === 4 && t(GD_TXT.rig).map(([h, b], i) => (
              <div key={i} className="mb-3"><div className={'font-bold text-[11px] uppercase ' + (i === 0 ? 'text-emerald-300' : i === 1 ? 'text-amber-300' : 'text-rose-300')}>{h}</div><div>{b}</div></div>
            ))}
          </div>
        </aside>
      )}
    </>
  );
}

function App() {

  const [showDrones, setShowDrones] = useState(true);

  const [patentOpen, setPatentOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const [pulseKey, setPulseKey] = useState(null);
  const pulseCounter = useRef(0);
  const [objTooltip, setObjTooltip] = useState(null);
  const [ripples, setRipples] = useState([]);
  const [cameraNonce, setCameraNonce] = useState(0);
  const [guideOpen, setGuideOpen] = useState(false);
  const [guideKey, setGuideKey] = useState(0);
  const [hudKey, setHudKey] = useState(0);

  const showToast = useCallback(msg => setToast({ msg, id: Date.now() }), []);

  useEffect(() => {
    document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang;
    document.title = 'IPIRANGA FUEL-HARMONY™ 3D — ' + (lang === 'pt' ? 'Protótipo' : lang === 'en' ? 'Prototype' : 'Prototipo');
  }, [lang]);

  const handleModeChange = useCallback(newMode => {
    setMode(newMode);
    if (newMode === 'active') setDecision(d => ({ ...d, recommendation: 'AUTHORIZE', hazopStatus: 'NORMAL', flowRateLpm: 1450, confidenceScore: 99.4 }));
    else if (newMode === 'quarantine') setDecision(d => ({ ...d, recommendation: 'HOLD_FOR_RESAMPLE', hazopStatus: 'ALERT', flowRateLpm: 0, confidenceScore: 98.7 }));
    else if (newMode === 'lockout') setDecision(d => ({ ...d, recommendation: 'REJECT_INTERLOCK', hazopStatus: 'TRIPPED', flowRateLpm: 0, confidenceScore: 100 }));
    else if (newMode === 'swarm_sync') setDecision(d => ({ ...d, recommendation: 'AUTHORIZE', hazopStatus: 'NORMAL', flowRateLpm: 400, confidenceScore: 99.9 }));
    else if (newMode === 'vru_active') setDecision(d => ({ ...d, recommendation: 'AUTHORIZE', hazopStatus: 'NORMAL', flowRateLpm: 800, confidenceScore: 99.6 }));
    else if (newMode === 'additive_injection') setDecision(d => ({ ...d, recommendation: 'AUTHORIZE', hazopStatus: 'NORMAL', flowRateLpm: 1200, confidenceScore: 99.5 }));
    else if (newMode === 'emergency_fire') setDecision(d => ({ ...d, recommendation: 'FIRE_EMERGENCY', hazopStatus: 'TRIPPED', flowRateLpm: 0, confidenceScore: 100 }));
    else setDecision(d => ({ ...d, recommendation: 'AUTHORIZE', hazopStatus: 'NORMAL', flowRateLpm: 0, confidenceScore: 99.4 }));
  }, []);

  const handleSimulateFault = useCallback(() => {
    handleModeChange('quarantine');
    setBatch(b => ({ ...b, ethanolPercent: 32.4, complianceANP: false }));
    setTanks(prev => prev.map(t => t.id === 1 ? { ...t, stratificationIndex: 0.42, temperatureC: t.temperatureC + 1.2 } : t));
    setSelectedTankId(1);
    showToast(I18N[lang].toast.decisionEval);
  }, [handleModeChange, lang, showToast]);

  // [v4.3] Valores por defecto de TODA la parte visual/opciones (todo salvo el idioma, que es preferencia del usuario)

    setCameraPreset('global'); setCameraNonce(n => n + 1);
    setCinemaMode(false); setLayout('complete'); setShowPanels(true); setShowAuthor(true);
    setShowWireframe(true); setShowParticles(true); setShowDrones(true);
    setObjTooltip(null); setRipples([]); setPulseKey(null); setToast(null);

          onToggleDrones={() => { setShowDrones(v => !v); showToast(I18N[lang].toast.swarmScan); }}
          onSelectTank={handleSelectTank}
          onPanelPulse={handlePanelPulse}
          pulseKey={pulseKey}
          cinemaMode={cinemaMode}
          onToggleCinemaMode={() => setCinemaMode(v => !v)}
          layout={layout}
          showPanels={showPanels} onTogglePanels={() => setShowPanels(v => !v)}
          showAuthor={showAuthor} onToggleAuthor={() => setShowAuthor(v => !v)}
        />
        {objTooltip && <ObjectTooltip key={objTooltip.id} objectKey={objTooltip.key} lang={lang} />}
        {ripples.map(r => <ClickRipple key={r.id} id={r.id} x={r.x} y={r.y} />)}
        {toast && <Toast key={toast.id} message={toast.msg} onDone={() => setToast(null)} />}
      </div>
      {!cinemaMode && <ManualGuide key={guideKey} open={guideOpen} onClose={() => setGuideOpen(false)} lang={lang} mode={mode} decision={decision} onMode={handleModeChange} onCam={k => setCameraPreset(k)} />}
      </div>

      <SimulationControls
        lang={lang} onLangChange={setLang}
        mode={mode} onModeChange={handleModeChange}
        cameraPreset={cameraPreset}
        onCameraChange={k => { setCameraPreset(k); }}
        onResetView={handleResetView}
        onSimulateFault={handleSimulateFault}
        onResetSystem={handleResetSystem}
        onEmergencyStop={handleEmergency}
        onOpenOmniaModal={() => { setOmniaOpen(true); showToast(I18N[lang].toast.omnia); }}
        onOpenPatentModal={() => { setPatentOpen(true); showToast(I18N[lang].toast.patent); }}
        layout={layout} setLayout={setLayout}
      />

      <OmniaModal isOpen={omniaOpen} onClose={() => setOmniaOpen(false)} lang={lang} />
      <PatentModal isOpen={patentOpen} onClose={() => setPatentOpen(false)} lang={lang} />
    </div>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
} catch (err) {
  console.error(err);
  document.getElementById('boot-error').classList.add('show');
}
setTimeout(() => {
  const root = document.getElementById('root');
  if (root && root.children.length === 0) {
    document.getElementById('boot-error').classList.add('show');
  }
}, 8000);
</script>
</body>
</html>
