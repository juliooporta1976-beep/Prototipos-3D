<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ORIÓN-BYPASS X™ — Simulador Maestro</title>
<style>
:root{
 --graphite:#2b303a;--graphite2:#343a46;--anthracite:#20242c;
 --cyan:#4FC3F7;--cyan-d:#2aa3da;--silver:#c3ccd6;--white:#f4f7fa;
 --panel:rgba(48,54,66,.86);--panel-b:rgba(150,170,190,.28);
 --txt:#e9eef4;--txt-dim:#aeb9c7;--good:#5fd6a6;--warn:#f2b45a;--bad:#f2795f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#2b303a;color:var(--txt)}
#scene{position:fixed;inset:0;z-index:0}
#labels{position:fixed;inset:0;z-index:2;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-120%);white-space:nowrap;font-size:12px;font-weight:600;color:#eef4fb;background:rgba(40,46,58,.82);border:1px solid rgba(120,200,240,.5);padding:3px 8px;border-radius:6px;letter-spacing:.2px;text-shadow:0 1px 2px rgba(0,0,0,.5);backdrop-filter:blur(2px)}
.lbl.node{border-color:rgba(120,200,240,.6)}
.lbl.hot{border-color:#f2795f;color:#ffe0d8;background:rgba(70,34,28,.85)}
.lbl.gate{border-color:#5fd6a6;color:#dcfff0;background:rgba(28,56,46,.85)}

/* ===== TOPBAR (una sola fila horizontal, altura ~52px) ===== */
#topbar{position:fixed;top:0;left:0;right:0;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;min-height:52px;background:linear-gradient(180deg,rgba(38,43,53,.95),rgba(38,43,53,.35));border-bottom:1px solid var(--panel-b)}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap;line-height:1.15;min-width:0}
.brand b{font-size:17px;letter-spacing:.5px;color:var(--cyan);white-space:nowrap}
.brand span{font-size:11px;color:var(--txt-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
#authorTag{background:#ffffff;color:#000000;font-weight:800;font-size:12px;padding:4px 10px;border-radius:6px;letter-spacing:.2px;box-shadow:0 1px 4px rgba(0,0,0,.4);white-space:nowrap}
.topright{display:flex;align-items:center;gap:10px;flex-shrink:0}
.lang{display:flex;gap:6px}
.lang button{cursor:pointer;background:rgba(60,68,82,.85);color:#dbe6f2;border:1px solid var(--panel-b);padding:6px 12px;border-radius:8px;font-weight:600;font-size:12px}
.lang button.on{background:var(--cyan);color:#0c2230;border-color:var(--cyan)}
.topbtn{cursor:pointer;background:rgba(60,68,82,.85);color:#dbe6f2;border:1px solid var(--panel-b);padding:6px 11px;border-radius:8px;font-weight:600;font-size:12px}
.topbtn:hover{background:rgba(79,195,247,.22);border-color:var(--cyan)}
.topbtn.primary{background:rgba(79,195,247,.25);border-color:var(--cyan);color:var(--cyan)}
.topbtn.primary:hover{background:var(--cyan);color:#0c2230}

/* ===== COLUMNA IZQUIERDA (controles) ===== */
#controls{position:fixed;top:60px;left:8px;bottom:40px;z-index:6;width:208px;overflow-y:auto;overflow-x:hidden;padding:8px 10px;background:var(--panel);border:1px solid var(--panel-b);border-radius:12px;backdrop-filter:blur(5px);font-size:11px;scrollbar-width:thin}
#controls h3{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--cyan);margin:8px 2px 8px}
.fn,.cam,.st{display:block;width:100%;text-align:left;cursor:pointer;margin:3px 0;padding:6px 9px;border-radius:7px;font-size:11px;font-weight:600;color:#e2ebf6;background:rgba(62,70,84,.7);border:1px solid var(--panel-b);transition:.15s}
.fn:hover,.cam:hover,.st:hover{background:rgba(79,195,247,.2);border-color:var(--cyan)}
.fn.active{background:var(--cyan);border-color:var(--cyan);color:#0c2230}
.camrow{display:flex;gap:4px;flex-wrap:wrap}
.cam{flex:1 1 46%;text-align:center;padding:5px 3px;font-size:10px}
.cam.on{background:#1f8f6b;border-color:#3fd39f;color:#fff}
.st.on{background:#2f79a8;border-color:var(--cyan);color:#fff}

/* ===== COLUMNA DERECHA (métricas arriba + info debajo) ===== */
#rightcol{position:fixed;top:60px;right:8px;bottom:200px;width:290px;display:flex;flex-direction:column;gap:8px;z-index:7;pointer-events:none;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
#rightcol>*{pointer-events:auto}

#metpanel{position:static;width:100%;padding:10px;background:var(--panel);border:1px solid var(--panel-b);border-radius:10px;backdrop-filter:blur(5px);font-size:11px}
#metpanel h4{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--cyan);margin-bottom:8px;display:flex;justify-content:space-between}
#metpanel h4 em{font-style:normal;font-size:9px;color:var(--good);border:1px solid var(--good);border-radius:4px;padding:1px 5px}
.mrow{margin:7px 0}
.mrow .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--txt-dim)}
.mrow .lab b{font-family:ui-monospace,monospace}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.mcell{background:rgba(62,70,84,.6);border:1px solid var(--panel-b);border-radius:7px;padding:6px}
.mcell span{font-size:9px;color:var(--txt-dim);display:block}
.mcell b{font-family:ui-monospace,monospace;font-size:12px;color:#eef4fb}
#spark{width:100%;height:34px;margin-top:8px;background:rgba(30,36,44,.5);border-radius:6px}

#infopanel{position:static;width:100%;max-height:none;overflow-y:auto;padding:14px;background:var(--panel);border:1px solid var(--panel-b);border-radius:12px;backdrop-filter:blur(6px);display:none;position:relative}
#infopanel.show{display:block}
#infoTitle{font-size:16px;color:var(--cyan);margin-bottom:8px;padding-right:24px}
#infoBody{font-size:13px;line-height:1.55;color:#d5dfec}
#closeInfo{position:absolute;top:10px;right:12px;cursor:pointer;background:none;border:none;color:var(--txt-dim);font-size:22px;line-height:1}
.metrics{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:rgba(62,70,84,.7);border:1px solid var(--panel-b);border-radius:9px;padding:8px}
.metric .k{font-size:10px;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.6px}
.metric .v{font-size:17px;font-weight:700;color:#eef4fb;margin-top:2px}
.metric .v.good{color:var(--good)}.metric .v.warn{color:var(--warn)}.metric .v.bad{color:var(--bad)}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.14);margin-top:6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--cyan)}

/* ===== HUD inferior derecha ===== */
#hud{position:fixed;right:8px;bottom:40px;z-index:6;width:290px;padding:9px 12px;background:var(--panel);border:1px solid var(--panel-b);border-radius:10px;backdrop-filter:blur(5px);font-size:11px}
#hud .hrow{display:flex;justify-content:space-between;align-items:center;margin:4px 0;color:var(--txt-dim)}
#hud .hrow b{color:#eef4fb;font-weight:700}
#hud .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
#hud .hbtns{display:flex;gap:6px;margin-top:9px}
#hud .hbtns button{flex:1;cursor:pointer;background:rgba(62,70,84,.85);color:#e2ebf6;border:1px solid var(--panel-b);border-radius:7px;padding:6px 0;font-size:13px;font-weight:700}
#hud .hbtns button:hover{background:rgba(79,195,247,.25)}
#hud .hbtns button.on{background:var(--cyan);border-color:var(--cyan);color:#0c2230}

/* ===== Franja inferior central (legend + evlog) ===== */
#legend{position:fixed;left:224px;right:306px;bottom:40px;z-index:6;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:6px 10px;background:var(--panel);border:1px solid var(--panel-b);border-radius:8px;font-size:10px;color:#c6d2e0}
#legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
#evlog{position:fixed;left:224px;right:306px;bottom:80px;z-index:6;max-height:120px;overflow-y:auto;overflow-x:hidden;padding:7px 9px;background:var(--panel);border:1px solid var(--panel-b);border-radius:10px;backdrop-filter:blur(5px);font-size:10px}
#evlog h4{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--cyan);margin-bottom:6px}
#evlog .ev{padding:3px 0;border-bottom:1px solid rgba(150,170,190,.14);color:#c6d2e0;line-height:1.35}
#evlog .ev b{color:var(--cyan);font-family:ui-monospace,monospace;font-size:10px}

#statusbar{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;gap:12px;padding:8px 16px;font-size:12px;color:var(--txt-dim);background:linear-gradient(0deg,rgba(38,43,53,.95),rgba(38,43,53,.2));border-top:1px solid var(--panel-b);align-items:center}
#simStatus{color:#dbe6f2;font-weight:600}
#kbd{font-size:10px;color:#8496ab;background:rgba(43,48,58,.7);padding:3px 8px;border-radius:6px;white-space:nowrap}

#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:9;background:rgba(46,58,74,.96);border:1px solid var(--cyan);color:#eef4fb;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:.3s;pointer-events:none}
#toast.show{opacity:1}

#vtip{position:fixed;z-index:9;pointer-events:none;display:none;background:rgba(40,50,64,.97);border:1px solid var(--cyan);border-radius:8px;padding:8px 10px;font-size:12px;color:#eef4fb;max-width:230px;box-shadow:0 4px 14px rgba(0,0,0,.45)}
#vtip b{color:var(--cyan)}

.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(20,24,30,.72);backdrop-filter:blur(4px);padding:16px}
.modal.show{display:flex}
.mbox{width:100%;max-width:460px;background:var(--graphite2);border:1px solid var(--cyan);border-radius:16px;padding:20px;color:#e9eef4;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.mbox h3{color:var(--cyan);font-size:16px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.mbox h3 button{background:none;border:none;color:var(--txt-dim);font-size:22px;cursor:pointer}
.mbox .sub{font-size:11px;color:var(--txt-dim);margin-bottom:12px}
.prow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(150,170,190,.16);font-size:12px}
.prow span{color:var(--txt-dim)}.prow b{text-align:right}
.mbtn{display:block;width:100%;margin-top:14px;padding:12px;border:none;border-radius:10px;background:var(--cyan);color:#0c2230;font-weight:800;font-size:13px;cursor:pointer}
.mbtn:hover{background:var(--cyan-d)}
.vctl{margin:8px 0}
.vctl label{display:flex;justify-content:space-between;font-size:11px;color:var(--txt-dim);margin-bottom:3px}
.vctl input[type=range]{width:100%;accent-color:var(--cyan)}
.vtog{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--txt-dim);margin:8px 0}
.vtog button{cursor:pointer;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:700;border:1px solid var(--panel-b);background:rgba(62,70,84,.8);color:#e2ebf6}
.vtog button.on{background:var(--cyan);color:#0c2230;border-color:var(--cyan)}
canvas{cursor:grab}

/* ===== Responsive ===== */
@media(max-width:1180px){
  .brand span{max-width:180px}
}
@media(max-width:1050px){
  .brand span{display:none}
}
@media(max-width:1150px){
  #controls{width:176px}
  #rightcol{width:230px}
  #hud{width:230px}
  #legend{left:192px;right:246px}
  #evlog{left:192px;right:246px}
}
@media(max-width:820px){
  #controls{display:none}
  #rightcol{width:220px}
  #hud{width:220px}
  #legend{left:8px;right:236px}
  #evlog{left:8px;right:236px}
  #kbd{display:none}
}
</style>
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>
<div id="toast"></div>

<header id="topbar">
  <div class="brand">
    <div id="authorTag">Dr. Julio César Oporta Barrera</div>
    <b>ORIÓN-BYPASS X™</b>
    <span data-i18n="appSub"></span>
  </div>
  <div class="topright">
    <button class="topbtn primary" id="btnPassport" data-i18n="passportBtn"></button>
    <button class="topbtn primary" id="btnResetTop" data-i18n="fnReset"></button>
    <div class="lang">
      <button data-lang="es" class="on">ES</button>
      <button data-lang="en">EN</button>
      <button data-lang="zh">中文</button>
    </div>
  </div>
</header>

<aside id="controls">
  <h3 data-i18n="camTitle"></h3>
  <div class="camrow">
    <button class="cam on" data-cam="orbit" data-i18n="camOrbit"></button>
    <button class="cam" data-cam="corridor" data-i18n="camCorridor"></button>
    <button class="cam" data-cam="chokepoint" data-i18n="camChokepoint"></button>
    <button class="cam" data-cam="vessel" data-i18n="camVessel"></button>
  </div>
  <h3 data-i18n="statesTitle"></h3>
  <button class="st on" data-st="NORMAL" data-i18n="stNormal"></button>
  <button class="st" data-st="EARLY_WARNING" data-i18n="stWarn"></button>
  <button class="st" data-st="HORMUZ_BLOCKED" data-i18n="stHormuz"></button>
  <button class="st" data-st="DUQM_EXPRESS" data-i18n="stDuqm"></button>
  <button class="st" data-st="SALALAH_DEEPSEA" data-i18n="stSalalah"></button>
  <button class="st" data-st="DEGRADED_OFFLINE" data-i18n="stDegraded"></button>
  <h3 data-i18n="fnTitle"></h3>
  <button class="fn" data-fn="guide" data-i18n="fnGuide"></button>
  <button class="fn" data-fn="engine" data-i18n="fnEngine"></button>
  <button class="fn" data-fn="upsc" data-i18n="fnUpsc"></button>
  <button class="fn" data-fn="domains" data-i18n="fnDomains"></button>
  <button class="fn" data-fn="control" data-i18n="fnControl"></button>
  <button class="fn" data-fn="scenarios" data-i18n="fnScenarios"></button>
  <button class="fn" data-fn="phases" data-i18n="fnPhases"></button>
  <button class="fn" data-fn="standards" data-i18n="fnStandards"></button>
  <button class="fn" data-fn="e2e" data-i18n="fnE2e"></button>
  <button class="fn" data-fn="compare" data-i18n="fnCompare"></button>
  <button class="fn" data-fn="impact" data-i18n="fnImpact"></button>
  <button class="fn" data-fn="routes" data-i18n="fnRoutes"></button>
  <h3 data-i18n="modTitle"></h3>
  <button class="fn" data-fn="weather" data-i18n="fnWeather"></button>
  <button class="fn" data-fn="cyber" data-i18n="fnCyber"></button>
  <button class="fn" data-fn="capacity" data-i18n="fnCapacity"></button>
  <button class="fn" data-fn="gov" data-i18n="fnGov"></button>
  <button class="fn" data-fn="convoy" data-i18n="fnConvoy"></button>
  <button class="fn" data-fn="pulse" data-i18n="fnPulse"></button>
  <button class="fn" data-fn="swarm" data-i18n="fnSwarm"></button>
  <h3 data-i18n="visualTitle"></h3>
  <div class="vctl"><label><span data-i18n="vCyan"></span><b id="vCyanV">1.0x</b></label><input type="range" id="vCyan" min="0.2" max="2.2" step="0.1" value="1"></div>
  <div class="vctl"><label><span data-i18n="vWave"></span><b id="vWaveV">1.0x</b></label><input type="range" id="vWave" min="0.1" max="3" step="0.1" value="1"></div>
  <div class="vctl"><label><span data-i18n="vParticles"></span><b id="vPartV">1.0x</b></label><input type="range" id="vPart" min="0" max="2" step="0.1" value="1"></div>
  <div class="vtog"><span data-i18n="vGrid"></span><button id="vGrid" class="on">ON</button></div>
</aside>

<div id="rightcol">
  <div id="metpanel">
    <h4><span data-i18n="metricsTitle"></span><em>LIVE</em></h4>
    <div class="mrow"><div class="lab"><span data-i18n="mIEC"></span><b id="mIECv">–</b></div><div class="bar"><i id="mIECbar"></i></div></div>
    <div class="mrow"><div class="lab"><span data-i18n="mIR"></span><b id="mIRv">–</b></div><div class="bar"><i id="mIRbar"></i></div></div>
    <div class="mgrid">
      <div class="mcell"><span data-i18n="mFlow"></span><b id="mFlowv">–</b></div>
      <div class="mcell"><span data-i18n="mFleet"></span><b id="mFleetv">–</b></div>
      <div class="mcell"><span data-i18n="mUPSC"></span><b id="mUPSCv">–</b></div>
      <div class="mcell"><span data-i18n="mCO2"></span><b id="mCO2v">–</b></div>
      <div class="mcell"><span data-i18n="mFDS"></span><b id="mFDSv">–</b></div>
      <div class="mcell"><span data-i18n="mAvgCost"></span><b id="mCostv">–</b></div>
    </div>
    <canvas id="spark" width="216" height="34"></canvas>
  </div>

  <section id="infopanel">
    <button id="closeInfo">×</button>
    <div id="infoTitle"></div>
    <div id="infoBody"></div>
    <div id="infoMetrics" class="metrics"></div>
  </section>
</div>

<div id="evlog"><h4 data-i18n="eventTitle"></h4><div id="evList"></div></div>
<div id="legend"></div>
<div id="vtip"></div>

<div id="hud">
  <div class="hrow"><span>🕒 UTC</span><b id="hudTime">--:--</b></div>
  <div class="hrow"><span data-i18n="hudState"></span><b id="hudStateV">—</b></div>
  <div class="hrow"><span data-i18n="hudAlert"></span><b id="hudAlertV"><span class="dot"></span>—</b></div>
  <div class="hrow"><span data-i18n="hudSea"></span><b id="hudSeaV">—</b></div>
  <div class="hrow"><span data-i18n="hudActive"></span><b id="hudRouteV">A/B/C</b></div>
  <div class="hrow"><span data-i18n="hudPhase"></span><b id="hudPhaseV">—</b></div>
  <div class="hbtns"><button id="btnPause" title="Space">⏸</button><button id="btnSlow">–</button><button id="btnFast">+</button></div>
</div>

<footer id="statusbar">
  <span id="simStatus"></span>
  <span id="kbd" data-i18n="kbdHelp"></span>
  <span id="authorNote">Dr. Julio César Oporta Barrera · OBX-001</span>
</footer>

<div class="modal" id="passportModal"><div class="mbox">
  <h3><span data-i18n="pTitle"></span><button id="pClose">×</button></h3>
  <div class="sub">UUID: OBX-2026-SHP-09884</div>
  <div class="prow"><span data-i18n="pRoute"></span><b><span data-i18n="pRouteMain"></span></b></div>
  <div class="prow"><span data-i18n="pAltA"></span><b><span data-i18n="pRouteA"></span></b></div>
  <div class="prow"><span data-i18n="pAltB"></span><b><span data-i18n="pRouteB"></span></b></div>
  <div class="prow"><span data-i18n="pUpsc"></span><b id="pUpscV" style="color:var(--good)">–</b></div>
  <div class="prow"><span data-i18n="pCustoms"></span><b><span data-i18n="pImoFal"></span></b></div>
  <div class="prow"><span data-i18n="pVerified"></span><b><span data-i18n="authorFull"></span></b></div>
  <button class="mbtn" id="pOk" data-i18n="pClose2"></button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const I18N={
es:{
appSub:'Sistema Adaptativo de Continuidad Marítima',
camTitle:'Cámaras',camOrbit:'Órbita',camCorridor:'Corredor',camChokepoint:'Estrecho',camVessel:'Buque',
statesTitle:'Estados operativos',stNormal:'Normal',stWarn:'Alerta temprana',stHormuz:'Ormuz bloqueado',stDuqm:'Express Duqm',stSalalah:'Oceánico Salalah',stDegraded:'Degradado offline',
fnTitle:'Funciones y simulaciones',
fnGuide:'¿Qué es?',fnEngine:'Motor de Resiliencia IA',fnUpsc:'Último Punto Seguro de Cambio',fnDomains:'Dominios de fallo',fnControl:'Centro de control',fnScenarios:'Escenarios',fnPhases:'Fases del proyecto',fnStandards:'Estándares y cumplimiento',fnE2e:'Modelo E2E',fnCompare:'Comparación de crisis',fnImpact:'Impacto en Centroamérica',fnRoutes:'Rutas A/B/C',fnReset:'Reiniciar',
modTitle:'Módulos avanzados',fnWeather:'Estado del mar',fnCyber:'Operación degradada',fnCapacity:'Capacidad de contingencia',fnGov:'Autorización (HITL)',fnConvoy:'Convoy escoltado',fnPulse:'Pulso biomecánico',fnSwarm:'Enjambre adaptativo',
visualTitle:'Control visual',vCyan:'Intensidad cian',vWave:'Velocidad oleaje',vParticles:'Densidad partículas',vGrid:'Rejilla holográfica',
nGulf:'Golfo Pérsico',nOrmuz:'Estrecho de Ormuz',nLand:'Corredor terrestre',nGate:'Puerta marítima exterior (Khor Fakkan / Duqm)',nIndian:'Océano Índico',nDest:'Destino',

}

function buildShip(hullColor){
 const s=new THREE.Group();
 const hullMat=new THREE.MeshPhongMaterial({color:hullColor,shininess:35});
 const redMat=new THREE.MeshPhongMaterial({color:0x8a1f14,shininess:20});
 const whiteMat=new THREE.MeshPhongMaterial({color:0xf4f7fa,shininess:45});
 const deckMat=new THREE.MeshPhongMaterial({color:0x343a46});
 const hull=new THREE.Mesh(new THREE.BoxGeometry(9,1.7,2.8),hullMat);hull.position.y=1.1;s.add(hull);
 const bowGeo=new THREE.CylinderGeometry(0,1.6,2.8,4,1);
 const bow=new THREE.Mesh(bowGeo,hullMat);bow.rotation.z=-Math.PI/2;bow.rotation.y=Math.PI/4;bow.scale.set(.9,1.1,1);bow.position.set(5.2,1.1,0);s.add(bow);
 const boot=new THREE.Mesh(new THREE.BoxGeometry(9,.35,2.9),redMat);boot.position.y=.4;s.add(boot);
 const deck=new THREE.Mesh(new THREE.BoxGeometry(8.4,.25,2.5),deckMat);deck.position.y=2;s.add(deck);
 const cols=[0xf2b45a,0x4FC3F7,0xe74c3c,0x2ecc71,0xf4f7fa,0x3498db];
 for(let i=0;i<4;i++)for(let j=0;j<2;j++){
  const c=new THREE.Mesh(new THREE.BoxGeometry(1.1,.55,.72),new THREE.MeshPhongMaterial({color:cols[(i+j)%cols.length]}));
  c.position.set(3.2-i*1.6,2.35,j*1-0.5);s.add(c);
 }
 const sup=new THREE.Mesh(new THREE.BoxGeometry(1.6,2,2.3),whiteMat);sup.position.set(-3.6,3.1,0);s.add(sup);
 const bridge=new THREE.Mesh(new THREE.BoxGeometry(1.7,.5,2.4),new THREE.MeshPhongMaterial({color:0x2b303a}));bridge.position.set(-3.6,4.2,0);s.add(bridge);
 const fun=new THREE.Mesh(new THREE.CylinderGeometry(.45,.55,1.4,14),redMat);fun.position.set(-4.4,4.4,0);s.add(fun);
 s.scale.set(1.15,1.15,1.15);return s;
}

function P(k){return NODES[k].pos.clone();}
const ROUTES={
 A:{color:0x4FC3F7,pts:[P('gulf'),P('ormuz'),new THREE.Vector3(2,0,-14),P('indian'),P('dest')]},
 B:{color:0x5fd6a6,pts:[P('gulf'),new THREE.Vector3(-34,0,2),P('land'),P('gate'),P('indian'),P('dest')]},
 C:{color:0xf2b45a,pts:[P('gulf'),new THREE.Vector3(-30,0,14),P('land'),new THREE.Vector3(14,0,22),P('indian'),P('dest')]}
};
function curveOf(pts){return new THREE.CatmullRomCurve3(pts.map(p=>p.clone().setY(1.2)),false,'catmullrom',.2);}
Object.keys(ROUTES).forEach(k=>{const r=ROUTES[k];r.curve=curveOf(r.pts);
 const g=new THREE.TubeGeometry(r.curve,120,.45,8,false);
 r.mat=new THREE.MeshPhongMaterial({color:r.color,emissive:r.color,emissiveIntensity:.35,transparent:true,opacity:.88});
 r.mesh=new THREE.Mesh(g,r.mat);scene.add(r.mesh);});

const _v=new THREE.Vector3();
function projectLabels(){
 const ctrl=document.getElementById('controls');
 const rcol=document.getElementById('rightcol');
 const hud=document.getElementById('hud');
 const cR=ctrl?ctrl.getBoundingClientRect():{right:0,top:0,bottom:0};
 const rR=rcol?rcol.getBoundingClientRect():{left:innerWidth,top:0,bottom:0};
 const hR=hud?hud.getBoundingClientRect():{left:innerWidth,top:innerHeight,bottom:innerHeight};
 const M=6;
 LABELS.forEach(L=>{
  _v.copy(L.pos);_v.y+=L.y;_v.project(camera);
  const x=(_v.x*.5+.5)*innerWidth, y=(-_v.y*.5+.5)*innerHeight;
  if(_v.z>1||_v.z<-1){L.el.style.display='none';return;}
  const overLeftPanel  = x < cR.right + M && y > cR.top - 24 && y < cR.bottom + 24;
  const overRightCol   = x > rR.left - M && y > rR.top - 24 && y < rR.bottom + 24;
  const overHud        = x > hR.left - M && y > hR.top - 24 && y < hR.bottom + 24;
  if(overLeftPanel || overRightCol || overHud){L.el.style.display='none';return;}
  L.el.style.display='block';
  L.el.style.left=x+'px';L.el.style.top=y+'px';
 });
}

function drawSpark(){
 const c=document.getElementById('spark');const ctx=c.getContext('2d');
 sparkData.shift();sparkData.push(metVals.flow/300);
 ctx.clearRect(0,0,c.width,c.height);
 const w=c.width,h=c.height,n=sparkData.length,dx=w/n;
 ctx.strokeStyle='rgba(79,195,247,.7)';ctx.lineWidth=1.5;ctx.beginPath();
 for(let i=0;i<n;i++){const y=h-sparkData[i]/3*h;i===0?ctx.moveTo(i*dx,y):ctx.lineTo(i*dx,y);}
 ctx.stroke();
 ctx.fillStyle='rgba(79,195,247,.12)';ctx.beginPath();ctx.moveTo(0,h);
 for(let i=0;i<n;i++)ctx.lineTo(i*dx,h-sparkData[i]/3*h);
 ctx.lineTo(w,h);ctx.fill();
}

 setStatus(t('fn'+fn.charAt(0).toUpperCase()+fn.slice(1)));
}

function renderLegend(){document.getElementById('legend').innerHTML=[['#4FC3F7','legR'],['#5fd6a6','legB'],['#f2b45a','legC'],['#f4f7fa','legShip']].map(a=>'<span><i style="background:'+a[0]+'"></i>'+t(a[1])+'</span>').join('');}
function reRenderSim(){if(!activeFn)return;if(activeFn==='scenarios')scenIdx=(scenIdx+2)%3;else if(activeFn==='phases')phaseIdx=(phaseIdx+4)%5;else if(activeFn==='routes')routeIdx=(routeIdx+2)%3;else if(activeFn==='weather')seaState=(seaState+2)%3;runSim(activeFn);}
function applyI18n(){document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));document.documentElement.lang=lang;refreshLabelText();renderLegend();if(activeFn&&panel.classList.contains('show'))reRenderSim();else setStatus(t('ready'));updateHUD();}

function updateHUD(){
 const d=new Date();document.getElementById('hudTime').textContent=('0'+d.getUTCHours()).slice(-2)+':'+('0'+d.getUTCMinutes()).slice(-2)+':'+('0'+d.getUTCSeconds()).slice(-2);
 const stKey={NORMAL:'stNormal',EARLY_WARNING:'stWarn',HORMUZ_BLOCKED:'stHormuz',DUQM_EXPRESS:'stDuqm',SALALAH_DEEPSEA:'stSalalah',DEGRADED_OFFLINE:'stDegraded'}[opState]||'stNormal';
 document.getElementById('hudStateV').textContent=t(stKey);
 const ac=['#5fd6a6','#f2b45a','#f2795f'][alertLevel];
 document.getElementById('hudAlertV').innerHTML='<span class="dot" style="background:'+ac+'"></span>'+t('alert'+alertLevel);
 document.getElementById('hudSeaV').textContent=t('sea'+seaState);
 const vis=Object.keys(ROUTES).filter(k=>ROUTES[k].mesh.visible);document.getElementById('hudRouteV').textContent=vis.join('/')||'—';
 document.getElementById('hudPhaseV').textContent=(phaseIdx+1)+'/5';
}
setInterval(updateHUD,600);

const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),vtip=document.getElementById('vtip');
function pick(ev){mouse.x=(ev.clientX/innerWidth)*2-1;mouse.y=-(ev.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);
 const hits=ray.intersectObjects(scene.children,true);for(const h of hits){let o=h.object;while(o&&!(o.userData&&o.userData.kind))o=o.parent;if(o&&o.userData&&o.userData.kind)return o;}return null;}
renderer.domElement.addEventListener('mousemove',ev=>{const o=pick(ev);
 if(o&&o.userData.kind==='ship'){const r=o.userData.ref;vtip.style.display='block';vtip.style.left=(ev.clientX+14)+'px';vtip.style.top=(ev.clientY+14)+'px';
 vtip.innerHTML='<b>'+t('tipTitle')+'</b><br>'+t('tipRoute')+': '+r.route+'<br>'+t('tipProg')+': '+Math.round(r.t*100)+'%<br>'+t('tipCargo')+': '+r.cargo+' TEU';renderer.domElement.style.cursor='pointer';}
 else if(o&&o.userData.kind==='node'){vtip.style.display='block';vtip.style.left=(ev.clientX+14)+'px';vtip.style.top=(ev.clientY+14)+'px';
 vtip.innerHTML='<b>'+t(nodeKeyMap[o.userData.key])+'</b><br>'+t('tipNode');renderer.domElement.style.cursor='pointer';}
 else{vtip.style.display='none';renderer.domElement.style.cursor='grab';}});
renderer.domElement.addEventListener('click',ev=>{const o=pick(ev);if(!o)return;
 if(o.userData.kind==='ship'){const r=o.userData.ref;setCam('vessel');toast(t('tipTitle')+' · '+r.route+' · '+Math.round(r.t*100)+'%');}
 else if(o.userData.kind==='node'){const k=o.userData.key;orbitFree=false;camMode='free';camGoal.tgt.copy(NODES[k].pos);camGoal.pos.set(NODES[k].pos.x-10,15,NODES[k].pos.z+22);toast(t(nodeKeyMap[k]));}});
addEventListener('keydown',e=>{const p=document.getElementById('btnPause');
 if(e.code==='Space'){paused=!paused;p.classList.toggle('on',paused);e.preventDefault();}
 else if(e.key==='+'||e.key==='='){speedMul=Math.min(4,speedMul+.5);toast('×'+speedMul);}
 else if(e.key==='-'||e.key==='_'){speedMul=Math.max(.5,speedMul-.5);toast('×'+speedMul);}
 else if(['1','2','3','4'].includes(e.key)){setCam(['orbit','corridor','chokepoint','vessel'][+e.key-1]);}});
document.getElementById('btnPause').onclick=function(){paused=!paused;this.classList.toggle('on',paused);};
document.getElementById('btnSlow').onclick=()=>{speedMul=Math.max(.5,speedMul-.5);toast('×'+speedMul);};
document.getElementById('btnFast').onclick=()=>{speedMul=Math.min(4,speedMul+.5);toast('×'+speedMul);};

document.querySelectorAll('.st').forEach(b=>b.onclick=()=>{
 const st=b.dataset.st;
 opState=st;
 document.querySelectorAll('.st').forEach(x=>x.classList.toggle('on',x.dataset.st===st));
 if(st==='NORMAL'){resetScene();}
 else if(st==='HORMUZ_BLOCKED'){resetScene();opState=st;setDomainFailure(true);showRoutes(['B','C']);}
 else if(st==='EARLY_WARNING'){resetScene();opState=st;alertLevel=1;showRoutes(['A','B','C']);logEv('Early warning','Amber');}
 else if(st==='DUQM_EXPRESS'){resetScene();opState=st;showRoutes(['B']);highlight('B');logEv('Duqm Express route','Green');}
 else if(st==='SALALAH_DEEPSEA'){resetScene();opState=st;showRoutes(['C']);highlight('C');logEv('Salalah deep-sea route','Green');}
 else if(st==='DEGRADED_OFFLINE'){runSim('cyber');return;}
 startMetEngine();
});

document.getElementById('vCyan').oninput=function(){vCyan=+this.value;document.getElementById('vCyanV').textContent=vCyan.toFixed(1)+'x';applyVC();};
document.getElementById('vCyan').addEventListener('change',function(){toast(t('vCyan')+' '+vCyan.toFixed(1)+'x');logEv(t('vCyan')+' '+vCyan.toFixed(1)+'x','Green');});
document.getElementById('vWave').oninput=function(){vWave=+this.value;document.getElementById('vWaveV').textContent=vWave.toFixed(1)+'x';};
document.getElementById('vWave').addEventListener('change',function(){toast(t('vWave')+' '+vWave.toFixed(1)+'x');logEv(t('vWave')+' '+vWave.toFixed(1)+'x','Green');});
document.getElementById('vPart').oninput=function(){vPart=+this.value;document.getElementById('vPartV').textContent=vPart.toFixed(1)+'x';applyVC();};
document.getElementById('vPart').addEventListener('change',function(){toast(t('vParticles')+' '+vPart.toFixed(1)+'x');logEv(t('vParticles')+' '+vPart.toFixed(1)+'x','Green');});
document.getElementById('vGrid').onclick=function(){showGrid=!showGrid;this.classList.toggle('on',showGrid);this.textContent=showGrid?'ON':'OFF';toast(t('vGrid')+': '+(showGrid?'ON':'OFF'));logEv(t('vGrid')+': '+(showGrid?'ON':'OFF'),showGrid?'Green':'Amber');};

document.getElementById('btnPassport').onclick=()=>document.getElementById('passportModal').classList.add('show');
document.getElementById('pClose').onclick=()=>document.getElementById('passportModal').classList.remove('show');
document.getElementById('pOk').onclick=()=>document.getElementById('passportModal').classList.remove('show');

function updateUPSC(){document.getElementById('pUpscV').textContent=govHold?'HOLD':(metVals.upsc>0?'SAFE ('+metVals.upsc+'m)':'CLOSED');}
setInterval(updateUPSC,500);

document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.querySelectorAll('.lang button').forEach(x=>x.classList.toggle('on',x===b));applyI18n();});
const CAMKEY={orbit:'camOrbit',corridor:'camCorridor',chokepoint:'camChokepoint',vessel:'camVessel'};
function camSim(c){
 if(c==='orbit'){orbitFree=true;showRoutes(['A','B','C']);}
 else if(c==='corridor'){highlight('B');}
 else if(c==='chokepoint'){highlight('A');}
 toast(t(CAMKEY[c]));logEv(t('camTitle')+': '+t(CAMKEY[c]),'Green');
}
document.querySelectorAll('.cam').forEach(b=>b.onclick=()=>{setCam(b.dataset.cam);camSim(b.dataset.cam);});
document.querySelectorAll('.fn').forEach(b=>b.onclick=()=>runSim(b.dataset.fn));

document.getElementById('btnResetTop').onclick=()=>{resetScene();setCam('orbit');panel.classList.remove('show');activeFn=null;document.querySelectorAll('.fn').forEach(b=>b.classList.remove('active'));setStatus(t('ready'));logEv(t('fnReset'),'Green');openInfo('Reset','<p>'+t('simReset')[0]+'</p><p>'+t('simReset')[1]+'</p>',[]);};

refreshLabelText();renderLegend();applyI18n();setCam('orbit');setStatus(t('ready'));startMetEngine();
</script>
</body>
</html>
