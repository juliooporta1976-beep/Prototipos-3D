<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIOPARK 3D — Simulador de Ecosistema Industrial</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root { --bg: #030712; --panel: rgba(3,7,18,0.82); --accent: #4dd0e1; --accent2: #00e676; --border: rgba(77,208,225,0.15); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: #e2e8f0; overflow: hidden; height: 100vh; }
  .font-orbitron { font-family: 'Orbitron', monospace; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(77,208,225,0.25); border-radius: 10px; }
  input[type=range] { -webkit-appearance: none; width: 100%; height: 4px; background: #1e293b; border-radius: 4px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 8px rgba(77,208,225,0.5); }
  .panel-section { background: rgba(15,23,42,0.5); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); font-weight: 700; margin-bottom: 10px; }
  .mode-btn, .shader-btn { padding: 5px 4px; border-radius: 20px; font-size: 10px; font-weight: 600; border: 1px solid var(--border); background: rgba(15,23,42,0.6); color: #94a3b8; cursor: pointer; transition: all 0.25s; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mode-btn:hover, .shader-btn:hover { color: #fff; border-color: var(--accent); }
  .mode-btn.active, .shader-btn.active { background: var(--accent); color: #030712; border-color: var(--accent); box-shadow: 0 0 12px rgba(77,208,225,0.35); }
  .lang-btn { padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: transparent; color: #94a3b8; cursor: pointer; transition: all 0.25s; }
  .lang-btn:hover { color: #fff; border-color: var(--accent); }
  .lang-btn.active { background: var(--accent); color: #030712; border-color: var(--accent); }
  .hud-btn { background: var(--panel); backdrop-filter: blur(12px); border: 1px solid var(--border); color: #e2e8f0; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.25s; display: flex; align-items: center; gap: 6px; }
  .hud-btn:hover { background: var(--accent); color: #030712; border-color: var(--accent); }
  .hud-btn.active { background: var(--accent); color: #030712; border-color: var(--accent); }
  .node-btn { font-size: 11px; text-align: left; padding: 8px; border-radius: 8px; border: 1px solid rgba(77,208,225,0.1); background: rgba(15,23,42,0.4); color: #94a3b8; cursor: pointer; transition: all 0.25s; }
  .node-btn:hover { color: #fff; border-color: rgba(77,208,225,0.4); }
  .node-btn.active { background: rgba(77,208,225,0.15); color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .badge { font-size: 9px; padding: 2px 10px; border-radius: 20px; font-weight: 700; letter-spacing: 0.08em; }
  @keyframes pulse-glow { 0%,100% { box-shadow: 0 0 8px rgba(77,208,225,0.2); } 50% { box-shadow: 0 0 20px rgba(77,208,225,0.5); } }
  .pulse-border { animation: pulse-glow 2s ease-in-out infinite; }
  @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app" class="flex flex-col h-screen select-none">
  <!-- HEADER -->
  <header class="bg-[#030712]/90 backdrop-blur-md border-b border-teal-500/20 px-5 py-2 flex flex-wrap justify-between items-center z-30 shrink-0">
    <div class="flex items-center gap-3">
      <div class="flex gap-2">
        <span class="badge bg-teal-500/15 text-cyan-300 border border-teal-500/30">PATENT DISCLOSURE</span>
        <span class="badge bg-rose-500/15 text-rose-400 border border-rose-500/30">3D MASTER</span>
      </div>
      <div>
        <h1 id="mainTitle" class="text-lg font-extrabold text-white tracking-tight font-orbitron"></h1>
        <p id="mainSubtitle" class="text-[11px] text-slate-400"></p>
      </div>
    </div>
    <div class="flex items-center gap-4 border-l border-teal-500/20 pl-4">
      <div class="text-right">
        <div id="authorName" class="font-bold text-rose-400 text-sm"></div>
        <div id="authorTitle" class="text-[10px] text-slate-400"></div>
        <div id="authorReg" class="text-[9px] text-slate-500 font-mono"></div>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <div class="flex flex-1 overflow-hidden">
    <!-- LEFT PANEL -->
    <aside class="w-[310px] min-w-[310px] bg-[#030712]/80 backdrop-blur-sm border-r border-teal-500/15 p-3.5 overflow-y-auto flex flex-col gap-3 z-20 shrink-0">
      <!-- Language -->
      <div class="panel-section">
        <div class="section-title" data-i18n="lang"></div>
        <div id="langBtns" class="flex gap-2"></div>
      </div>
      <!-- Modes -->
      <div class="panel-section">
        <div class="section-title" data-i18n="modes"></div>
        <div id="modeBtns" class="grid grid-cols-4 gap-1.5"></div>
      </div>
      <!-- Params -->
      <div class="panel-section space-y-3">
        <div class="section-title" data-i18n="params"></div>
        <div id="sliderContainer"></div>
      </div>
      <!-- Shaders -->
      <div class="panel-section">
        <div class="section-title" data-i18n="shaders"></div>
        <div id="shaderBtns" class="grid grid-cols-3 gap-1.5"></div>
      </div>
      <!-- Narrative -->
      <div class="panel-section border-l-2 !border-amber-500">
        <div class="section-title !text-amber-400" data-i18n="narrativeTitle"></div>
        <p id="narrativeText" class="text-xs text-slate-300 italic leading-relaxed"></p>
      </div>
    </aside>

    <!-- VIEWPORT -->
    <div class="flex-1 relative bg-[#030712] overflow-hidden">
      <div id="threeContainer" class="w-full h-full"></div>
      <!-- HUD Telemetry -->
      <div id="hudOverlay" class="absolute top-4 right-4 bg-[#030712]/80 backdrop-blur-md border border-teal-500/20 rounded-xl p-3 text-[11px] font-mono text-cyan-400 pointer-events-none z-20 min-w-[165px] space-y-1"></div>
      <!-- Bottom Controls -->
      <div class="absolute bottom-5 left-1/2 -translate-x-1/2 flex items-center gap-2 z-20">
        <button class="hud-btn" id="btnZoomIn" title="Zoom In"><i class="fa-solid fa-magnifying-glass-plus text-xs"></i></button>
        <button class="hud-btn" id="btnZoomOut" title="Zoom Out"><i class="fa-solid fa-magnifying-glass-minus text-xs"></i></button>
        <button class="hud-btn" id="btnRotation"><i class="fa-solid fa-pause text-xs"></i> <span></span></button>
        <button class="hud-btn" id="btnReset"><i class="fa-solid fa-rotate-left text-xs"></i> <span></span></button>
        <button class="hud-btn" id="btnAR"><i class="fa-solid fa-camera text-xs"></i> <span>AR</span></button>
          </div>
      <!-- Mode/Shader indicator -->
      <div id="modeIndicator" class="absolute top-4 left-4 bg-[#030712]/80 backdrop-blur-md border border-teal-500/20 rounded-xl px-4 py-2 z-20 pointer-events-none">
        <div class="text-[9px] uppercase tracking-wider text-slate-500 mb-0.5" data-i18n="modes"></div>
        <div id="currentModeName" class="text-sm font-bold text-cyan-400 font-orbitron"></div>
        <div class="text-[9px] uppercase tracking-wider text-slate-500 mt-1.5 mb-0.5" data-i18n="shaders"></div>
        <div id="currentShaderName" class="text-sm font-bold text-amber-400 font-orbitron"></div>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <aside class="w-[310px] min-w-[310px] bg-[#030712]/80 backdrop-blur-sm border-l border-teal-500/15 p-3.5 overflow-y-auto flex flex-col gap-3 z-20 shrink-0">
      <!-- Node Info -->
      <div class="panel-section">
        <h3 id="activeNodeName" class="text-sm font-bold text-white mb-1"></h3>
        <p id="activeNodeDesc" class="text-xs text-slate-300 leading-relaxed mb-2.5"></p>
        <div id="activeNodeStats" class="text-[11px] text-cyan-400 font-mono bg-[#030712] p-2 rounded-md border border-teal-500/10 whitespace-pre-line"></div>
      </div>
      <!-- Module Selector -->
      <div class="panel-section">
        <div class="section-title" data-i18n="moduleSelect"></div>
        <div id="nodeBtns" class="grid grid-cols-2 gap-1.5"></div>
      </div>
      <!-- Compendium -->
      <div class="flex-1 min-h-[120px] flex flex-col">
        <div class="section-title" data-i18n="bookletTitle"></div>
        <div id="chaptersContainer" class="space-y-2 overflow-y-auto pr-1 max-h-52"></div>
      </div>
      <!-- Financial -->
      <div class="panel-section space-y-1">
        <h4 id="finTitle" class="text-xs font-bold text-white mb-1"></h4>
        <p id="finText1" class="text-[11px] text-slate-300 leading-normal"></p>
        <p id="finText2" class="text-[11px] text-cyan-400 leading-normal font-semibold"></p>
      </div>
    </aside>
  </div>
</div>

    },
    set(target, prop, value) {
      if (prop === 'body' || prop === 'liquid' || prop === 'reflection' || prop === 'label' || prop === 'cap') {
        return true;
      }
      target[prop] = value;
      return true;
    }
  });

  // Guardar referencia al sprite para animaciones
  group.userData.sprite = sprite;
  group.userData.spriteMat = spriteMat;

  // Ajustar escala y posición para que encaje en la escena
  group.scale.set(0.8, 0.8, 0.8);
  group.position.set(0, 0.45, 0);

  return group;
}

function initScene() {
  const container = document.getElementById('threeContainer');
  const w = container.clientWidth, h = container.clientHeight;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x030712);
  scene.fog = new THREE.FogExp2(0x030712, 0.0035);

  camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
  camera.position.set(18, 12, 22);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(w, h);
  originalPixelRatio = Math.min(window.devicePixelRatio, 2);
  renderer.setPixelRatio(originalPixelRatio);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  container.appendChild(renderer.domElement);

  labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(w, h);
  labelRenderer.domElement.style.position = 'absolute';
  labelRenderer.domElement.style.top = '0';
  labelRenderer.domElement.style.left = '0';
  labelRenderer.domElement.style.pointerEvents = 'none';
  container.appendChild(labelRenderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.8;
  controls.minDistance = 6;
  controls.maxDistance = 45;
  controls.maxPolarAngle = Math.PI / 2.2;
  controls.target.set(0, 0.5, 0);

  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(new THREE.Vector2(w, h), 0.25, 0.5, 0.1);
  composer.addPass(bloomPass);

  // Luces
  lights.ambient = new THREE.AmbientLight(0x446688, 0.4);
  scene.add(lights.ambient);
  lights.key = new THREE.DirectionalLight(0xffeedd, 2.5);
  lights.key.position.set(15, 20, 10);
  lights.key.castShadow = true;
  lights.key.shadow.mapSize.set(2048, 2048);
  scene.add(lights.key);
  lights.fill = new THREE.DirectionalLight(0x4fc3f7, 0.9);
  lights.fill.position.set(-12, 8, -10);
  scene.add(lights.fill);
  lights.rim = new THREE.DirectionalLight(0x88ccff, 0.6);
  lights.rim.position.set(-5, 3, 18);
  scene.add(lights.rim);
  lights.center = new THREE.PointLight(0x4fc3f7, 1.5, 30);
  lights.center.position.set(0, 3, 0);
  scene.add(lights.center);

  // Suelo
  groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.7, metalness: 0.2, transparent: true, opacity: 0.9 });
  const ground = new THREE.Mesh(new THREE.CircleGeometry(25, 64), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.1;
  ground.receiveShadow = true;
  scene.add(ground);

  ringMat = new THREE.MeshStandardMaterial({ color: 0x4fc3f7, emissive: 0x4fc3f7, emissiveIntensity: 0.15, transparent: true, opacity: 0.2, side: THREE.DoubleSide });
  for (let r = 5; r <= 15; r += 5) {
    const ring = new THREE.Mesh(new THREE.RingGeometry(r - 0.05, r + 0.05, 80), ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.01;
    scene.add(ring);
  }

  // Plano de escaneo para HOLO
  const scanCanvas = document.createElement('canvas');
  scanCanvas.width = 512; scanCanvas.height = 512;
  const sctx = scanCanvas.getContext('2d');
  sctx.clearRect(0, 0, 512, 512);
  for (let i = 0; i < 512; i += 3) {
    sctx.fillStyle = 'rgba(100,200,255,0.04)';
    sctx.fillRect(0, i, 512, 1);
  }
  const scanTex = new THREE.CanvasTexture(scanCanvas);
  scanPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 30),
    new THREE.MeshBasicMaterial({ map: scanTex, transparent: true, opacity: 0.25, side: THREE.DoubleSide, depthWrite: false })
  );
  scanPlane.rotation.x = Math.PI / 2;
  scanPlane.visible = false;
  scene.add(scanPlane);

  createComponents();
  createSwarmParticles();

  window.addEventListener('resize', onResize);
}

function createSwarmParticles() {
  const count = 300;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const speeds = new Float32Array(count);
  const angles = new Float32Array(count);
  const radii = new Float32Array(count);
  const heights = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 2 + Math.random() * 12;
    pos[i*3] = Math.cos(a) * r;
    pos[i*3+1] = 0.2 + Math.random() * 2.5;
    pos[i*3+2] = Math.sin(a) * r;
    speeds[i] = 0.3 + Math.random() * 0.5;
    angles[i] = a; radii[i] = r; heights[i] = 0.2 + Math.random() * 2.5;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color: 0x4fc3f7, size: 0.15, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
  swarmParticles = new THREE.Points(geo, mat);
  swarmParticles.userData = { speeds, angles, radii, heights };
  scene.add(swarmParticles);
}

function resetToDefaults() {
  scene.background.set(0x030712);
  scene.fog = new THREE.FogExp2(0x030712, 0.0035);
  bloomPass.strength = opMode === 'STANDARD' ? 0.25 : getModeBloom(opMode);
  renderer.toneMappingExposure = 1.2;

  if (renderer.getPixelRatio() < 0.5) {
    renderer.setPixelRatio(originalPixelRatio);
    const cw = renderer.domElement.parentElement.clientWidth;
    const ch = renderer.domElement.parentElement.clientHeight;
    renderer.setSize(cw, ch);
  }

  scanPlane.visible = false;

  groundMat.color.set(0x1a1a2e); groundMat.opacity = 0.9;
  ringMat.color.set(0x4fc3f7); ringMat.emissive.set(0x4fc3f7); ringMat.emissiveIntensity = 0.15; ringMat.opacity = 0.2;

  lights.ambient.color.set(0x446688); lights.ambient.intensity = 0.4;
  lights.key.color.set(0xffeedd); lights.key.intensity = 2.5;
  lights.fill.color.set(0x4fc3f7); lights.fill.intensity = 0.9;
  lights.rim.color.set(0x88ccff); lights.rim.intensity = 0.6;
  lights.center.color.set(0x4fc3f7); lights.center.intensity = 1.5;

  matRefs.forEach(mr => {
    mr.mat.color.set(mr.origColor);
    mr.mat.emissive.set(mr.origEmissive);
    mr.mat.emissiveIntensity = mr.origEmissiveIntensity;
    mr.mat.opacity = mr.origOpacity;
    mr.mat.wireframe = mr.origWireframe;
    mr.mat.transparent = mr.origOpacity < 1;
  });

  bottleMats.body.color.set(0xD4A373);
  bottleMats.body.emissive.set(0x3D2B1F);
  bottleMats.body.emissiveIntensity = 0.08;
  bottleMats.body.opacity = 0.92;
  bottleMats.body.wireframe = false;
  bottleMats.body.transparent = true;
  bottleMats.label.visible = true;
  bottleMats.label.transparent = false;
  bottleMats.label.opacity = 1;
  bottleMats.label.emissive.set(0x000000);
  bottleMats.label.emissiveIntensity = 0;

  swarmParticles.material.color.set(0x4fc3f7);
  swarmParticles.material.opacity = 0.8;
  swarmParticles.material.size = 0.15;

  applyModeVisuals(opMode);
}

// =============================================
// EFECTOS DE MODO OPERATIVO
// =============================================
function getModeBloom(m) {
  return { STANDARD:0.25, ECO:0.12, OVERDRIVE:0.65, PURGE:0.05, REGEN:0.4, BIO:0.5, RECOVERY:0.08, EXPANSION:0.75 }[m] || 0.25;
}
function getModeSpeed(m) {
  return { STANDARD:1, ECO:0.5, OVERDRIVE:2.2, PURGE:0.2, REGEN:1.3, BIO:1.5, RECOVERY:0.3, EXPANSION:1.9 }[m] || 1;
}
function getModeRotateSpeed(m) {
  return { STANDARD:0.8, ECO:0.4, OVERDRIVE:2.8, PURGE:0.3, REGEN:1.0, BIO:1.3, RECOVERY:0.5, EXPANSION:3.5 }[m] || 0.8;
}

function applyModeVisuals(mode) {
  bloomPass.strength = getModeBloom(mode);
  modeSpeed = getModeSpeed(mode);
  controls.autoRotateSpeed = getModeRotateSpeed(mode);

  switch (mode) {
    case 'STANDARD': break;
    case 'ECO':
      lights.ambient.color.set(0x224422); lights.ambient.intensity = 0.3;
      lights.key.color.set(0x88cc88); lights.key.intensity = 1.5;
      lights.fill.color.set(0x44aa44); lights.fill.intensity = 0.5;
      lights.center.color.set(0x44cc44); lights.center.intensity = 0.8;
      groundMat.color.set(0x0a1a0a);
      ringMat.color.set(0x22aa44); ringMat.emissive.set(0x22aa44); ringMat.emissiveIntensity = 0.2;
      matRefs.forEach(mr => { mr.mat.emissiveIntensity = 0.02; });
      bottleMats.body.emissiveIntensity = 0.06;
      swarmParticles.material.color.set(0x44cc44); swarmParticles.material.opacity = 0.5; swarmParticles.material.size = 0.1;
      break;
    case 'OVERDRIVE':
      lights.key.color.set(0xff5522); lights.key.intensity = 4.0;
      lights.fill.color.set(0xff8800); lights.fill.intensity = 1.8;
      lights.center.color.set(0xff4400); lights.center.intensity = 3.0;
      lights.ambient.color.set(0x441100); lights.ambient.intensity = 0.5;
      groundMat.color.set(0x1a0a05);
      ringMat.color.set(0xff6600); ringMat.emissive.set(0xff4400); ringMat.emissiveIntensity = 0.5; ringMat.opacity = 0.4;
      matRefs.forEach(mr => { mr.mat.emissiveIntensity = 0.25; });
      bottleMats.body.emissive.set(0x662200); bottleMats.body.emissiveIntensity = 0.3;
      swarmParticles.material.color.set(0xff6600); swarmParticles.material.size = 0.22;
      break;
    case 'PURGE':
      lights.key.color.set(0xff0000); lights.key.intensity = 2.0;
      lights.fill.color.set(0xff2200); lights.fill.intensity = 1.0;
      lights.center.color.set(0xff0000); lights.center.intensity = 2.5;
      lights.ambient.color.set(0x220000); lights.ambient.intensity = 0.3;
      groundMat.color.set(0x150505);
      ringMat.color.set(0xff0000); ringMat.emissive.set(0xff0000); ringMat.emissiveIntensity = 0.6; ringMat.opacity = 0.4;
      matRefs.forEach(mr => { mr.mat.emissive.set(0xff0000); mr.mat.emissiveIntensity = 0.15; });
      bottleMats.body.emissive.set(0x440000); bottleMats.body.emissiveIntensity = 0.2;
      swarmParticles.material.color.set(0xff2200); swarmParticles.material.opacity = 0.4;
      break;
    case 'REGEN':
      lights.key.color.set(0x44ff88); lights.key.intensity = 2.5;

      lights.center.color.set(0x00ff66); lights.center.intensity = 2.5;
      lights.ambient.color.set(0x114422); lights.ambient.intensity = 0.5;

      matRefs.forEach(mr => { mr.mat.emissive.set(0x00aa44); mr.mat.emissiveIntensity = 0.2; });
      bottleMats.body.emissive.set(0x224422); bottleMats.body.emissiveIntensity = 0.2;
      swarmParticles.material.color.set(0x44ff88); swarmParticles.material.size = 0.18;
      break;
    case 'BIO':
      lights.key.color.set(0x88aa44); lights.key.intensity = 2.2;
      lights.fill.color.set(0x668833); lights.fill.intensity = 1.0;

      ringMat.color.set(0x88aa22); ringMat.emissive.set(0x668811); ringMat.emissiveIntensity = 0.35;
      matRefs.forEach(mr => {

        mr.mat.emissive.copy(bioColor); mr.mat.emissiveIntensity = 0.15;
      });

      swarmParticles.material.color.set(0x88aa33);
      break;
    case 'RECOVERY':
      lights.key.color.set(0x4488ff); lights.key.intensity = 1.8;
      lights.fill.color.set(0x2266dd); lights.fill.intensity = 0.8;

      ringMat.color.set(0x2266ff); ringMat.emissive.set(0x2244cc); ringMat.emissiveIntensity = 0.25;
      matRefs.forEach(mr => { mr.mat.emissive.set(0x1133aa); mr.mat.emissiveIntensity = 0.1; });
      bottleMats.body.emissive.set(0x112244); bottleMats.body.emissiveIntensity = 0.1;
      swarmParticles.material.color.set(0x4488ff); swarmParticles.material.opacity = 0.5; swarmParticles.material.size = 0.12;

      lights.center.color.set(0xffffff); lights.center.intensity = 4.0;

      swarmParticles.material.color.set(0xaaddff); swarmParticles.material.size = 0.25; swarmParticles.material.opacity = 0.9;
      break;
  }
}

// =============================================
// ACTUALIZAR IDIOMA Y RESALTADO DE MÓDULOS
// =============================================
function updateLanguage() {
  const d = T[lang];
  document.getElementById('mainTitle').textContent = d.title;
  document.getElementById('mainSubtitle').textContent = d.subtitle;
  document.getElementById('authorName').textContent = d.author;
  document.getElementById('authorTitle').textContent = d.authorTitle;
  document.getElementById('authorReg').textContent = d.reg;
  document.getElementById('narrativeText').textContent = d.narrative;
  document.getElementById('finTitle').textContent = d.financialTitle;
  document.getElementById('finText1').textContent = d.financial1;
  document.getElementById('finText2').textContent = d.financial2;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (d[key]) el.textContent = d[key];
  });

  compEntries.forEach(ce => {
    ce.labelDiv.textContent = d.nodes[ce.id].name;
  });

  document.querySelectorAll('#modeBtns .mode-btn').forEach(btn => {
    const m = btn.dataset.mode;
    btn.textContent = d.modeLabels[m] || m;
    btn.classList.toggle('active', m === opMode);
  });

  document.querySelectorAll('#shaderBtns .shader-btn').forEach(btn => {
    const s = btn.dataset.shader;
    btn.textContent = d.shaderLabels[s] || s;
    btn.classList.toggle('active', s === shaderMode);
  });

  document.querySelectorAll('#langBtns .lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });

  buildSliders();
  updateActiveNode();
  buildChapters();
  buildNodeButtons();
  buildHUD();

  document.getElementById('currentModeName').textContent = d.modeLabels[opMode];
  document.getElementById('currentShaderName').textContent = d.shaderLabels[shaderMode];

  const rotBtn = document.getElementById('btnRotation');
  rotBtn.querySelector('span').textContent = isRotating ? d.pauseRotation : d.resumeRotation;
  rotBtn.querySelector('i').className = isRotating ? 'fa-solid fa-pause text-xs' : 'fa-solid fa-play text-xs';
  document.querySelector('#btnReset span')?.remove();
  const resetSpan = document.createElement('span');
  resetSpan.textContent = d.reset;
  document.getElementById('btnReset').appendChild(resetSpan);
}

function updateActiveNode() {
  const d = T[lang];
  const node = d.nodes[activeNodeId];
  document.getElementById('activeNodeName').textContent = node.name;
  document.getElementById('activeNodeDesc').textContent = node.desc;
  document.getElementById('activeNodeStats').textContent = node.stats;
  document.querySelectorAll('#nodeBtns .node-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.node === activeNodeId);
    btn.textContent = d.nodes[btn.dataset.node].name;
  });

  compEntries.forEach(ce => {
    const isActive = ce.id === activeNodeId;
    if (ce.highlightRing) {
      ce.highlightRing.visible = isActive;
      if (isActive) {
        const col = new THREE.Color(ce.data.color);
        ce.highlightRing.material.color.copy(col);
        ce.highlightRing.material.emissive.copy(col);
        ce.highlightRing.material.opacity = 0.8;
      } else {
        ce.highlightRing.material.opacity = 0;
      }
    }
  });
}

// =============================================
// CONSTRUIR ELEMENTOS DINÁMICOS DE LA UI
// =============================================
function buildLangButtons() {
  const cont = document.getElementById('langBtns');
  cont.innerHTML = '';
  ['ES','EN','ZH'].forEach(l => {
    const btn = document.createElement('button');
    btn.className = 'lang-btn' + (l === lang ? ' active' : '');
    btn.dataset.lang = l;
    btn.textContent = l;
    btn.addEventListener('click', () => { lang = l; updateLanguage(); });
    cont.appendChild(btn);
  });
}

function buildModeButtons() {
  const cont = document.getElementById('modeBtns');
  cont.innerHTML = '';
  const d = T[lang];
  MODES.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'mode-btn' + (m === opMode ? ' active' : '');
    btn.dataset.mode = m;
    btn.textContent = d.modeLabels[m];
    btn.addEventListener('click', () => {
      opMode = m;
      resetToDefaults();
      applyModeVisuals(m);
      updateLanguage();
    });
    cont.appendChild(btn);
  });
}

function buildShaderButtons() {
  const cont = document.getElementById('shaderBtns');
  cont.innerHTML = '';
  const d = T[lang];
  SHADERS.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'shader-btn' + (s === shaderMode ? ' active' : '');
    btn.dataset.shader = s;
    btn.textContent = d.shaderLabels[s];
    btn.addEventListener('click', () => {
      shaderMode = s;
      applyShader(s);

function buildSliders() {
  const d = T[lang];
  const cont = document.getElementById('sliderContainer');
  cont.innerHTML = '';
  const sliders = [
    { key: 'biomech', label: d.slideBiomech, val: simParams.biomech, min: 0, max: 100, format: v => (v/50).toFixed(1)+'x' },
    { key: 'aquaflow', label: d.slideAquaflow, val: simParams.aquaflow, min: 0, max: 100, format: v => (v*0.05).toFixed(1)+' L/s' },
    { key: 'gravity', label: d.slideGravity, val: simParams.gravity, min: 0, max: 100, format: v => (v*0.196).toFixed(1)+' m/s²' },
    { key: 'swarm', label: d.slideSwarm, val: simParams.swarm, min: 10, max: 150, format: v => v.toString() },
  ];
  sliders.forEach(s => {
    const div = document.createElement('div');
    div.innerHTML = `
      <div class="flex justify-between text-xs text-slate-300 mb-1">
        <span>${s.label}</span>
        <span class="text-cyan-400 font-mono font-semibold" id="sv_${s.key}">${s.format(s.val)}</span>
      </div>
      <input type="range" min="${s.min}" max="${s.max}" value="${s.val}" id="si_${s.key}">
    `;
    cont.appendChild(div);
    const input = div.querySelector('input');
    input.addEventListener('input', () => {
      simParams[s.key] = parseFloat(input.value);
      document.getElementById('sv_'+s.key).textContent = s.format(simParams[s.key]);
    });
  });
}

function buildChapters() {

  d.chapters.forEach(ch => {

function buildNodeButtons() {
  const d = T[lang];
  const cont = document.getElementById('nodeBtns');
  cont.innerHTML = '';
  NODE_IDS.forEach(id => {
    const btn = document.createElement('button');
    btn.className = 'node-btn' + (id === activeNodeId ? ' active' : '');

function buildHUD() {
  const d = T[lang];
  const h = d.hud;
  const cont = document.getElementById('hudOverlay');
  const rows = [
    [h.runtime, '<span class="text-emerald-400 font-bold">'+h.online+'</span>'],
    [h.fps, '<span class="text-white font-bold" id="hudFps">'+fps+'</span>'],
    [h.vertices, '<span class="text-white font-bold">624</span>'],
    [h.aquaponics, '<span class="text-cyan-400 font-bold">'+h.active+'</span>'],
    [h.recovery, '<span class="text-emerald-400 font-bold">98.4%</span>'],
    [h.swarm, '<span class="text-purple-400 font-bold">'+h.ok+'</span>'],
    [h.hybridEnergy, '<span class="text-amber-400 font-bold" id="hudEnergy">'+hybridEnergy+'%</span>'],

// =============================================
// CONTROLES INFERIORES
// =============================================
function setupBottomControls() {
  document.getElementById('btnZoomIn').addEventListener('click', () => {
    const dist = camera.position.length();
    const newDist = Math.max(6, dist * 0.8);
    camera.position.copy(camera.position.clone().normalize().multiplyScalar(newDist));
  });
  document.getElementById('btnZoomOut').addEventListener('click', () => {
    const dist = camera.position.length();
    const newDist = Math.min(45, dist * 1.2);
    camera.position.copy(camera.position.clone().normalize().multiplyScalar(newDist));
  });
  document.getElementById('btnRotation').addEventListener('click', () => {
    isRotating = !isRotating;
    controls.autoRotate = isRotating;
    const d = T[lang];
    const btn = document.getElementById('btnRotation');
    btn.querySelector('span').textContent = isRotating ? d.pauseRotation : d.resumeRotation;
    btn.querySelector('i').className = isRotating ? 'fa-solid fa-pause text-xs' : 'fa-solid fa-play text-xs';
    btn.classList.toggle('active', !isRotating);
  });
  document.getElementById('btnReset').addEventListener('click', () => {
    camera.position.set(18, 12, 22);
    controls.target.set(0, 0.5, 0);
    controls.update();
  });
  let arOn = false;
  document.getElementById('btnAR').addEventListener('click', () => {
    arOn = !arOn;
    const btn = document.getElementById('btnAR');
    btn.querySelector('span').textContent = arOn ? 'AR ON' : 'AR';
    btn.classList.toggle('active', arOn);
  });

}

// =============================================
// RAYCASTER PARA SELECCIÓN DE COMPONENTES
// =============================================
function setupRaycaster() {
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  renderer.domElement.addEventListener('click', (e) => {
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const targets = [];
    compEntries.forEach(ce => {
      if (ce.body) {
        ce.body.traverse(child => { if (child.isMesh || child.isSprite) targets.push(child); });
      }
    });
    const intersects = raycaster.intersectObjects(targets);
    if (intersects.length > 0) {
      const hitObj = intersects[0].object;
      for (const ce of compEntries) {
        if (ce.body) {
          let found = false;
          ce.body.traverse(child => { if (child === hitObj) found = true; });
          if (found) { activeNodeId = ce.id; updateActiveNode(); break; }
        }
      }
    }
  });
}

// =============================================
// RESIZE
// =============================================
function onResize() {
  const container = document.getElementById('threeContainer');
  if (!container) return;
  const w = container.clientWidth, h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (shaderMode !== 'PIXEL') {
    renderer.setPixelRatio(originalPixelRatio);
  }
  renderer.setSize(w, h);
  composer.setSize(w, h);
  labelRenderer.setSize(w, h);
}

// =============================================
// LOOP DE ANIMACIÓN
// =============================================
let frameCount = 0, lastFpsUpdate = 0;

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  frameCount++;
  const biomech = (simParams.biomech / 50) * modeSpeed;

  if (swarmParticles) {
    const pos = swarmParticles.geometry.attributes.position.array;
    const { speeds, angles, radii, heights } = swarmParticles.userData;
    const count = pos.length / 3;
    for (let i = 0; i < count; i++) {
      let angle = angles[i] + time * 0.2 * speeds[i] * biomech;
      let radius = radii[i] + Math.sin(time * 0.5 + i) * 0.3;
      if (opMode === 'RECOVERY') {
        radius = radii[i] * (0.5 + 0.5 * Math.cos(time * 0.3));
      } else if (opMode === 'EXPANSION') {
        radius = radii[i] * (1.0 + 0.3 * Math.sin(time * 0.4 + i * 0.1));
      } else if (opMode === 'PURGE') {
        angle += Math.sin(time * 2 + i * 3) * 0.5;
        radius *= 0.8 + 0.2 * Math.sin(time * 1.5 + i);
      }
      pos[i*3] = Math.cos(angle) * radius;
      pos[i*3+1] = heights[i] + Math.sin(time * 0.8 + i * 0.5) * 0.3;
      pos[i*3+2] = Math.sin(angle) * radius;
    }
    swarmParticles.geometry.attributes.position.needsUpdate = true;
  }

  compEntries.forEach(ce => {
    if (ce.id === 'flor') {
      if (ce.body) {
        ce.body.position.y = 0.15 + Math.sin(time * 0.8) * 0.08;
        // Rotación del sprite material (2D) en lugar de Mesh
        if (ce.body.userData && ce.body.userData.spriteMat) {
          ce.body.userData.spriteMat.rotation = Math.sin(time * 0.3) * 0.05;
        }
      }
    } else if (ce.id === 'biofactory' && ce.body) {
      ce.body.rotation.y += 0.008 * biomech;
    } else if (ce.id === 'lab' && ce.body) {
      ce.body.rotation.x += 0.01 * biomech;
      ce.body.rotation.y += 0.02 * biomech;
    } else if (ce.body) {
      ce.body.position.y = 0.9 * ce.data.scale + Math.sin(time * 0.6 + ce.phase) * 0.05;
    }
  });

  if (shaderMode === 'HOLO') {
    const hue = (time * 0.1) % 1;
    const holoColor = new THREE.Color().setHSL(hue, 0.8, 0.5);
    matRefs.forEach(mr => { mr.mat.emissive.copy(holoColor); });
    bottleMats.body.emissive.copy(holoColor);
    bottleMats.label.emissive.copy(holoColor);
    scanPlane.position.y = 3 + Math.sin(time * 0.5) * 2;
  }

  if (opMode === 'PURGE') {
    const pulse = 0.1 + 0.2 * Math.abs(Math.sin(time * 3));
    lights.center.intensity = 1.5 + pulse * 3;
    ringMat.emissiveIntensity = 0.3 + pulse;
  } else if (opMode === 'REGEN') {
    const grow = 0.2 + 0.3 * (0.5 + 0.5 * Math.sin(time * 0.5));
    matRefs.forEach(mr => { mr.mat.emissiveIntensity = grow; });
    bottleMats.body.emissiveIntensity = grow * 0.8;
  } else if (opMode === 'RECOVERY') {
    const pulse = 0.5 + 0.5 * Math.sin(time * 1.5);
    lights.center.intensity = 1.0 + pulse * 2;
    ringMat.emissiveIntensity = 0.15 + pulse * 0.3;
  } else if (opMode === 'EXPANSION') {
    const expansion = 0.3 + 0.4 * (0.5 + 0.5 * Math.sin(time * 0.8));
    matRefs.forEach(mr => { mr.mat.emissiveIntensity = expansion; });
    ringMat.opacity = 0.3 + expansion * 0.4;
  }

  if (time - lastFpsUpdate > 0.5) {
    const fpsVal = (frameCount / (time - lastFpsUpdate)).toFixed(1);
    fps = fpsVal;
    hybridEnergy = Math.round(70 + Math.sin(time * 0.15) * 8);
    const fpsEl = document.getElementById('hudFps');
    const energyEl = document.getElementById('hudEnergy');
    if (fpsEl) fpsEl.textContent = fps;
    if (energyEl) energyEl.textContent = hybridEnergy + '%';
    frameCount = 0;
    lastFpsUpdate = time;
  }

  controls.update();
  composer.render();
  labelRenderer.render(scene, camera);
}

// =============================================
// INICIALIZACIÓN
// =============================================
function init() {
  initScene();
  buildLangButtons();

  buildShaderButtons();
  buildSliders();
  buildChapters();
  buildNodeButtons();
  buildHUD();
  setupBottomControls();
  setupRaycaster();
  updateLanguage();
  animate();
}

init();
