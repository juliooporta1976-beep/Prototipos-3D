<style>
:root{--bg:#0f1720;--panel:#16212e;--panel2:#1d2b3a;--ink:#eaf2fb;--mut:#9fb3c8;--acc:#2ecc71;--acc2:#27ae60;--warn:#f1c40f;--warnbg:#3a2f12;--line:#28384a;--card:#172432;--ok:#22c55e;--red:#ef4444;--ph:#ff6b6b;--pm:#ffd93d;--pl:#6bcf7f}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f8f7;--panel:#fff;--panel2:#eef5f3;--ink:#10262b;--mut:#4c666b;--line:#cfe0de;--card:#fff;--warnbg:#fff4d6;--warn:#8a5a00}}
*{box-sizing:border-box;margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}
.store-tile[data-dept]:focus-visible{outline:3px solid var(--acc)}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--acc)}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 95%,transparent));border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--acc),#1abc9c);display:grid;place-items:center;color:#06240f;font-weight:900}
.spacer{flex:1}
select,input,button,textarea{font:inherit;color:var(--ink)}
.sel{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:40px}
.btn{background:var(--acc);color:#06240f;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;transition:.15s;text-decoration:none;display:inline-block;min-height:44px;touch-action:manipulation}
.btn:hover{background:var(--acc2)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--panel2)}
.btn.icon{padding:9px 12px;min-width:44px;font-size:18px;line-height:1}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hero{padding:14px 0 4px}
.hero h1{font-size:clamp(20px,3.6vw,30px);line-height:1.15;margin-bottom:6px}
.hero p{color:var(--mut);max-width:720px;font-size:15px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--mut)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}

.search-panel{padding:16px}
.search-box{display:flex;gap:8px;align-items:stretch;position:relative}
.search-field{flex:1;display:flex;align-items:center;gap:10px;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:4px 14px;min-height:56px;transition:border-color .15s}
.search-field:focus-within{border-color:var(--acc)}
.search-ico{font-size:20px;line-height:1}
.search-field input{flex:1;background:transparent;border:0;outline:none;font-size:17px;padding:12px 0;min-width:0}
.search-btn{min-width:120px;font-size:16px;border-radius:14px;padding:0 18px}
.search-clear{background:transparent;border:0;color:var(--mut);font-size:20px;cursor:pointer;padding:8px;display:none}
.search-clear.on{display:block}
.sug-drop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.35);z-index:50;max-height:340px;overflow:auto}
.sug-item{display:flex;justify-content:space-between;gap:8px;width:100%;background:transparent;border:0;padding:12px 16px;cursor:pointer;text-align:left;color:var(--ink);font-size:15px;border-bottom:1px solid var(--line);min-height:48px;align-items:center;font-weight:600}
.sug-item:last-child{border-bottom:0}
.sug-item:hover,.sug-item:focus{background:var(--panel2)}
.sug-ico{font-size:20px;line-height:1}
.sug-lbl{display:flex;align-items:center;gap:10px}
.sug-cat{font-size:12px;color:var(--mut);font-weight:400}

.quick-chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.quick-chips .lbl{font-size:12px;color:var(--mut);width:100%;text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:2px}
.quick-chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink);min-height:38px;display:inline-flex;align-items:center;gap:6px;touch-action:manipulation;transition:.15s}
.quick-chip:hover{border-color:var(--acc);color:var(--acc)}
.quick-chip .chip-ico{font-size:18px;line-height:1}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.filters select,.filters input{flex:1;min-width:120px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.store{display:flex;flex-direction:column;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;position:relative;cursor:pointer;transition:border-color .15s;content-visibility:auto;contain-intrinsic-size:200px}
.store:hover{border-color:var(--acc)}
.store h3{font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-right:80px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mut);white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.tag.chi{color:#ffd27f;border-color:#6b5420}
.tag.mkt{color:#9fe0ff;border-color:#1f4a5e}
.tag.sup{color:#a0f0b0;border-color:#205e35}
.tag.pul{color:#ffc2e0;border-color:#6b2049}
.tag.may{color:#d0b8ff;border-color:#4a206b}
.tag.fer{color:#ffe4a0;border-color:#6b5420}
.tag.open{color:#a0f0b0;border-color:#205e35;background:color-mix(in srgb,var(--ok) 12%,transparent)}
.tag.closed{color:#ff9a9a;border-color:#6b2020;background:color-mix(in srgb,var(--red) 10%,transparent)}
.tag.del{color:#9fe0ff;border-color:#1f4a5e}
.tag.chain{color:var(--mut)}
.tag.brand{color:#c4a3ff;border-color:#4a206b;font-size:10px}
.tag.ph{color:var(--ph);border-color:#6b2020;background:color-mix(in srgb,var(--ph) 10%,transparent)}
.tag.pm{color:var(--pm);border-color:#6b5420;background:color-mix(in srgb,var(--pm) 10%,transparent)}
.tag.pl{color:var(--pl);border-color:#205e35;background:color-mix(in srgb,var(--pl) 10%,transparent)}
.price{font-weight:800;color:var(--acc);font-size:20px}
.cheapest{outline:2px solid var(--acc);outline-offset:2px}
.badge{position:absolute;top:-10px;right:12px;background:var(--acc);color:#06240f;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
.meta{color:var(--mut);font-size:13px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:4px 0;border-top:1px dashed var(--line);flex-wrap:wrap}
.tags-row{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.muted{color:var(--mut);font-size:13px}
.small{font-size:13px;color:var(--mut)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.stats div{background:var(--panel2);border-radius:8px;padding:8px 12px;font-size:14px}
.stats b{display:block;font-size:18px;color:var(--acc)}
.lock{border:2px dashed var(--acc);border-radius:12px;padding:16px;background:color-mix(in srgb,var(--acc) 6%,transparent);margin-top:12px}
.lock p{margin:6px 0}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);border:1px solid var(--ok);border-radius:10px;padding:12px;font-size:14px;margin:10px 0;font-weight:600}
.success-flash{animation:flash 1.5s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 20px transparent}}
#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:100;max-width:92vw;min-width:260px;display:none;pointer-events:none}
#toast > div{box-shadow:0 8px 24px rgba(0,0,0,.35)}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 14px;font-size:16px;margin:6px 0;min-height:46px}
textarea.inp{resize:vertical;min-height:60px}
.lbl{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
.acct-box{font-family:'Courier New',monospace;font-size:22px;font-weight:800;letter-spacing:2px;background:var(--panel2);border:1px dashed var(--acc);border-radius:10px;padding:16px;text-align:center;margin:12px 0;user-select:all;color:var(--acc);cursor:pointer}
.acct-box:active{background:color-mix(in srgb,var(--acc) 15%,var(--panel2))}
footer.legal{border-top:1px solid var(--line);margin-top:24px}
.sticky-foot{text-align:center;color:var(--mut);font-size:13px;padding:24px 0}
.upd-timer{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;margin:10px 0;flex-wrap:wrap}
.upd-timer .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.plans > div{border:1.5px solid var(--line);border-radius:10px;padding:14px}
.plans b{font-size:18px;color:var(--acc)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.activate-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:8px}
.activate-row .inp{flex:1;min-width:200px;margin:0}
.bank-card{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 10%,transparent),transparent);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.bank-title{font-weight:800;font-size:15px;color:var(--acc);margin-bottom:10px;letter-spacing:.3px}
.bank-details{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.bank-details li{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.bank-details li:last-child{border-bottom:0}
.bd-icon{font-size:16px}
.bd-label{color:var(--mut)}
.bank-details b{font-weight:700}
.steps-list{counter-reset:step;list-style:none;padding:0;margin:14px 0}
.steps-list li{counter-increment:step;position:relative;padding:8px 0 8px 40px;font-size:14px;border-bottom:1px dashed var(--line)}
.steps-list li:last-child{border-bottom:0}
.steps-list li::before{content:counter(step);position:absolute;left:0;top:6px;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#06240f;font-weight:800;font-size:14px;display:grid;place-items:center}
.info-card{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 10%,transparent),transparent);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.info-card-title{font-weight:800;font-size:15px;color:var(--acc);margin-bottom:6px}
.info-card-sub{color:var(--mut);font-size:14px}
.field-block{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;background:var(--panel2)}
.field-block-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.field-block-title::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc)}
details.more{margin:10px 0}
details.more > summary{cursor:pointer;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-weight:700;font-size:15px;list-style:none;user-select:none;min-height:46px;display:flex;align-items:center}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::before{content:"▸ ";color:var(--acc);font-weight:800}
details.more[open] > summary::before{content:"▾ "}
.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:80;padding:16px}
.modal.open{display:grid}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:640px;width:100%;padding:20px;max-height:90vh;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
.sheet-close{position:absolute;top:12px;right:12px;background:var(--panel2);border:1px solid var(--line);border-radius:50%;width:44px;height:44px;cursor:pointer;font-size:18px;line-height:1;color:var(--ink);z-index:2}
.sheet h2{font-size:20px;margin-bottom:6px;padding-right:52px}
.sheet .chain-tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--mut);margin-bottom:8px}
.sheet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.sheet-grid .k{font-size:12px;color:var(--mut);text-transform:uppercase}
.sheet-grid .v{font-weight:700;font-size:14px}
.sheet-stars{color:#f1c40f;font-size:16px}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sheet-actions a{flex:1;min-width:120px;text-align:center}
.sched-table{width:100%;font-size:14px;margin:10px 0}
.sched-table td{padding:5px 0;border-bottom:1px dashed var(--line)}
.sched-table td:last-child{text-align:right;color:var(--mut)}
.sched-table tr.today td{font-weight:800;color:var(--acc)}
.badge-list{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.badge-item{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.store-tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.15s;content-visibility:auto;contain-intrinsic-size:120px;min-height:88px}
.store-tile:hover{border-color:var(--acc)}
.store-tile h4{font-size:15px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;cursor:pointer;user-select:none;min-height:40px}
.chip:hover{border-color:var(--acc)}
.chip input{margin:0;accent-color:var(--acc)}
.subcat-header{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--acc);font-weight:700;margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}

.cat-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin:6px 0 10px}
.cat-tile{background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:.15s;text-align:center;font-size:12px;font-weight:700;min-height:76px;justify-content:center;user-select:none;touch-action:manipulation}
.cat-tile:hover{border-color:var(--acc)}
.cat-tile.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--panel2));color:var(--acc)}
.cat-tile .ico{font-size:22px;line-height:1}

.empty-wrap{padding:20px 12px;text-align:center}
.empty-title{font-size:clamp(20px,3.4vw,26px);margin-bottom:8px}
.empty-sub{color:var(--mut);font-size:15px;margin-bottom:18px}
.empty-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;max-width:840px;margin:0 auto}
.empty-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:16px 10px;cursor:pointer;transition:.15s;color:var(--ink);font-weight:700;font-size:14px;min-height:110px;touch-action:manipulation}
.empty-card:hover,.empty-card:focus{border-color:var(--acc);color:var(--acc);transform:translateY(-2px)}
.empty-ico{font-size:34px;line-height:1}

.step-lbl{font-size:14px;font-weight:800;color:var(--acc);margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.help-line{background:color-mix(in srgb,var(--acc) 8%,transparent);border-left:3px solid var(--acc);padding:8px 12px;border-radius:6px;font-size:14px;color:var(--mut);margin:6px 0}

body.easy{font-size:18px;line-height:1.6}
body.easy h1{font-size:clamp(24px,5vw,34px)}
body.easy h2{font-size:22px}
body.easy .hero p{font-size:17px}
body.easy .pills{display:none}
body.easy .btn{padding:15px 22px;font-size:17px;border-radius:12px;min-height:52px}
body.easy .btn.icon{min-width:52px;font-size:22px}
body.easy .sel,body.easy .filters select,body.easy .filters input{font-size:17px;min-height:48px;padding:12px 14px}
body.easy .search-field{min-height:64px;padding:4px 16px}
body.easy .search-field input{font-size:19px}
body.easy .inp{font-size:17px;min-height:52px;padding:15px 14px}
body.easy .cat-tile{min-height:96px;font-size:14px;padding:14px 8px}
body.easy .cat-tile .ico{font-size:30px}
body.easy .price{font-size:26px}
body.easy .store h3{font-size:18px}
body.easy .meta,body.easy .small,body.easy .muted{font-size:15px}
body.easy .tag{font-size:13px;padding:3px 10px}
body.easy .filters.advanced{display:none !important}
body.easy .step-lbl{font-size:17px}
body.easy .quick-chip{font-size:16px;min-height:46px;padding:10px 16px}
body.easy .quick-chip .chip-ico{font-size:22px}
body.easy .empty-card{min-height:130px;font-size:16px}
body.easy .empty-ico{font-size:42px}
body.easy .sug-item{font-size:17px;padding:14px 16px;min-height:54px}
body.easy .sug-ico{font-size:24px}

@media(max-width:560px){
  .hero{padding:10px 0 2px}
  .wrap{padding:12px}
  .acct-box{font-size:18px;letter-spacing:1px}
  .sheet{padding:16px}
  .topbar{gap:6px}
  .brand{font-size:18px}
  .brand .logo{width:30px;height:30px}
  .grid{grid-template-columns:1fr;gap:10px}

  .empty-grid{grid-template-columns:repeat(2,1fr)}
  .hero p{font-size:14px}
}

  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

function fillMuni(id, dept, val){
  const el = document.getElementById(id); if(!el) return "all";
  const opt = m=>`<option value="${esc(m)}">${esc(m)}</option>`;
  let h = `<option value="all">${esc(t("allMunis"))}</option>`;
  if(dept!=="all") h += (NICARAGUA[dept]||[]).map(opt).join("");
  else h += Object.keys(NICARAGUA).sort().map(d=>`<optgroup label="${esc(d)}">${NICARAGUA[d].map(opt).join("")}</optgroup>`).join("");
  el.innerHTML = h; el.value = val; if(el.value!==val) el.value = "all";
  return el.value;
}
function fillReportGeo(){
  const d = document.getElementById("r_d"), c = document.getElementById("r_c"); if(!d||!c) return;
  document.getElementById("l_d").textContent = t("dept");
  const kd = d.value, kc = c.value;
  d.innerHTML = Object.keys(NICARAGUA).sort().map(x=>`<option>${esc(x)}</option>`).join("");
  d.value = NICARAGUA[kd] ? kd : "Managua";
  const fc = keep=>{ c.innerHTML = (NICARAGUA[d.value]||[]).map(m=>`<option>${esc(m)}</option>`).join(""); if(keep && (NICARAGUA[d.value]||[]).includes(keep)) c.value = keep; };
  fc(kc); d.onchange = ()=>fc();
}
function renderNational(){
  const el = document.getElementById("natGrid"); if(!el) return;
  document.getElementById("t_natH").textContent = "🗺️ " + t("natH");
  const nm = Object.values(NICARAGUA).reduce((a,b)=>a+b.length,0);
  document.getElementById("t_natD").textContent = t("natD").replace("{0}", nm);
  el.innerHTML = Object.keys(NICARAGUA).map(d=>{
    const n = DATA.stores.filter(x=>x.dept===d).length;
    return `<div class="store-tile" data-dept="${esc(d)}" tabindex="0" role="button"><h4>📍 ${esc(d)}</h4><div class="meta">${NICARAGUA[d].length} ${esc(t("munisW"))} · ${n} ${esc(t("pointsW"))}</div></div>`;
  }).join("");
  el.querySelectorAll("[data-dept]").forEach(x=>{
    const go = ()=>{ sdept = x.dataset.dept; smuni = "all"; storesShown = 60; document.getElementById("storesPanel").open = true; renderStores(); document.getElementById("storesPanel").scrollIntoView({behavior:"smooth"}); };
    x.onclick = go; x.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } };
  });
}
function deptAvgBlock(rows){
  const g = {}; rows.forEach(r=>{ const d = r.store.dept; if(d) (g[d]=g[d]||[]).push(r.price); });
  const arr = Object.entries(g).map(([d,a])=>({d,avg:a.reduce((x,y)=>x+y,0)/a.length})).sort((a,b)=>a.avg-b.avg);
  if(arr.length<2) return "";
  const max = arr[arr.length-1].avg;
  return `<details class="more"><summary>${esc(t("deptAvg"))}</summary><div class="panel">`+arr.map((x,i)=>
    `<div style="display:grid;grid-template-columns:minmax(110px,210px) 1fr auto;gap:8px;align-items:center;padding:3px 0;font-size:13px"><span>${esc(x.d)}</span><span style="background:var(--panel2);border-radius:6px;height:10px;overflow:hidden"><span style="display:block;height:100%;width:${Math.round(x.avg/max*100)}%;background:${i===0?"var(--acc)":"var(--mut)"}"></span></span><b>${money(x.avg)}</b></div>`).join("")+`</div></details>`;
}

function applyStoreDefaults(s){
  if(!s.addr) s.addr = "Centro";
  if(!s.tel && !s.gen) s.tel  = "+505 8888-" + String(1000 + s.id).slice(0,4);
  if(s.hours==null)    s.hours    = "08:00-20:00";
  if(s.hoursSat==null) s.hoursSat = "08:00-18:00";
  if(s.hoursSun==null) s.hoursSun = "08:00-13:00";
  if(!s.payment)  s.payment  = s.type==="super" ? ["cash","card","transfer"] : ["cash","mobile"];
  if(s.delivery == null) s.delivery = (s.type==="super" || s.type==="pulperia");
  if(!s.deliveryCost)   s.deliveryCost   = s.type==="pulperia" ? 30 : 60;
  if(!s.deliveryTime)   s.deliveryTime   = "45-60 min";
  if(!s.deliveryRadius) s.deliveryRadius = s.type==="pulperia" ? 1.5 : 6;
  if(s.parking == null)    s.parking    = s.type!=="pulperia";
  if(s.accessible == null) s.accessible = s.type==="super";
  if(s.ac == null)         s.ac         = s.type==="super";
  if(!s.rating)  s.rating  = 0;
  if(!s.reviews) s.reviews = 0;
  if(!s.size)    s.size    = s.type==="super" ? "medium" : "small";
  if(!s.since)   s.since   = 0;
  if(!s.prices)  s.prices  = genPrices(DATA.basePrices, s.mult, s.name, s.type);
}

/* ============ UTILIDADES ============ */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function money(nio){
  const rate = DATA.fx[cur] || 1;
  const v = nio / rate;
  const d = (cur==="CRC"||cur==="CLP"||cur==="COP")?0:(v<10?2:(v<100?1:0));
  const sym = CUR_SYM[cur] || cur;
  return sym + " " + v.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
}
function dist(a,b){
  if(!userPos) return null;
  const R = 6371;
  const dLat = (b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function nioText(){
  const y = new Date().getFullYear();
  let r = CFG.bcn[y];
  if(!r){const ks=Object.keys(CFG.bcn).map(Number).sort((a,b)=>a-b);r=CFG.bcn[ks[ks.length-1]];}
  return (CFG.passUsd*r).toFixed(2);
}
const nioFix = x => String(x).replace(/__NIO__/g, nioText()).replace(/__USD__/g, CFG.passUsd);

function hoursForToday(s){
  const dow = new Date().getDay();
  if(dow===0) return s.hoursSun||"";
  if(dow===6) return s.hoursSat||s.hours||"";
  return s.hours||"";
}
function isOpenNow(s){
  const h = hoursForToday(s);
  if(!h || !h.includes("-")) return false;
  const [a,b] = h.split("-").map(x=>x.trim());
  const [ah,am] = a.split(":").map(Number);
  const [bh,bm] = b.split(":").map(Number);
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  return nowMin >= (ah*60+am) && nowMin <= (bh*60+bm);
}
function prettyHours(h){ return h ? h.replace("-", " – ") : "—"; }

function filterStores({muni, type, chain, dept, deliveryOnly, openOnly, text}={}){
  return DATA.stores.filter(s=>{
    if(type && type!=="all" && s.type!==type) return false;
    if(chain && chain!=="all" && s.chain!==chain) return false;
    if(dept && dept!=="all" && s.dept!==dept) return false;
    if(muni && muni!=="all" && s.muni!==muni) return false;
    if(deliveryOnly && !s.delivery) return false;
    if(openOnly && !isOpenNow(s)) return false;
    if(text){
      const hay = norm(s.name+" "+s.chain+" "+s.city+" "+(s.addr||"")+" "+(s.dept||""));
      if(!hay.includes(norm(text))) return false;
    }
    return true;
  });
}

function pname(p){return (p.n&&p.n[lang])||p.n.es;}

function matchProducts(){
  const s = norm(q);
  if(!s) return [];
  return DATA.products.filter(p=>{
    if(cat!=="all" && p.cat!==cat) return false;
    if(subcat!=="all" && p.subcat!==subcat) return false;
    const hay = norm(Object.values(p.n).join(" ")+" "+p.alias+" "+(p.brand||""));
    return hay.includes(s);
  });
}

function subcatsFor(cat){
  const set = new Set();
  DATA.products.forEach(p=>{
    if((cat==="all" || p.cat===cat) && p.subcat) set.add(p.subcat);
  });
  return [...set].sort();
}

function rowsForProduct(p, reports){
  reports = reports || userReports();
  const rows = [];
  DATA.stores.forEach(s=>{
    if(typ!=="all" && s.type!==typ) return;
    if(chainFilter!=="all" && s.chain!==chainFilter) return;
    if(deptFilter!=="all" && s.dept!==deptFilter) return;
    if(muniFilter!=="all" && s.muni!==muniFilter) return;
    if(onlyDel && !s.delivery) return;
    if(onlyOpen && !isOpenNow(s)) return;
    const price = s.prices[p.id];
    if(price==null) return;
    rows.push({store:s, price, d: userPos ? dist(userPos, s) : null});
  });
  reports.forEach(r=>{
    if(!r.pid || r.pid!==p.id) return;
    if(typ!=="all" && r.type!==typ) return;
    if(deptFilter!=="all" && r.dept && r.dept!==deptFilter) return;
    if(muniFilter!=="all" && r.city!==muniFilter) return;
    rows.push({
      store:{id:"u"+r.date,name:r.name,chain:"",type:r.type||"super",city:r.city||"",muni:r.city||"",dept:r.dept||"",addr:r.addr||"",tel:r.tel||"",lat:0,lng:0,hours:"",_user:true,
        payment:["cash"],delivery:false,rating:0,reviews:0,size:"small",since:""},
      price: r.price*(DATA.fx[r.cur]||1), d: null
    });
  });
  return rows;
}

function renderQuickChips(){
  const el = document.getElementById("quickChips");
  if(!el) return;
  const chips = POPULAR_IDS.map(id=>{
    const p = DATA.products.find(x=>x.id===id);
    if(!p) return "";
    return `<button class="quick-chip" type="button" data-qid="${esc(id)}" aria-label="${esc(pname(p))}"><span class="chip-ico" aria-hidden="true">${pIcon(p)}</span> ${esc(pname(p))}</button>`;
  }).join("");
  el.innerHTML = `<span class="lbl">${esc(t("quickLbl"))}</span>${chips}`;
  el.querySelectorAll("[data-qid]").forEach(b=>{
    b.onclick = ()=>{
      const p = DATA.products.find(x=>x.id===b.dataset.qid);
      if(!p) return;
      document.getElementById("q").value = pname(p);
      q = pname(p);
      searched = true; trackEvent("search");
      document.getElementById("sugDrop").hidden = true;
      document.getElementById("qClear").classList.add("on");
      search();
      document.getElementById("out").scrollIntoView({behavior:"smooth",block:"start"});
    };
  });
}

function renderCatTiles(){
  const el = document.getElementById("catTiles");
  if(!el) return;
  const cats = ["all","grains","veg","fruit","peri","esco"];
  el.innerHTML = cats.map(c=>`<div class="cat-tile${cat===c?" on":""}" data-cat="${c}" tabindex="0" role="tab" aria-selected="${cat===c}"><span class="ico">${CAT_ICON[c]}</span><span>${esc(t(c))}</span></div>`).join("");
  el.querySelectorAll("[data-cat]").forEach(tile=>{
    const go = ()=>{
      cat = tile.dataset.cat;
      const valid = subcatsFor(cat);
      if(subcat!=="all" && !valid.includes(subcat)) subcat = "all";
      fill();
      if(q.trim()){ searched = true; trackEvent("search"); search(); }
    };
    tile.onclick = go;
    tile.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } };
  });
}

function updateSuggestions(){
  const drop = document.getElementById("sugDrop");
  const val = norm(q);
  if(!val || val.length<2){ drop.hidden = true; drop.innerHTML=""; return; }
  const matches = DATA.products.filter(p=>{
    if(cat!=="all" && p.cat!==cat) return false;
    const hay = norm(Object.values(p.n).join(" ")+" "+p.alias+" "+(p.brand||""));
    return hay.includes(val);
  }).slice(0,6);
  if(!matches.length){ drop.hidden = true; drop.innerHTML=""; return; }
  drop.innerHTML = matches.map(p=>{
    return `<button type="button" class="sug-item" role="option" data-sp="${esc(p.id)}">
      <span class="sug-lbl"><span class="sug-ico" aria-hidden="true">${pIcon(p)}</span> ${esc(pname(p))}</span>
      <span class="sug-cat">${esc(t(p.cat))}</span>
    </button>`;
  }).join("");
  drop.hidden = false;
  drop.querySelectorAll("[data-sp]").forEach(b=>{
    b.onclick = ()=>{
      const p = DATA.products.find(x=>x.id===b.dataset.sp);
      if(!p) return;
      document.getElementById("q").value = pname(p);
      q = pname(p);
      searched = true; trackEvent("search");
      drop.hidden = true; drop.innerHTML = "";
      document.getElementById("qClear").classList.add("on");
      search();
    };
  });
}

function search(more){
  if(more!==true) shown = 30;
  const out = document.getElementById("out");
  if(!q.trim()){
    renderEmptyState();
    return;
  }
  const prods = matchProducts();
  if(!prods.length){
    out.innerHTML = `<div class="panel" style="text-align:center;padding:28px 16px">
      <h3>😕 ${esc(t("noneTitle"))}</h3>
      <p class="muted" style="margin-top:8px">${esc(t("noneSub"))}</p>
      <p style="margin-top:14px"><a class="btn ghost" href="#reqPanel" onclick="document.getElementById('reqPanel').open=true">${esc(t("req"))}</a></p>
    </div>`;
    return;
  }
  const reports = userReports();
  const grouped = {};
  prods.forEach(p=>{ if(!grouped[p.subcat]) grouped[p.subcat]=[]; grouped[p.subcat].push(p); });
  let html = `<div class="panel" style="padding:8px 14px;margin-bottom:0"><span class="small">${prods.length} ${esc(t("results"))} · «${esc(q)}»</span></div>`;

  });

function productBlock(p, reports){
  let rows = rowsForProduct(p, reports);
  rows.sort((a,b)=>{
    if(srt==="n") return a.store.name.localeCompare(b.store.name) || a.price-b.price;
    if(srt==="d") return b.price-a.price;
    if(srt==="dist" && userPos){
      const da = a.d==null?1e9:a.d, db = b.d==null?1e9:b.d;
      return da-db;
    }
    return a.price-b.price;
  });
  const unlocked = isUnlocked();
  const visible = unlocked ? rows.slice(0,shown) : rows.slice(0,1);
  const min = rows[0] ? rows[0].price : 0;
  const avg = rows.length ? rows.reduce((s,r)=>s+r.price,0)/rows.length : 0;
  const savePct = avg>0 ? Math.round((1-min/avg)*100) : 0;
  const perishKey = PERISH_LABEL[p.perishability] || "";
  const perishClass = PERISH_CLASS[p.perishability] || "";

  let h = `<section style="margin:18px 0">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
      <h2 style="display:flex;align-items:center;gap:10px"><span class="prod-ico" aria-hidden="true" style="font-size:1.4em;line-height:1">${pIcon(p)}</span> ${esc(pname(p))} <span class="muted" style="font-weight:400;font-size:.75em">· ${esc(t("per"))} ${esc(p.unit)}</span></h2>
      ${savePct>0?`<span class="muted">${esc(t("saveTxt"))} <b style="color:var(--acc)">${savePct}%</b> ${esc(t("vsAvg"))}</span>`:""}
    </div>
    <div class="tags-row">
      ${p.brand?`<span class="tag brand">${esc(p.brand)}</span>`:""}
      ${p.presentation?`<span class="tag">${esc(p.presentation)}</span>`:""}
      ${perishKey?`<span class="tag ${perishClass}">${esc(t(perishKey))}</span>`:""}
    </div>
    <div class="grid" style="margin-top:10px">`;
  visible.forEach((r,i)=>{ h += storeCard(r,p,i===0); });
  h += `</div>`;
  h += deptAvgBlock(rows);
  if(!unlocked && rows.length>1){
    h += `<div class="lock">
      <b>${esc(t("lockMsg").replace("{0}", String(rows.length-1)))}</b>
      <p class="small">${esc(nioFix(t("lockHow")))}</p>
      <p style="margin-top:10px"><a class="btn" href="#pay">${esc(nioFix(t("unlockCta")))}</a></p>
    </div>`;
  }
  if(unlocked && rows.length>shown){
    h += `<p style="margin-top:10px"><button class="btn ghost" data-more="1" type="button">${esc(t("more"))} (${rows.length-shown})</button></p>`;
  }
  h += `</section>`;
  return h;
}

function storeCard(r,p,cheap){
  const s = r.store;
  const open = isOpenNow(s);
  const tel = String(s.tel||"").replace(/[^+\d]/g,"");
  const map = "https://www.openstreetmap.org/search?query="+encodeURIComponent((s.addr||"")+", "+(s.city||"")+", Nicaragua");
  const wa = "https://wa.me/?text="+encodeURIComponent(pname(p)+" - "+money(r.price)+" - "+s.name+", "+s.city);

  let h = `<div class="store ${cheap?"cheapest":""}" data-store-id="${s.id}">`;
  if(cheap) h += `<span class="badge">${esc(t("cheapest"))}</span>`;
  h += `<h3>${TYPE_ICON[s.type]||""} ${esc(s.name)}</h3>`;
  h += `<div class="tags-row">
    <span class="tag ${tagClass(s.type)}">${esc(typeName(s.type))}</span>
    ${s.chain?`<span class="tag chain">${esc(s.chain)}</span>`:""}
    <span class="tag ${open?"open":"closed"}">${open?"● ":"○ "}${esc(open?t("open"):t("closed"))}</span>
    ${s.gen?`<span class="tag">${esc(t("refPoint"))}</span>`:""}
    ${s.delivery?`<span class="tag del">🚚</span>`:""}
    ${s.rating?`<span class="tag">★ ${s.rating}</span>`:""}
  </div>`;
  h += `<div class="price">${money(r.price)} <span class="muted" style="font-size:12px;font-weight:400">/ ${esc(p.unit)}</span></div>`;
  h += `<div class="meta">📍 ${esc(s.addr||"—")}, ${esc(s.city)}, ${esc(s.dept||"")}${r.d!=null?" · "+r.d.toFixed(1)+" km":""}</div>`;
  const hToday = hoursForToday(s);
  h += `<div class="meta">🕐 ${hToday ? esc(prettyHours(hToday)) : esc(t("closedDay"))}</div>`;
  h += `<div class="row">
    <button class="muted" data-action="details" type="button" style="background:none;border:0;cursor:pointer;color:var(--acc);padding:0;font-size:13px">${esc(t("viewDetails"))} →</button>`;
  if(tel) h += `<a class="muted" href="tel:${esc(tel)}">☎</a>`;
  h += `<a class="muted" target="_blank" rel="noopener" href="${map}">🗺</a>`;
  h += `<a class="muted" target="_blank" rel="noopener" href="${wa}">📤</a>`;
  h += `</div></div>`;
  return h;
}

function bindOutEvents(){
  document.querySelectorAll("[data-more]").forEach(b=>{
    b.onclick = ()=>{ shown += 30; search(true); };
  });

      if(s) openStoreModal(s);

async function activateByRef(rawRef){
  const ref = String(rawRef||"").trim();
  const statusEl = document.getElementById("payStatus");
  const btnGo = document.getElementById("pf_go");

  if(!ref || !CFG.refPattern.test(ref)){
    statusEl.innerHTML = `<div class="note">${esc(t("pf_bad"))}</div>`;
    return;
  }
  if(!CFG.paymentUrl || CFG.paymentUrl.indexOf("PEGA_AQUI") === 0){
    statusEl.innerHTML = `<div class="note">⚠️ Sistema de pagos no configurado.</div>`;
    return;
  }

  statusEl.innerHTML = `<div class="note">⏳ Verificando pago… espera un momento.</div>`;
  if(btnGo) btnGo.disabled = true;

  try{
    const ctrl = new AbortController();
    const to = setTimeout(function(){ ctrl.abort(); }, 12000);
    const url = CFG.paymentUrl
      + "?action=verify&receipt=" + encodeURIComponent(ref)
      + "&app=" + encodeURIComponent(CFG.appId);
    const res = await fetch(url, { method:"GET", signal: ctrl.signal });
    clearTimeout(to);
    const data = await res.json();

    if(data.ok){
      localStorage_set("mn_pass", String(data.exp || (Date.now() + CFG.passDays*24*3600*1000)));
      localStorage_set("mn_ref", ref.toUpperCase());
      try{
        const refs = usedRefs();
        if(refs.indexOf(ref.toUpperCase()) === -1){
          refs.push(ref.toUpperCase());
          localStorage_set("mn_refs", JSON.stringify(refs.slice(-200)));
        }
      }catch(e){}
      trackEvent("activate");
      document.getElementById("pf_ref").value = "";
      statusEl.innerHTML = "";
      showToast(`<div class="ok success-flash">${esc(t("pf_ok"))}</div>`, 4500);
      fill();
      if(searched || q.trim()){
        searched = true; search(true);
        setTimeout(function(){
          document.getElementById("out").scrollIntoView({behavior:"smooth",block:"start"});
        }, 300);
      } else {
        document.getElementById("q").focus();
      }
    } else {
      const map = {
        not_found:      "❌ Ese número no está aprobado todavía. Envía tu comprobante y espera confirmación (5–30 min).",
        not_approved:   "⏳ Tu pago aún NO ha sido verificado. Espera confirmación del administrador.",
        missing_receipt:"Escribe el número de referencia del depósito.",
        missing_app:    "Error de configuración del servidor.",
        unauthorized:   "Error de configuración del servidor."
      };
      statusEl.innerHTML = `<div class="note">${esc(map[data.error] || "❌ No pudimos verificar el pago.")}</div>`;
    }
  }catch(err){
    statusEl.innerHTML = `<div class="note">📡 Sin conexión al verificador. Revisa tu internet e intenta otra vez.</div>`;
  }finally{
    if(btnGo) btnGo.disabled = false;
  }
}

function saveReport(){
  const form = document.getElementById("rf");
  if(!form.reportValidity()) return;
  const price = parseFloat(document.getElementById("r_pr").value);
  if(!(price>0) || price>1e9) return;
  const productName = document.getElementById("r_p").value.trim().slice(0,80);
  const nk = norm(productName);
  const toks = x => Object.values(x.n).concat(x.alias.split(",")).map(norm);
  const known = DATA.products.find(x => toks(x).includes(nk)) || DATA.products.find(x => toks(x).some(v=>v.includes(nk)));
  const rec = {
    pid: known ? known.id : null, productName,
    name: document.getElementById("r_n").value.trim().slice(0,80),
    type: document.getElementById("r_ty").value,
    dept: document.getElementById("r_d").value,
    addr: document.getElementById("r_a").value.trim().slice(0,120),
    tel: document.getElementById("r_t").value.trim().slice(0,30),
    city: document.getElementById("r_c").value.trim().slice(0,60),
    price, cur: document.getElementById("r_cur").value, date: Date.now()
  };
  const reports = userReports();
  reports.push(rec);
  localStorage_set("mn_reports", JSON.stringify(reports.slice(-300)));
  form.reset(); fillReportGeo();
  document.getElementById("rmsg").textContent = t("rok");
  trackEvent("report");
  fillStats();
  if(searched) search(true);
}

function sendRequest(){
  const n = document.getElementById("rq_n").value.trim();
  if(n.length<2){ document.getElementById("rqm").textContent = t("rqneed"); return; }
  const rec = {n:n.slice(0,100), c:document.getElementById("rq_c").value, d:document.getElementById("rq_d").value.trim().slice(0,500), t:Date.now()};
  try{const arr=JSON.parse(localStorage_get("mn_requests")||"[]");arr.push(rec);localStorage_set("mn_requests",JSON.stringify(arr.slice(-100)));}catch(e){}
  document.getElementById("rqm").textContent = t("rqok");
  document.getElementById("rq_n").value = ""; document.getElementById("rq_d").value = "";
  const body = [rec.n, rec.c, rec.d].join("\n");
  location.href = "mailto:"+CFG.contact+"?subject="+encodeURIComponent("MercaNica solicitud: "+rec.n)+"&body="+encodeURIComponent(body);
}

function collectBackup(){
  const o = {_mn:"backup", v:1, t:Date.now()};
  ["mn_pass","mn_ref","mn_refs","mn_reports","mn_lang","mn_cur"].forEach(k=>{
    const val = localStorage_get(k); if(val!=null) o[k] = val;
  });
  return o;
}
function exportBackupFile(){
  const msg = document.getElementById("bk_msg");
  try{
    const blob = new Blob([JSON.stringify(collectBackup(),null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "MercaNica_acceso_"+new Date().toISOString().slice(0,10)+".json";
    a.click(); URL.revokeObjectURL(url);
    msg.textContent = t("bkOk");
  }catch(e){ msg.textContent = t("bkBad"); }
}
function applyBackup(obj){
  if(!obj || obj._mn!=="backup") return false;
  ["mn_pass","mn_ref","mn_refs","mn_reports","mn_lang","mn_cur"].forEach(k=>{
    if(obj[k]!=null) localStorage_set(k, obj[k]);
  });
  return true;
}
function importBackupText(){
  const raw = document.getElementById("bk_in").value.trim();
  const msg = document.getElementById("bk_msg");
  if(!raw){ msg.textContent = t("bkBad"); return; }
  let obj = null;
  try{ obj = JSON.parse(raw); }
  catch(e){ try{ obj = JSON.parse(decodeURIComponent(escape(atob(raw)))); }catch(e2){ obj=null; } }
  if(!applyBackup(obj)){ msg.textContent = t("bkBad"); return; }
  msg.textContent = t("bkImpOk");
  const nl = localStorage_get("mn_lang"); if(nl && L[nl]) lang = nl;
  const nc = localStorage_get("mn_cur"); if(nc && DATA.fx[nc]) cur = nc;
  fill();
  if(searched) search(true);
}

let updInterval = null;
function startUpdTimer(){
  if(updInterval) return;
  const cycle = 24*3600*1000;
  const base = new Date("2026-10-01T00:00:00Z").getTime();
  function render(){
    const el = Date.now()-base;
    const rem = Math.max(0, cycle - (el % cycle));
    const d = Math.floor(rem/(24*3600000));
    const h = Math.floor((rem%(24*3600000))/3600000);
    const m = Math.floor((rem%3600000)/60000);
    const s = Math.floor((rem%60000)/1000);
    const pad = n=>String(n).padStart(2,"0");
    const box = document.getElementById("updTimer");
    if(!box) return;
    box.innerHTML = `<span class="dot"></span> <span>${esc(t("updNext"))}</span> `+
      `<span><b>${d}</b> ${esc(t("updDays"))}</span> `+
      `<span><b>${pad(h)}</b> ${esc(t("updHrs"))}</span> `+
      `<span><b>${pad(m)}</b> ${esc(t("updMin"))}</span> `+
      `<span><b>${pad(s)}</b> ${esc(t("updSec"))}</span>`;
  }
  render();
  updInterval = setInterval(render, 1000);
}

const NET = /^https?:$/.test(location.protocol);
let syncing = false;
async function syncRemoteData(){
  if(!NET || !CFG.dataUrl || syncing) return;
  syncing = true;
  try{
    const url = CFG.dataUrl + (CFG.dataUrl.includes("?")?"&":"?") + "_=" + Date.now();
    const ctl = new AbortController();
    const to = setTimeout(()=>ctl.abort(), 10000);
    const res = await fetch(url, {cache:"no-store", signal:ctl.signal});
    clearTimeout(to);
    if(!res.ok) return;
    const j = await res.json();
    if(j && j.products && j.stores && j.basePrices){
      DATA = j;
      DATA_VERSION = j.version || DATA_VERSION;
      resetCaches(); prepData();
      renderSuggestions(); fill();
      if(searched) search(true);
    }
  }catch(e){}
  finally{ syncing = false; }
}

function bindUI(){
  document.getElementById("easyBtn").onclick = ()=>{
    easy = !easy;
    localStorage_set("mn_easy", easy ? "1" : "0");
    document.body.classList.toggle("easy", easy);
    showToast(`<div class="ok">${esc(easy?t("easyOn"):t("easyOff"))}</div>`, 2200);
  };
  document.getElementById("lang").onchange = e=>{
    lang = e.target.value;
    localStorage_set("mn_lang", lang);
    fill();
    if(searched) search(true);
  };
  document.getElementById("cur").onchange = e=>{
    cur = e.target.value;
    localStorage_set("mn_cur", cur);
    fill();
    if(searched) search(true);
  };
  document.getElementById("nearBtn").onclick = ()=>{
    if(!navigator.geolocation){ alert("Geolocation N/A"); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>{ userPos = {lat:pos.coords.latitude, lng:pos.coords.longitude}; srt = "dist"; fill(); if(searched) search(true); },
      ()=>{ alert("No location permission"); }
    );
  };
  document.getElementById("q").oninput = e=>{
    q = e.target.value;
    updateClearBtn();
    updateSuggestions();
    clearTimeout(window._qdt);
    window._qdt = setTimeout(()=>{
      if(q.trim()){ searched = true; trackEvent("search"); }
      search();
    }, 260);
  };
  document.getElementById("q").onkeydown = e=>{
    if(e.key==="Enter"){ e.preventDefault(); q = e.target.value; searched = true; trackEvent("search");
      document.getElementById("sugDrop").hidden = true; search(); }
    if(e.key==="Escape"){ document.getElementById("sugDrop").hidden = true; }
  };
  document.getElementById("q").onfocus = ()=>{ if(q.trim()) updateSuggestions(); };
  document.getElementById("qClear").onclick = ()=>{
    document.getElementById("q").value = "";
    q = ""; searched = false;
    document.getElementById("sugDrop").hidden = true;
    updateClearBtn();
    renderEmptyState();
    document.getElementById("q").focus();
  };
  document.getElementById("go").onclick = ()=>{
    q = document.getElementById("q").value;
    searched = true; trackEvent("search");
    document.getElementById("sugDrop").hidden = true;
    updateClearBtn();
    search();
  };
  document.addEventListener("click", e=>{
    const drop = document.getElementById("sugDrop");

  document.getElementById("muni").onchange = e=>{ muniFilter = e.target.value; if(searched) search(); };
  document.getElementById("smuni").onchange = e=>{ smuni = e.target.value; storesShown = 60; renderStores(); };
  document.getElementById("onlyDel").onchange = e=>{ onlyDel = e.target.checked; if(searched) search(); };
  document.getElementById("onlyOpen").onchange = e=>{ onlyOpen = e.target.checked; if(searched) search(); };

  document.getElementById("sq").oninput = e=>{
    sq = e.target.value;
    clearTimeout(window._sdt);
    window._sdt = setTimeout(()=>{ storesShown = 60; renderStores(); }, 180);
  };
  document.getElementById("styp").onchange = e=>{ styp = e.target.value; storesShown = 60; renderStores(); };
  document.getElementById("schain").onchange = e=>{ schain = e.target.value; storesShown = 60; renderStores(); };
  document.getElementById("sdept").onchange = e=>{ sdept = e.target.value; smuni = fillMuni("smuni", sdept, "all"); storesShown = 60; renderStores(); };

  const acct = document.getElementById("acctNum");
  const copyAcct = ()=>{
    const txt = "10020510230315";
    try{
      if(navigator.clipboard) navigator.clipboard.writeText(txt);
      const prev = acct.textContent;
      acct.textContent = "✅ " + txt;
      setTimeout(()=>{ acct.textContent = prev; }, 1200);
    }catch(e){}
  };
  acct.onclick = copyAcct;
  acct.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); copyAcct(); } };

  document.getElementById("pf_go").onclick = ()=>activateByRef(document.getElementById("pf_ref").value);

    if(e.key==="Enter"){ e.preventDefault(); activateByRef(document.getElementById("pf_ref").value); }
  });

    if(e.target.id==="storeModal") closeStoreModal();
  };
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeStoreModal(); });

  document.getElementById("bk_file_btn").onclick = ()=>exportBackupFile();
  document.getElementById("bk_imp").onclick = ()=>importBackupText();
  document.getElementById("rb").onclick = ()=>saveReport();
  document.getElementById("rqb").onclick = ()=>sendRequest();
  document.getElementById("r_p").addEventListener("focus", ()=>{
    const el = document.getElementById("r_p");
    if(!el.value && q.trim()) el.value = q.trim();
  });
}

function boot(){
  try{
    const u = new URL(location.href);
    const ql = u.searchParams.get("lang");
    if(ql && L[ql]){ lang = ql; localStorage_set("mn_lang", lang); }
    const qc = u.searchParams.get("cur");
    if(qc && DATA.fx[qc]){ cur = qc; localStorage_set("mn_cur", cur); }
    if(u.searchParams.get("easy")==="1"){ easy = true; localStorage_set("mn_easy","1"); }
  }catch(e){}
  bindUI();
  fill();
  startUpdTimer();
  syncRemoteData();
  setInterval(syncRemoteData, CFG.autoUpdateMs);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) syncRemoteData(); });
  window.addEventListener("online", ()=>syncRemoteData());
}/* ═══════════════════════════════════════════════════════

window.aprobarRecibo = async function(receipt){
  if(!receipt){ console.error("Uso: await aprobarRecibo('12345678')"); return; }
  try{
    const url = CFG.paymentUrl
      + "?action=approve&secret=" + encodeURIComponent(CFG.adminSecret)
      + "&receipt=" + encodeURIComponent(receipt)
      + "&app=" + encodeURIComponent(CFG.appId);
    const r = await fetch(url);
    const data = await r.json();
    if(data.ok) console.log("%c✅ Recibo " + receipt + " aprobado", "background:#16a34a;color:#fff;padding:6px 12px;border-radius:6px;font-weight:bold");
    else console.error("❌ Error:", data);
    return data;
  }catch(e){ console.error("Error de red:", e); }
};

window.listarRecibos = async function(){
  try{
    const url = CFG.paymentUrl + "?action=list&secret=" + encodeURIComponent(CFG.adminSecret);
    const r = await fetch(url);
    const data = await r.json();
    if(data.ok){
      console.log("%c📋 Recibos registrados (" + data.recibos.length + "):", "color:#0891b2;font-weight:bold;font-size:14px");
      data.recibos.forEach(function(x){
        console.log("  " + (x.estado === "OK" ? "✅" : "⏳") + " [" + x.app + "] " + x.recibo + " — " + x.fecha);
      });
    }
    return data;
  }catch(e){ console.error(e); }
};

    const r = await fetch(url);

    if(data.ok){

    return data;
  }catch(e){
    console.error("❌ Sin conexión al backend:", e);
  }
};

           backOnline:'✅ Conexão restabelecida',
           installed:'✅ App instalado no seu dispositivo',
           installManual:'Para instalar: abra o menu do navegador e toque em “Adicionar à tela inicial” / “Instalar”.',
           shareDesc:'Compare preços da cesta básica e material escolar na Nicarágua.' }
    };
    ['es','en','pt'].forEach(function(k){
      if(!L[k]) return;
      for(var key in extra[k]){ if(!(key in L[k])) L[k][key] = extra[k][key]; }
    });
  }

  function tt(k){ try{ return (typeof t==='function') ? t(k) : k; }catch(e){ return k; } }
  function toastOk(msg){ try{ if(typeof showToast==='function'){ showToast('<div class="ok">'+msg+'</div>', 2600); return; } }catch(e){} }

  /* ---- Manifest dinámico (blob) para instalación sin archivos extra ---- */
  function injectManifest(){
    // Si ya hay un <link rel=manifest> servido (p.ej. manifest.json alojado), respetarlo.
    if(document.querySelector('link[rel="manifest"]')) return;
    try{
      var mani = {
        name: 'MercaNica — Precios de Nicaragua',
        short_name: 'MercaNica',
        description: tt('shareDesc'),
        start_url: location.href.split('#')[0],
        scope: './',
        display: 'standalone',
        orientation: 'any',
        background_color: '#0f1720',
        theme_color: '#0f1720',
        lang: (document.documentElement.lang || 'es'),
        categories: ['shopping','food','finance'],
        icons: [
          { src: ICONS.icon192, sizes:'192x192', type:'image/png', purpose:'any' },
          { src: ICONS.icon512, sizes:'512x512', type:'image/png', purpose:'any' },
          { src: ICONS.maskable512, sizes:'512x512', type:'image/png', purpose:'maskable' }
        ]
      };
      var blob = new Blob([JSON.stringify(mani)], {type:'application/manifest+json'});
      var url = URL.createObjectURL(blob);
      var link = document.createElement('link');
      link.rel = 'manifest'; link.href = url; link.id = 'mnManifest';
      document.head.appendChild(link);
    }catch(e){}
  }

  /* ---- Service worker: solo si se aloja sw.js en el mismo origen ---- */
  function registerSW(){
    if(!('serviceWorker' in navigator)) return;
    if(!/^https?:$/.test(location.protocol)) return; // no funciona en file://
    try{
      navigator.serviceWorker.register('sw.js').catch(function(){ /* silencioso: sw.js opcional */ });
    }catch(e){}
  }

  /* ---- Tema: automático / oscuro / claro ---- */
  var THEMES = ['auto','dark','light'];
  function getTheme(){ try{ return localStorage.getItem('mn_theme') || 'auto'; }catch(e){ return 'auto'; } }
  function themeColorFor(mode){
    if(mode==='light') return '#f3f8f7';
    if(mode==='dark') return '#0f1720';
    try{ return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? '#f3f8f7' : '#0f1720'; }catch(e){ return '#0f1720'; }
  }
  function applyTheme(mode){
    var root = document.documentElement;
    if(mode==='auto') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', mode);
    var mc = document.querySelector('meta[name="theme-color"]');
    if(mc) mc.setAttribute('content', themeColorFor(mode));
    var btn = document.getElementById('mnTheme');
    if(btn){
      btn.textContent = (mode==='dark') ? '🌙' : (mode==='light') ? '☀️' : '🌓';
      var lbl = (mode==='dark') ? tt('themeDark') : (mode==='light') ? tt('themeLight') : tt('themeAuto');
      btn.setAttribute('aria-label', lbl); btn.title = tt('themeTitle') + ' · ' + lbl;
    }
  }
  function cycleTheme(){
    var cur = getTheme();
    var next = THEMES[(THEMES.indexOf(cur)+1) % THEMES.length];
    try{ localStorage.setItem('mn_theme', next); }catch(e){}
    applyTheme(next);
    var lbl = (next==='dark') ? tt('themeDark') : (next==='light') ? tt('themeLight') : tt('themeAuto');
    toastOk(lbl);
  }


  function copyLink(){
    var url = location.href.split('#')[0];
    function done(){ toastOk(tt('copied')); }
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(done, legacyCopy);
      }else{ legacyCopy(); }
    }catch(e){ legacyCopy(); }
    function legacyCopy(){
      try{
        var ta = document.createElement('textarea');
        ta.value = url; ta.setAttribute('readonly','');
        ta.style.position='absolute'; ta.style.left='-9999px';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta); done();
      }catch(e2){ toastOk(url); }
    }
  }

  /* ---- Instalación (beforeinstallprompt) ---- */
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferredPrompt = e;
    var b = document.getElementById('mnInstall'); if(b) b.style.display = '';
  });
  window.addEventListener('appinstalled', function(){
    deferredPrompt = null;
    var b = document.getElementById('mnInstall'); if(b) b.style.display = 'none';
    toastOk(tt('installed'));
  });
  function doInstall(){
    if(deferredPrompt){
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(){ deferredPrompt = null; });
    }else{
      toastOk(tt('installManual'));
    }
  }

  /* ---- Aviso de conexión ---- */
  function buildBanner(){
    if(document.getElementById('mnNet')) return;
    var d = document.createElement('div');
    d.id = 'mnNet'; d.setAttribute('role','status'); d.setAttribute('aria-live','polite');
    document.body.appendChild(d);
  }
  function netUpdate(){
    var d = document.getElementById('mnNet'); if(!d) return;
    if(navigator.onLine){
      if(d.classList.contains('show')){
        d.className = 'show ok-net'; d.textContent = tt('backOnline');
        setTimeout(function(){ d.className=''; }, 2200);
      }
    }else{
      d.className = 'show'; d.textContent = tt('offline');
    }
  }

  /* ---- Botones en la barra superior (inyectados, sin tocar el HTML) ---- */
  function injectButtons(){
    var bar = document.querySelector('header .topbar'); if(!bar) return;
    if(document.getElementById('mnTheme')) return;
    var anchor = document.getElementById('lang'); // insertar antes del selector de idioma
    function mk(id, txt, cls){
      var b = document.createElement('button');
      b.id = id; b.type = 'button'; b.className = 'btn ghost icon ' + (cls||'');
      b.textContent = txt;
      return b;
    }
    var tBtn = mk('mnTheme','🌓');
    var cpBtn = mk('mnCopy','🔗');
    var inBtn = mk('mnInstall','⬇️'); inBtn.style.display = 'none';
    tBtn.onclick = cycleTheme;
    cpBtn.onclick = copyLink;
    inBtn.onclick = doInstall;
    [tBtn, cpBtn, inBtn].forEach(function(b){
      if(anchor && anchor.parentNode===bar) bar.insertBefore(b, anchor);
      else bar.appendChild(b);
    });
  }

  function refreshLabels(){
    var cp = document.getElementById('mnCopy');
    if(cp){ cp.setAttribute('aria-label', tt('copyLink')); cp.title = tt('copyTitle'); }
    var inst = document.getElementById('mnInstall');
    if(inst){ inst.setAttribute('aria-label', tt('installApp')); inst.title = tt('installTitle'); }
    applyTheme(getTheme());
    netUpdate();
    // actualizar descripción del manifest ya es estática; nada más que hacer
  }

  function start(){
    addI18n();
    injectManifest();
    injectButtons();
    buildBanner();
    applyTheme(getTheme());
    refreshLabels();
    registerSW();
    window.addEventListener('online', netUpdate);
    window.addEventListener('offline', netUpdate);
    try{ if(window.matchMedia){ window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(){ if(getTheme()==='auto') applyTheme('auto'); }); } }catch(e){}
    // Reaccionar a cambios de idioma del usuario (coexiste con el onchange existente)
    var langSel = document.getElementById('lang');
    if(langSel) langSel.addEventListener('change', function(){ setTimeout(refreshLabels, 0); });
    var curSel = document.getElementById('cur');
    if(curSel) curSel.addEventListener('change', function(){ setTimeout(refreshLabels, 0); });
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

</script>
</body>
</html>
