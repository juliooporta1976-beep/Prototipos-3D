<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="2026.10.09.3">
<title>MercaNica — ¿Dónde está más barato hoy?</title>
<meta name="description" content="Compara precios de la canasta básica en supermercados, super chinos, mercados, pulperías y ferias de Nicaragua.">
<style>
:root{--bg:#0f1720;--panel:#16212e;--panel2:#1d2b3a;--ink:#eaf2fb;--mut:#9fb3c8;--acc:#2ecc71;--acc2:#27ae60;--warn:#f1c40f;--warnbg:#3a2f12;--line:#28384a;--card:#172432;--ok:#22c55e;--red:#ef4444;--ph:#ff6b6b;--pm:#ffd93d;--pl:#6bcf7f}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f8f7;--panel:#fff;--panel2:#eef5f3;--ink:#10262b;--mut:#4c666b;--line:#cfe0de;--card:#fff;--warnbg:#fff4d6;--warn:#8a5a00}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--acc)}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 95%,transparent));border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--acc),#1abc9c);display:grid;place-items:center;color:#06240f;font-weight:900}
.spacer{flex:1}
select,input,button,textarea{font:inherit;color:var(--ink)}
.sel{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.btn{background:var(--acc);color:#06240f;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;transition:.15s;text-decoration:none;display:inline-block}
.btn:hover{background:var(--acc2)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--panel2)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hero{padding:24px 0 8px}
.hero h1{font-size:clamp(24px,4vw,38px);line-height:1.15;margin-bottom:10px}
.hero p{color:var(--mut);max-width:720px;font-size:17px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--mut)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.searchrow{display:flex;gap:10px;margin:6px 0 10px;flex-wrap:wrap}
.searchrow input[type=text]{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:16px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.filters select,.filters input{flex:1;min-width:130px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.store{display:flex;flex-direction:column;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;cursor:pointer;transition:border-color .15s}
.store:hover{border-color:var(--acc)}
.store h3{font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-right:80px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mut);white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.tag.chi{color:#ffd27f;border-color:#6b5420}
.tag.mkt{color:#9fe0ff;border-color:#1f4a5e}
.tag.sup{color:#a0f0b0;border-color:#205e35}
.tag.pul{color:#ffc2e0;border-color:#6b2049}
.tag.may{color:#d0b8ff;border-color:#4a206b}
.tag.fer{color:#ffe4a0;border-color:#6b5420}
.tag.open{color:#a0f0b0;border-color:#205e35;background:color-mix(in srgb,var(--ok) 12%,transparent)}
.tag.closed{color:#ff9a9a;border-color:#6b2020;background:color-mix(in srgb,var(--red) 10%,transparent)}
.tag.del{color:#9fe0ff;border-color:#1f4a5e}
.tag.chain{color:var(--mut)}
.tag.brand{color:#c4a3ff;border-color:#4a206b;font-size:10px}
.tag.ph{color:var(--ph);border-color:#6b2020;background:color-mix(in srgb,var(--ph) 10%,transparent)}
.tag.pm{color:var(--pm);border-color:#6b5420;background:color-mix(in srgb,var(--pm) 10%,transparent)}
.tag.pl{color:var(--pl);border-color:#205e35;background:color-mix(in srgb,var(--pl) 10%,transparent)}
.price{font-weight:800;color:var(--acc);font-size:20px}
.cheapest{outline:2px solid var(--acc);outline-offset:2px}
.badge{position:absolute;top:-10px;right:12px;background:var(--acc);color:#06240f;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
.meta{color:var(--mut);font-size:13px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:4px 0;border-top:1px dashed var(--line);flex-wrap:wrap}
.tags-row{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.muted{color:var(--mut);font-size:13px}
.small{font-size:13px;color:var(--mut)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.stats div{background:var(--panel2);border-radius:8px;padding:8px 12px;font-size:14px}
.stats b{display:block;font-size:18px;color:var(--acc)}
.lock{border:2px dashed var(--acc);border-radius:12px;padding:16px;background:color-mix(in srgb,var(--acc) 6%,transparent);margin-top:12px}
.lock p{margin:6px 0}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);border:1px solid var(--ok);border-radius:10px;padding:12px;font-size:14px;margin:10px 0;font-weight:600}
.success-flash{animation:flash 1.5s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 20px transparent}}
#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:100;max-width:90vw;min-width:280px;display:none;pointer-events:none}
#toast > div{box-shadow:0 8px 24px rgba(0,0,0,.35)}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 14px;font-size:16px;margin:6px 0}
textarea.inp{resize:vertical;min-height:60px}
.lbl{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
.acct-box{font-family:'Courier New',monospace;font-size:22px;font-weight:800;letter-spacing:2px;background:var(--panel2);border:1px dashed var(--acc);border-radius:10px;padding:16px;text-align:center;margin:12px 0;user-select:all;color:var(--acc);cursor:pointer}
.acct-box:active{background:color-mix(in srgb,var(--acc) 15%,var(--panel2))}
footer.legal{border-top:1px solid var(--line);margin-top:24px}
.sticky-foot{text-align:center;color:var(--mut);font-size:13px;padding:24px 0}
.upd-timer{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;margin:10px 0;flex-wrap:wrap}
.upd-timer .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.plans > div{border:1.5px solid var(--line);border-radius:10px;padding:14px}
.plans b{font-size:18px;color:var(--acc)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.activate-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:8px}
.activate-row .inp{flex:1;min-width:220px;margin:0}
.bank-card{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 10%,transparent),transparent);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.bank-title{font-weight:800;font-size:15px;color:var(--acc);margin-bottom:10px;letter-spacing:.3px}
.bank-details{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.bank-details li{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.bank-details li:last-child{border-bottom:0}
.bd-icon{font-size:16px}
.bd-label{color:var(--mut)}
.bank-details b{font-weight:700}
.steps-list{counter-reset:step;list-style:none;padding:0;margin:14px 0}
.steps-list li{counter-increment:step;position:relative;padding:8px 0 8px 40px;font-size:14px;border-bottom:1px dashed var(--line)}
.steps-list li:last-child{border-bottom:0}
.steps-list li::before{content:counter(step);position:absolute;left:0;top:6px;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#06240f;font-weight:800;font-size:14px;display:grid;place-items:center}
.info-card{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 10%,transparent),transparent);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.info-card-title{font-weight:800;font-size:15px;color:var(--acc);margin-bottom:6px}
.info-card-sub{color:var(--mut);font-size:14px}
.field-block{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;background:var(--panel2)}
.field-block-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.field-block-title::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc)}
details.more{margin:14px 0}
details.more > summary{cursor:pointer;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-weight:700;font-size:15px;list-style:none;user-select:none}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::before{content:"▸ ";color:var(--acc);font-weight:800}
details.more[open] > summary::before{content:"▾ "}
.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:80;padding:16px}
.modal.open{display:grid}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:640px;width:100%;padding:20px;max-height:90vh;overflow:auto;position:relative}
.sheet-close{position:absolute;top:12px;right:12px;background:var(--panel2);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:18px;line-height:1;color:var(--ink)}
.sheet h2{font-size:20px;margin-bottom:6px;padding-right:48px}
.sheet .chain-tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--mut);margin-bottom:8px}
.sheet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:12px 0}
.sheet-grid .k{font-size:12px;color:var(--mut);text-transform:uppercase}
.sheet-grid .v{font-weight:700;font-size:14px}
.sheet-stars{color:#f1c40f;font-size:16px}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sheet-actions a{flex:1;min-width:120px;text-align:center}
.sched-table{width:100%;font-size:14px;margin:10px 0}
.sched-table td{padding:4px 0;border-bottom:1px dashed var(--line)}
.sched-table td:last-child{text-align:right;color:var(--mut)}
.sched-table tr.today td{font-weight:800;color:var(--acc)}
.badge-list{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.badge-item{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.store-tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.15s}
.store-tile:hover{border-color:var(--acc)}
.store-tile h4{font-size:15px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer;user-select:none}
.chip:hover{border-color:var(--acc)}
.chip input{margin:0;accent-color:var(--acc)}
.subcat-header{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--acc);font-weight:700;margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
@media(max-width:560px){.hero{padding:16px 0 4px}.wrap{padding:12px}.acct-box{font-size:18px}.sheet{padding:16px}}
</style>
</head>
<body>

<div id="toast"></div>

<header><div class="wrap topbar">
  <div class="brand"><div class="logo">M</div><span>MercaNica</span></div>
  <div class="spacer"></div>
  <select id="lang" class="sel" aria-label="Language"></select>
  <select id="cur" class="sel" aria-label="Currency"></select>
  <button id="nearBtn" class="btn ghost" type="button" aria-label="Location">📍 <span id="nearLbl"></span></button>
</div></header>

<main class="wrap" id="app">

  <section class="hero">
    <h1 id="t_h1"></h1>
    <p id="t_sub"></p>
    <div class="pills">
      <span class="pill" id="p1"></span>
      <span class="pill" id="p2"></span>
      <span class="pill" id="p3"></span>
      <span class="pill" id="p4"></span>
    </div>
  </section>

  <div id="flash"></div>
  <div id="coverage" class="panel" style="padding:10px 16px"></div>

  <section class="panel">
    <div class="searchrow">
      <input id="q" type="text" list="sug" placeholder="" autocomplete="off">
      <datalist id="sug"></datalist>
    </div>
    <div class="filters">
      <select id="cat" class="sel"></select>
      <select id="subcat" class="sel"></select>
      <select id="typ" class="sel"></select>
      <select id="chain" class="sel"></select>
      <select id="dept" class="sel"></select>
      <select id="srt" class="sel"></select>
      <input id="city" class="sel" maxlength="60" placeholder="">
    </div>
    <div class="filters">
      <label class="chip"><input type="checkbox" id="onlyDel"> <span id="l_onlyDel"></span></label>
      <label class="chip"><input type="checkbox" id="onlyOpen"> <span id="l_onlyOpen"></span></label>
    </div>
    <button id="go" class="btn" type="button"></button>
  </section>

  <div id="out"></div>

  <section class="panel">
    <h2 id="t_storesH" style="margin-top:0"></h2>
    <p class="small" id="t_storesD"></p>
    <div class="filters" style="margin:10px 0">
      <input id="sq" class="sel" placeholder="" maxlength="80" autocomplete="off">
      <select id="styp" class="sel"></select>
      <select id="schain" class="sel"></select>
      <select id="sdept" class="sel"></select>
    </div>
    <div id="storesOut" class="store-grid" style="margin-top:8px"></div>
  </section>

  <section class="panel" id="pay" hidden>
    <h2 id="t_wuh" style="margin-top:0"></h2>
    <p id="t_payDesc" class="small"></p>
    <div class="bank-card">
      <div class="bank-title" id="t_bank_title"></div>
      <div class="acct-box" id="acctNum" title="Copiar">10020510230315</div>
      <ul class="bank-details">
        <li><span class="bd-icon">🏦</span><span class="bd-label" id="l_bank"></span><b>BANPRO</b></li>
        <li><span class="bd-icon">🌎</span><span class="bd-label" id="l_country"></span><b>Nicaragua</b></li>
        <li><span class="bd-icon">💵</span><span class="bd-label" id="l_currency"></span><b>USD</b></li>
        <li><span class="bd-icon">💰</span><span class="bd-label" id="l_amount"></span><b id="v_amount">USD 6 · C$ 219.75</b></li>
      </ul>
    </div>
    <ol class="steps-list"><li id="step_1"></li><li id="step_2"></li><li id="step_3"></li></ol>
    <div id="payStatus"></div>
    <div id="payForm">
      <div class="activate-row">
        <div style="flex:1;min-width:220px">
          <label class="lbl" for="pf_ref" id="l_pf_ref"></label>
          <input class="inp" id="pf_ref" maxlength="30" autocomplete="off">
        </div>
        <button class="btn" id="pf_go" type="button"></button>
      </div>
      <p class="small" style="margin-top:6px" id="pf_refHint"></p>
    </div>
    <div class="note" id="bank_warn"></div>
  </section>

  <section class="panel">
    <h2 id="t_updH" style="margin-top:0"></h2>
    <p class="small" id="t_updD"></p>
    <div id="updTimer" class="upd-timer"></div>
  </section>

  <section class="panel">
    <h2 id="t_rep" style="margin-top:0"></h2>
    <p class="small" id="t_repd"></p>
    <div class="info-card">
      <div class="info-card-title" id="rep_card_title"></div>
      <div class="info-card-sub" id="rep_card_sub"></div>
    </div>
    <form id="rf" onsubmit="return false">
      <div class="field-block">
        <div class="field-block-title" id="rep_g1"></div>
        <div class="grid2">
          <div><label class="lbl" for="r_p" id="l_p"></label><input class="inp" id="r_p" required maxlength="80"></div>
          <div><label class="lbl" for="r_n" id="l_n"></label><input class="inp" id="r_n" required maxlength="80"></div>
          <div><label class="lbl" for="r_a" id="l_a"></label><input class="inp" id="r_a" maxlength="120"></div>
          <div><label class="lbl" for="r_t" id="l_t"></label><input class="inp" id="r_t" inputmode="tel" maxlength="30"></div>
          <div><label class="lbl" for="r_c" id="l_c"></label><input class="inp" id="r_c" required maxlength="60"></div>
          <div><label class="lbl" for="r_ty" id="l_ty"></label>
            <select class="inp" id="r_ty">
              <option value="super">Supermercado</option><option value="chino">Super chino</option>
              <option value="mercado">Mercado</option><option value="pulperia">Pulpería</option>
              <option value="mayorista">Mayorista</option><option value="feria">Feria</option>
            </select></div>
        </div>
      </div>
      <div class="field-block">
        <div class="field-block-title" id="rep_g2"></div>
        <div class="grid2">
          <div><label class="lbl" for="r_pr" id="l_pr"></label><input class="inp" id="r_pr" type="number" min="0.01" step="0.01" required></div>
          <div><label class="lbl" for="r_cur" id="l_cur"></label><select class="inp" id="r_cur"></select></div>
        </div>
      </div>
      <p style="margin:14px 0 0"><button class="btn" id="rb" type="button"></button> <span id="rmsg" class="small"></span></p>
    </form>
    <div class="note" id="rep_note"></div>
  </section>

  <section class="panel">
    <h2 id="t_req" style="margin-top:0"></h2>
    <p class="small" id="t_reqd"></p>
    <div class="info-card">
      <div class="info-card-title" id="req_card_title"></div>
      <div class="info-card-sub" id="req_card_sub"></div>
    </div>
    <ol class="steps-list"><li id="req_s1"></li><li id="req_s2"></li><li id="req_s3"></li></ol>
    <div class="field-block">
      <div class="field-block-title" id="req_g"></div>
      <div class="grid2">
        <div><label class="lbl" for="rq_n" id="l_rqn"></label><input class="inp" id="rq_n" maxlength="100"></div>
        <div><label class="lbl" for="rq_c" id="l_rqc"></label>
          <select class="inp" id="rq_c">
            <option value="grains">Granos básicos</option><option value="veg">Verduras</option>
            <option value="fruit">Frutas</option><option value="peri">Perecederos</option>
          </select></div>
      </div>
      <div style="margin-top:8px"><label class="lbl" for="rq_d" id="l_rqd"></label>
        <textarea id="rq_d" class="inp" rows="2" maxlength="500"></textarea></div>
    </div>
    <p style="margin:14px 0 0"><button class="btn" id="rqb" type="button"></button> <span id="rqm" class="small"></span></p>
    <div class="note" id="req_note"></div>
  </section>

  <details class="more" id="bkP">
    <summary id="t_bkH"></summary>
    <div class="panel">
      <p class="small" id="t_bkD"></p>
      <p style="margin:8px 0">
        <button class="btn ghost" id="bk_file_btn" type="button"></button>
        <button class="btn ghost" id="bk_imp" type="button"></button>
        <span id="bk_msg" class="small"></span>
      </p>
      <label class="lbl" for="bk_in" id="l_bk_in"></label>
      <textarea id="bk_in" class="inp" rows="2" maxlength="20000"></textarea>
    </div>
  </details>

  <details class="more">
    <summary id="t_statsH"></summary>
    <div class="panel"><div id="statsGrid" class="stats" style="margin:0"></div></div>
  </details>

  <details class="more">
    <summary id="t_pl"></summary>
    <div class="panel"><div class="plans" id="plans"></div></div>
  </details>

/* ============ GENERADOR DETERMINÍSTICO ============ */
function hash(str){ let h = 0; for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0; return Math.abs(h); }
function genPrices(base, mult, seed){
  const r = {};
  for (const k in base){
    const h = (hash(seed + "|" + k) % 21) - 10;
    r[k] = Math.max(1, Math.round(base[k] * mult * (1 + h / 200)));
  }
  return r;
}

function applyStoreDefaults(s){
  if(!s.addr) s.addr = "Centro";
  if(!s.tel)  s.tel  = "+505 8888-" + String(1000 + s.id).slice(0,4);
  if(!s.hours)    s.hours    = "08:00-20:00";
  if(!s.hoursSat) s.hoursSat = "08:00-18:00";
  if(!s.hoursSun) s.hoursSun = "08:00-13:00";
  if(!s.payment)  s.payment  = s.type==="super" ? ["cash","card","transfer"] : ["cash","mobile"];
  if(s.delivery == null) s.delivery = (s.type==="super" || s.type==="pulperia");
  if(!s.deliveryCost)   s.deliveryCost   = s.type==="pulperia" ? 30 : 60;
  if(!s.deliveryTime)   s.deliveryTime   = "45-60 min";
  if(!s.deliveryRadius) s.deliveryRadius = s.type==="pulperia" ? 1.5 : 6;
  if(s.parking == null)    s.parking    = s.type!=="pulperia";
  if(s.accessible == null) s.accessible = s.type==="super";
  if(s.ac == null)         s.ac         = s.type==="super";
  if(!s.rating)  s.rating  = 4.0 + (hash(s.name) % 9) / 10;
  if(!s.reviews) s.reviews = 50 + (hash(s.name) % 500);
  if(!s.size)    s.size    = s.type==="super" ? "medium" : "small";
  if(!s.since)   s.since   = 1990 + (hash(s.name) % 30);
  if(!s.prices)  s.prices  = genPrices(DATA.basePrices, s.mult, s.name);
}
DATA.stores.forEach(applyStoreDefaults);

/* ============ UTILIDADES ============ */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function money(nio){
  const rate = DATA.fx[cur] || 1;
  const v = nio / rate;
  const d = (cur==="CRC"||cur==="CLP")?0:(v<10?2:(v<100?1:0));
  const sym = CUR_SYM[cur] || cur;
  return sym + " " + v.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
}
function dist(a,b){
  if(!userPos) return null;
  const R = 6371;
  const dLat = (b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function nioText(){
  const y = new Date().getFullYear();
  let r = CFG.bcn[y];
  if(!r){const ks=Object.keys(CFG.bcn).map(Number).sort((a,b)=>a-b);r=CFG.bcn[ks[ks.length-1]];}
  return (CFG.passUsd*r).toFixed(2);
}
const nioFix = x => String(x).replace(/__NIO__/g, nioText());
function isUnlocked(){try{return Number(localStorage_get("mn_pass")) > Date.now();}catch(e){return false;}}
function daysLeft(){try{const p = Number(localStorage_get("mn_pass"))||0;return Math.max(0, Math.ceil((p-Date.now())/(24*3600*1000)));}catch(e){return 0;}}
function trackEvent(type){try{const ev=JSON.parse(localStorage_get("mn_events")||"[]");ev.push({type,t:Date.now()});localStorage_set("mn_events",JSON.stringify(ev.slice(-500)));}catch(e){}}

function showToast(html, ms){
  const toast = document.getElementById("toast");
  toast.innerHTML = html;
  toast.style.display = "block";
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>{ toast.style.display="none"; toast.innerHTML=""; }, ms || 4000);
}

function typeName(ty){ return t(ty) || ty; }
function hoursForToday(s){
  const dow = new Date().getDay();
  if(dow===0) return s.hoursSun||"";
  if(dow===6) return s.hoursSat||s.hours||"";
  return s.hours||"";
}
function isOpenNow(s){
  const h = hoursForToday(s);
  if(!h || !h.includes("-")) return false;
  const [a,b] = h.split("-").map(x=>x.trim());
  const [ah,am] = a.split(":").map(Number);
  const [bh,bm] = b.split(":").map(Number);
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  return nowMin >= (ah*60+am) && nowMin <= (bh*60+bm);
}
function prettyHours(h){ return h ? h.replace("-", " – ") : "—"; }
function allChains(){ return [...new Set(DATA.stores.map(s=>s.chain).filter(Boolean))].sort(); }
function allDepts(){ return Object.keys(NICARAGUA).sort(); }

function filterStores({city, type, chain, dept, deliveryOnly, openOnly, text}={}){
  return DATA.stores.filter(s=>{
    if(type && type!=="all" && s.type!==type) return false;
    if(chain && chain!=="all" && s.chain!==chain) return false;
    if(dept && dept!=="all" && s.dept!==dept) return false;
    if(city && !String(s.city).toLowerCase().includes(city.toLowerCase())) return false;
    if(deliveryOnly && !s.delivery) return false;
    if(openOnly && !isOpenNow(s)) return false;
    if(text){
      const hay = (s.name+" "+s.chain+" "+s.city+" "+(s.addr||"")+" "+(s.dept||"")).toLowerCase();
      if(!hay.includes(text.toLowerCase())) return false;
    }
    return true;
  });
}

function pname(p){return (p.n&&p.n[lang])||p.n.es;}

function matchProducts(){
  const s = q.trim().toLowerCase();
  if(!s) return [];
  return DATA.products.filter(p=>{
    if(cat!=="all" && p.cat!==cat) return false;
    if(subcat!=="all" && p.subcat!==subcat) return false;
    const hay = (Object.values(p.n).join(" ")+" "+p.alias+" "+(p.brand||"")).toLowerCase();
    return hay.includes(s);
  });
}

function subcatsFor(cat){
  const set = new Set();
  DATA.products.forEach(p=>{
    if((cat==="all" || p.cat===cat) && p.subcat) set.add(p.subcat);
  });
  return [...set].sort();
}

function rowsForProduct(p, reports){
  reports = reports || userReports();
  const rows = [];
  DATA.stores.forEach(s=>{
    if(typ!=="all" && s.type!==typ) return;
    if(chainFilter!=="all" && s.chain!==chainFilter) return;
    if(deptFilter!=="all" && s.dept!==deptFilter) return;
    if(cityFilter && !String(s.city).toLowerCase().includes(cityFilter.toLowerCase())) return;
    if(onlyDel && !s.delivery) return;
    if(onlyOpen && !isOpenNow(s)) return;
    const price = s.prices[p.id];
    if(price==null) return;
    rows.push({store:s, price, d: userPos ? dist(userPos, s) : null});
  });
  reports.forEach(r=>{
    if(!r.pid || r.pid!==p.id) return;
    if(typ!=="all" && r.type!==typ) return;
    if(deptFilter!=="all" && r.dept && r.dept!==deptFilter) return;
    if(cityFilter && !String(r.city||"").toLowerCase().includes(cityFilter.toLowerCase())) return;
    rows.push({
      store:{id:"u"+r.date,name:r.name,chain:"",type:r.type||"super",city:r.city||"",dept:r.dept||"",addr:r.addr||"",tel:r.tel||"",lat:0,lng:0,hours:"",_user:true,
        payment:["cash"],delivery:false,rating:0,reviews:0,size:"small",since:""},
      price: r.price, d: null
    });
  });
  return rows;
}

function tagClass(ty){
  return ty==="chino"?"chi":ty==="mercado"?"mkt":ty==="pulperia"?"pul":ty==="mayorista"?"may":ty==="feria"?"fer":"sup";
}

function renderStores(){
  const out = document.getElementById("storesOut");
  const list = filterStores({text: sq, type: styp, chain: schain, dept: sdept});
  list.sort((a,b)=>a.name.localeCompare(b.name));
  if(!list.length){
    out.innerHTML = `<div class="small" style="padding:8px">${esc(t("noStores"))}</div>`;
    return;
  }
  out.innerHTML = list.map(s=>{
    const open = isOpenNow(s);
    const d = userPos ? dist(userPos, s) : null;
    const stars = s.rating ? `${"★".repeat(Math.round(s.rating))}${"☆".repeat(5-Math.round(s.rating))}` : "";
    return `<div class="store-tile" data-sid="${s.id}">
      <h4>${TYPE_ICON[s.type]||""} ${esc(s.name)}</h4>
      <div class="tags-row">
        <span class="tag ${tagClass(s.type)}">${esc(typeName(s.type))}</span>
        ${s.chain?`<span class="tag chain">${esc(s.chain)}</span>`:""}
        <span class="tag ${open?"open":"closed"}">${open?"● ":"○ "}${esc(open?t("open"):t("closed"))}</span>
        ${s.delivery?`<span class="tag del">🚚</span>`:""}
      </div>
      <div class="meta">📍 ${esc(s.city)}, ${esc(s.dept)}${d!=null?" · "+d.toFixed(1)+" km":""}</div>
      ${s.rating?`<div class="meta"><span class="sheet-stars">${stars}</span> ${s.rating} · ${s.reviews}</div>`:""}
    </div>`;
  }).join("");
  out.querySelectorAll("[data-sid]").forEach(el=>{
    el.onclick = ()=>openStoreModal(DATA.stores.find(x=>String(x.id)===el.dataset.sid));
  });
}

}

function search(more){
  if(more!==true) shown = 30;
  const out = document.getElementById("out");
  if(!q.trim()){
    out.innerHTML = `<div class="panel" style="text-align:center;padding:36px 16px">
      <h3>${esc(t("noneTitle"))}</h3>
      <p class="muted" style="margin-top:8px">${esc(t("noneSub"))}</p></div>`;
    return;
  }
  const prods = matchProducts();
  if(!prods.length){
    out.innerHTML = `<div class="panel"><p class="muted">0 ${esc(t("results"))}</p></div>`;
    return;
  }
  const reports = userReports();
  const grouped = {};
  prods.forEach(p=>{ if(!grouped[p.subcat]) grouped[p.subcat]=[]; grouped[p.subcat].push(p); });
  let html = "";
  Object.keys(grouped).sort().forEach(sc=>{
    html += `<div class="subcat-header">${esc(t("subcat_"+sc)||sc)}</div>`;
    grouped[sc].forEach(p=>{ html += productBlock(p, reports); });
  });
  out.innerHTML = html;
  bindOutEvents();
}

function productBlock(p, reports){
  let rows = rowsForProduct(p, reports);
  rows.sort((a,b)=>{
    if(srt==="n") return a.store.name.localeCompare(b.store.name) || a.price-b.price;
    if(srt==="d") return b.price-a.price;
    if(srt==="dist" && userPos){
      const da = a.d==null?1e9:a.d, db = b.d==null?1e9:b.d;
      return da-db;
    }
    return a.price-b.price;
  });
  const unlocked = isUnlocked();
  const visible = unlocked ? rows.slice(0,shown) : rows.slice(0,1);
  const min = rows[0] ? rows[0].price : 0;
  const avg = rows.length ? rows.reduce((s,r)=>s+r.price,0)/rows.length : 0;
  const savePct = avg>0 ? Math.round((1-min/avg)*100) : 0;
  const perishKey = PERISH_LABEL[p.perishability] || "";
  const perishClass = PERISH_CLASS[p.perishability] || "";

  let h = `<section style="margin:18px 0">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
      <h2>${esc(pname(p))} <span class="muted" style="font-weight:400">· ${esc(t("per"))} ${esc(p.unit)}</span></h2>
      ${savePct>0?`<span class="muted">${esc(t("saveTxt"))} <b style="color:var(--acc)">${savePct}%</b> ${esc(t("vsAvg"))}</span>`:""}
    </div>
    <div class="tags-row">
      ${p.brand?`<span class="tag brand">${esc(p.brand)}</span>`:""}
      ${p.presentation?`<span class="tag">${esc(p.presentation)}</span>`:""}
      ${perishKey?`<span class="tag ${perishClass}">${esc(t(perishKey))}</span>`:""}
    </div>
    <div class="grid" style="margin-top:10px">`;
  visible.forEach((r,i)=>{ h += storeCard(r,p,i===0); });
  h += `</div>`;
  if(!unlocked && rows.length>1){
    h += `<div class="lock">
      <b>${esc(t("lockMsg").replace("{0}", String(rows.length-1)))}</b>
      <p class="small">${esc(t("lockHow"))}</p>
      <p style="margin-top:10px"><a class="btn" href="#pay">${esc(t("unlockCta"))}</a></p>
    </div>`;
  }
  if(unlocked && rows.length>shown){
    h += `<p style="margin-top:10px"><button class="btn ghost" data-more="1" type="button">${esc(t("more"))} (${rows.length-shown})</button></p>`;
  }
  h += `</section>`;
  return h;
}

function storeCard(r,p,cheap){
  const s = r.store;
  const open = isOpenNow(s);
  const tel = String(s.tel||"").replace(/[^+\d]/g,"");
  const map = "https://www.openstreetmap.org/search?query="+encodeURIComponent((s.addr||"")+", "+(s.city||"")+", Nicaragua");
  const wa = "https://wa.me/?text="+encodeURIComponent(pname(p)+" - "+money(r.price)+" - "+s.name+", "+s.city);

  let h = `<div class="store ${cheap?"cheapest":""}" data-store-id="${s.id}">`;
  if(cheap) h += `<span class="badge">${esc(t("cheapest"))}</span>`;
  h += `<h3>${TYPE_ICON[s.type]||""} ${esc(s.name)}</h3>`;
  h += `<div class="tags-row">
    <span class="tag ${tagClass(s.type)}">${esc(typeName(s.type))}</span>
    ${s.chain?`<span class="tag chain">${esc(s.chain)}</span>`:""}
    <span class="tag ${open?"open":"closed"}">${open?"● ":"○ "}${esc(open?t("open"):t("closed"))}</span>
    ${s.delivery?`<span class="tag del">🚚</span>`:""}
    ${s.rating?`<span class="tag">★ ${s.rating}</span>`:""}
  </div>`;
  h += `<div class="price">${money(r.price)} <span class="muted" style="font-size:12px;font-weight:400">/ ${esc(p.unit)}</span></div>`;
  h += `<div class="meta">📍 ${esc(s.addr||"—")}, ${esc(s.city)}, ${esc(s.dept||"")}${r.d!=null?" · "+r.d.toFixed(1)+" km":""}</div>`;
  const hToday = hoursForToday(s);
  h += `<div class="meta">🕐 ${hToday ? esc(prettyHours(hToday)) : esc(t("closedDay"))}</div>`;
  h += `<div class="row">
    <button class="muted" data-action="details" type="button" style="background:none;border:0;cursor:pointer;color:var(--acc);padding:0;font-size:13px">${esc(t("viewDetails"))} →</button>`;
  if(tel) h += `<a class="muted" href="tel:${esc(tel)}">☎</a>`;
  h += `<a class="muted" target="_blank" rel="noopener" href="${map}">🗺</a>`;
  h += `<a class="muted" target="_blank" rel="noopener" href="${wa}">📤</a>`;
  h += `</div></div>`;
  return h;
}

function bindOutEvents(){
  document.querySelectorAll("[data-more]").forEach(b=>{
    b.onclick = ()=>{ shown += 30; search(true); };
  });
  document.querySelectorAll("[data-store-id]").forEach(card=>{
    card.addEventListener("click", e=>{
      if(e.target.tagName==="A") return;
      const id = card.dataset.storeId;
      const s = DATA.stores.find(x=>String(x.id)===id);
      if(s) openStoreModal(s);
    });
  });
  document.querySelectorAll("[data-action='details']").forEach(b=>{
    b.addEventListener("click", e=>{
      e.stopPropagation();
      const id = e.target.closest("[data-store-id]").dataset.storeId;
      const s = DATA.stores.find(x=>String(x.id)===id);
      if(s) openStoreModal(s);
    });
  });
}

function activateByRef(rawRef){
  const ref = String(rawRef||"").trim();
  if(!ref || !CFG.refPattern.test(ref)){
    document.getElementById("payStatus").innerHTML = `<div class="note">${esc(t("pf_bad"))}</div>`;
    return;
  }
  try{
    const refs = usedRefs();
    const norm = ref.toUpperCase();
    if(!refs.includes(norm)){ refs.push(norm); localStorage_set("mn_refs", JSON.stringify(refs.slice(-200))); }
  }catch(e){}
  try{
    localStorage_set("mn_pass", String(Date.now() + CFG.passDays*24*3600*1000));
    localStorage_set("mn_ref", ref.toUpperCase());
  }catch(e){}
  trackEvent("activate");
  showToast(`<div class="ok success-flash">${esc(t("pf_ok"))}</div>`, 4500);
  document.getElementById("pf_ref").value = "";
  document.getElementById("payStatus").innerHTML = "";
  fill();
  if(searched || q.trim()){
    searched = true;
    search(true);
    setTimeout(()=>document.getElementById("out").scrollIntoView({behavior:"smooth",block:"start"}), 300);
  } else {
    document.getElementById("q").focus();
  }
}

function saveReport(){
  const form = document.getElementById("rf");
  if(!form.reportValidity()) return;
  const price = parseFloat(document.getElementById("r_pr").value);
  if(!(price>0) || price>1e9) return;
  const productName = document.getElementById("r_p").value.trim().slice(0,80);
  const lc = productName.toLowerCase();
  const known = DATA.products.find(x =>
    Object.values(x.n).join(" ").toLowerCase().includes(lc) || x.alias.toLowerCase().includes(lc));
  const rec = {
    pid: known ? known.id : null, productName,
    name: document.getElementById("r_n").value.trim().slice(0,80),
    type: document.getElementById("r_ty").value,
    addr: document.getElementById("r_a").value.trim().slice(0,120),
    tel: document.getElementById("r_t").value.trim().slice(0,30),
    city: document.getElementById("r_c").value.trim().slice(0,60),
    price, cur: document.getElementById("r_cur").value, date: Date.now()
  };
  const reports = userReports();
  reports.push(rec);
  localStorage_set("mn_reports", JSON.stringify(reports.slice(-300)));
  form.reset();
  document.getElementById("rmsg").textContent = t("rok");
  trackEvent("report");
  fillStats();
  if(searched) search(true);
}

function sendRequest(){
  const n = document.getElementById("rq_n").value.trim();
  if(n.length<2){ document.getElementById("rqm").textContent = t("rqneed"); return; }
  const rec = {n:n.slice(0,100), c:document.getElementById("rq_c").value, d:document.getElementById("rq_d").value.trim().slice(0,500), t:Date.now()};
  try{const arr=JSON.parse(localStorage_get("mn_requests")||"[]");arr.push(rec);localStorage_set("mn_requests",JSON.stringify(arr.slice(-100)));}catch(e){}
  document.getElementById("rqm").textContent = t("rqok");
  document.getElementById("rq_n").value = ""; document.getElementById("rq_d").value = "";
  const body = [rec.n, rec.c, rec.d].join("\n");
  location.href = "mailto:"+CFG.contact+"?subject="+encodeURIComponent("MercaNica solicitud: "+rec.n)+"&body="+encodeURIComponent(body);
}

function collectBackup(){
  const o = {_mn:"backup", v:1, t:Date.now()};
  ["mn_pass","mn_ref","mn_refs","mn_reports","mn_lang","mn_cur"].forEach(k=>{
    const val = localStorage_get(k); if(val!=null) o[k] = val;
  });
  return o;
}
function exportBackupFile(){
  const msg = document.getElementById("bk_msg");
  try{
    const blob = new Blob([JSON.stringify(collectBackup(),null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "MercaNica_acceso_"+new Date().toISOString().slice(0,10)+".json";
    a.click(); URL.revokeObjectURL(url);
    msg.textContent = t("bkOk");
  }catch(e){ msg.textContent = t("bkBad"); }
}
function applyBackup(obj){
  if(!obj || obj._mn!=="backup") return false;
  ["mn_pass","mn_ref","mn_refs","mn_reports","mn_lang","mn_cur"].forEach(k=>{
    if(obj[k]!=null) localStorage_set(k, obj[k]);
  });
  return true;
}
function importBackupText(){
  const raw = document.getElementById("bk_in").value.trim();
  const msg = document.getElementById("bk_msg");
  if(!raw){ msg.textContent = t("bkBad"); return; }
  let obj = null;
  try{ obj = JSON.parse(raw); }
  catch(e){ try{ obj = JSON.parse(decodeURIComponent(escape(atob(raw)))); }catch(e2){ obj=null; } }
  if(!applyBackup(obj)){ msg.textContent = t("bkBad"); return; }
  msg.textContent = t("bkImpOk");
  const nl = localStorage_get("mn_lang"); if(nl && L[nl]) lang = nl;
  const nc = localStorage_get("mn_cur"); if(nc && DATA.fx[nc]) cur = nc;
  fill();
  if(searched) search(true);
}

let updInterval = null;
function startUpdTimer(){
  if(updInterval) return;
  const cycle = 24*3600*1000;
  const base = new Date("2026-10-01T00:00:00Z").getTime();
  function render(){
    const el = Date.now()-base;
    const rem = Math.max(0, cycle - (el % cycle));
    const d = Math.floor(rem/(24*3600000));
    const h = Math.floor((rem%(24*3600000))/3600000);
    const m = Math.floor((rem%3600000)/60000);
    const s = Math.floor((rem%60000)/1000);
    const pad = n=>String(n).padStart(2,"0");
    const box = document.getElementById("updTimer");
    if(!box) return;
    box.innerHTML = `<span class="dot"></span> <span>${esc(t("updNext"))}</span> `+
      `<span><b>${d}</b> ${esc(t("updDays"))}</span> `+
      `<span><b>${pad(h)}</b> ${esc(t("updHrs"))}</span> `+
      `<span><b>${pad(m)}</b> ${esc(t("updMin"))}</span> `+
      `<span><b>${pad(s)}</b> ${esc(t("updSec"))}</span>`;
  }
  render();
  updInterval = setInterval(render, 1000);
}

const NET = /^https?:$/.test(location.protocol);
let syncing = false;
async function syncRemoteData(){
  if(!NET || !CFG.dataUrl || syncing) return;
  syncing = true;
  try{
    const url = CFG.dataUrl + (CFG.dataUrl.includes("?")?"&":"?") + "_=" + Date.now();
    const ctl = new AbortController();
    const to = setTimeout(()=>ctl.abort(), 10000);
    const res = await fetch(url, {cache:"no-store", signal:ctl.signal});
    clearTimeout(to);
    if(!res.ok) return;
    const j = await res.json();
    if(j && j.products && j.stores && j.basePrices){
      DATA = j;
      DATA_VERSION = j.version || DATA_VERSION;
      DATA.stores.forEach(applyStoreDefaults);
      renderSuggestions(); fill();
      if(searched) search(true);
    }
  }catch(e){}
  finally{ syncing = false; }
}

function bindUI(){
  document.getElementById("lang").onchange = e=>{
    lang = e.target.value;
    localStorage_set("mn_lang", lang);
    fill();
    if(searched) search(true);
  };
  document.getElementById("cur").onchange = e=>{
    cur = e.target.value;
    localStorage_set("mn_cur", cur);
    fill();
    if(searched) search(true);
  };
  document.getElementById("nearBtn").onclick = ()=>{
    if(!navigator.geolocation){ alert("Geolocation N/A"); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>{ userPos = {lat:pos.coords.latitude, lng:pos.coords.longitude}; fill(); if(searched) search(true); },
      ()=>{ alert("No location permission"); }
    );
  };
  document.getElementById("q").oninput = e=>{
    q = e.target.value;
    clearTimeout(window._qdt);
    window._qdt = setTimeout(()=>{
      if(q.trim()){ searched = true; trackEvent("search"); }
      search();
    }, 220);
  };
  document.getElementById("q").onkeydown = e=>{
    if(e.key==="Enter"){ e.preventDefault(); q = e.target.value; searched = true; trackEvent("search"); search(); }
  };
  document.getElementById("go").onclick = ()=>{
    q = document.getElementById("q").value;
    searched = true; trackEvent("search"); search();
  };
  document.getElementById("cat").onchange = e=>{
    cat = e.target.value;
    const valid = subcatsFor(cat);
    if(subcat!=="all" && !valid.includes(subcat)) subcat = "all";
    fill();
    if(searched) search();
  };
  document.getElementById("subcat").onchange = e=>{ subcat = e.target.value; if(searched) search(); };
  document.getElementById("typ").onchange = e=>{ typ = e.target.value; if(searched) search(); };
  document.getElementById("chain").onchange = e=>{ chainFilter = e.target.value; if(searched) search(); };
  document.getElementById("dept").onchange = e=>{ deptFilter = e.target.value; if(searched) search(); };
  document.getElementById("srt").onchange = e=>{ srt = e.target.value; if(searched) search(); };
  document.getElementById("city").oninput = e=>{
    cityFilter = e.target.value;
    clearTimeout(window._cdt);
    window._cdt = setTimeout(()=>{ if(searched) search(); }, 220);
  };
  document.getElementById("onlyDel").onchange = e=>{ onlyDel = e.target.checked; if(searched) search(); };
  document.getElementById("onlyOpen").onchange = e=>{ onlyOpen = e.target.checked; if(searched) search(); };

  document.getElementById("sq").oninput = e=>{
    sq = e.target.value;
    clearTimeout(window._sdt);
    window._sdt = setTimeout(renderStores, 180);
  };
  document.getElementById("styp").onchange = e=>{ styp = e.target.value; renderStores(); };
  document.getElementById("schain").onchange = e=>{ schain = e.target.value; renderStores(); };
  document.getElementById("sdept").onchange = e=>{ sdept = e.target.value; renderStores(); };

  document.getElementById("acctNum").onclick = ()=>{
    const txt = "10020510230315";
    try{
      if(navigator.clipboard) navigator.clipboard.writeText(txt);
      const el = document.getElementById("acctNum");
      const prev = el.textContent;
      el.textContent = "✅ " + txt;
      setTimeout(()=>{ el.textContent = prev; }, 1200);
    }catch(e){}
  };

  document.getElementById("pf_go").onclick = ()=>activateByRef(document.getElementById("pf_ref").value);
  document.getElementById("pf_ref").addEventListener("keydown", e=>{
    if(e.key==="Enter"){ e.preventDefault(); activateByRef(document.getElementById("pf_ref").value); }
  });

  document.getElementById("sm_close").onclick = closeStoreModal;
  document.getElementById("storeModal").onclick = e=>{
    if(e.target.id==="storeModal") closeStoreModal();
  };
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeStoreModal(); });

  document.getElementById("bk_file_btn").onclick = ()=>exportBackupFile();
  document.getElementById("bk_imp").onclick = ()=>importBackupText();
  document.getElementById("rb").onclick = ()=>saveReport();
  document.getElementById("rqb").onclick = ()=>sendRequest();
  document.getElementById("r_p").addEventListener("focus", ()=>{
    const el = document.getElementById("r_p");
    if(!el.value && q.trim()) el.value = q.trim();
  });
}

function boot(){
  try{
    const u = new URL(location.href);
    const ql = u.searchParams.get("lang");
    if(ql && L[ql]){ lang = ql; localStorage_set("mn_lang", lang); }
    const qc = u.searchParams.get("cur");
    if(qc && DATA.fx[qc]){ cur = qc; localStorage_set("mn_cur", cur); }
  }catch(e){}
  bindUI();
  fill();
  startUpdTimer();
  syncRemoteData();
  setInterval(syncRemoteData, CFG.autoUpdateMs);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) syncRemoteData(); });
  window.addEventListener("online", ()=>syncRemoteData());
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
