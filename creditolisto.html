const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GUESS=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone==="America/Managua"||/-NI$/i.test(navigator.language)?"NI":"XX"}catch(e){return"XX"}})();
function pw(){const m='<a href="mailto:'+esc(CFG.contact)+'">'+esc(CFG.contact)+'</a>';$("wut").innerHTML=$("pc").value==="NI"?t("wu",esc(CFG.acct)):t("wuI",esc(CFG.acct),CFG.swift?t("sw",esc(CFG.swift)):t("swq",m))}
let lang=(navigator.language||"en").slice(0,2).toLowerCase();if(!L[lang])lang="en";
const t=(k,...a)=>String(L[lang][k]).replace(/\{(\d)\}/g,(m,i)=>a[i]);
let cs;try{cs=Intl.supportedValuesOf("currency")}catch(e){cs=["USD","EUR","GBP","NIO","MXN","COP","BRL","ARS","CLP","PEN","CRC","GTQ","HNL","JPY","CNY","INR"]}
function ui(){document.documentElement.lang=lang;$("lg").value=lang;document.title="CréditoListo";
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));$("fb").placeholder=t("fbp");
 let dn=null;try{dn=new Intl.DisplayNames([lang],{type:"currency"})}catch(e){}
 const s=$("cur"),v=s.value||"USD";s.innerHTML=cs.map(c=>'<option value="'+c+'">'+c+(dn?" · "+esc(dn.of(c)||""):"")+"</option>").join("");s.value=v;const pc=$("pc"),pv=pc.value||GUESS;pc.innerHTML='<option value="NI">'+t("pcn")+'</option><option value="XX">'+t("pci")+'</option>';pc.value=pv;pw();$("res").style.display="none"}
const localMode=()=>CFG.api.includes("TU-WORKER");
// Auto-actualización: al cargar, cada 15 min y al volver a la pestaña.
const AV=(document.querySelector('meta[name="app-version"]')||{}).content||"0",vc=(a,b)=>{a=a.split(".").map(Number);b=b.split(".").map(Number);for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0};
async function selfUpdate(){try{if(!/^https?:$/.test(location.protocol))return;const n=Number(sessionStorage.getItem("cl_su")||0);if(n>=2)return;const r=await fetch((CFG.upd||location.origin+location.pathname)+"?_="+Date.now(),{cache:"no-store"});if(!r.ok)return;const x=await r.text();if(!x.includes("CréditoListo")||!x.includes("</html>"))return;const rv=(x.match(/name="app-version"\s+content="([^"]+)"/)||[])[1]||"0";if(vc(rv,AV)<0)return;let h=x.length;for(let i=0;i<x.length;i++)h=(h*31+x.charCodeAt(i))|0;h=String(h);if(localStorage.getItem("cl_h")===h)return;localStorage.setItem("cl_h",h);sessionStorage.setItem("cl_su",String(n+1));if(CFG.upd){document.open();document.write(x);document.close()}else location.replace(location.pathname+"?v="+encodeURIComponent(h))}catch(e){}}
selfUpdate();setInterval(selfUpdate,9e5);document.addEventListener("visibilitychange",()=>{if(!document.hidden)selfUpdate()});
async function chk(k){if(localMode()){const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(k));return CFG.hashes.includes([...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join(""))}
 const r=await fetch(CFG.api,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:k})});return (await r.json()).valid===true}
const N=id=>{const v=$(id).value.trim();return v===""?NaN:Number(v)};
const pmt=(m,i,n)=>i?m*i/(1-Math.pow(1+i,-n)):m/n,pv=(c,i,n)=>i?c*(1-Math.pow(1+i,-n))/i:c*n;
function calc(d,k){const u=d.ve*k-d.cv*k-d.go-d.gf,e=u-d.od,i=d.tc/1200,c=pmt(d.mt,i,d.pl),mc=Math.max(0,e*d.um/100);return{e,c,mc,mm:pv(mc,i,d.pl),r:e>0?c/e:Infinity,i}}
const verdict=(x,um)=>x.e<=0||x.r>1?["b",2]:x.r>um/100?["a",1]:["",0];
const unlocked=()=>{try{return sessionStorage.getItem("cl_ok")==="1"||Number(localStorage.getItem("cl_pass"))>Date.now()}catch(e){return false}};
const setPass=()=>{try{localStorage.setItem("cl_pass",String(Date.now()+2592e6));sessionStorage.setItem("cl_ok","1")}catch(e){}};
function read(){const d={nm:$("nm").value.trim(),cur:$("cur").value||"USD"};for(const k of["ve","cv","go","gf","od","mt","pl","tc","um"])d[k]=N(k);
 if(!(d.ve>0)||!(d.mt>0))return t("e1");for(const k of["cv","go","gf","od"])if(!(d[k]>=0))return t("e1");
 if(!Number.isInteger(d.pl)||d.pl<1||d.pl>360||!(d.tc>=0&&d.tc<=200)||!(d.um>=10&&d.um<=100))return t("e2");return d}
const f=(n,c)=>{try{return new Intl.NumberFormat(lang,{style:"currency",currency:c,minimumFractionDigits:0,maximumFractionDigits:0}).format(n)}catch(e){return c+" "+Math.round(n)}};
function full(d){let h;const x=calc(d,1),s=calc(d,.8),[cl,vi]=verdict(x,d.um),[cs2,vs]=verdict(s,d.um),c=d.cur,F=n=>f(n,c);
  h='<h2>'+t("res")+'</h2><div class="v '+cl+'"><div class="big">'+t("v"+vi)+'</div><p>'+t("r1","<b>"+F(x.e)+"</b>","<b>"+F(x.c)+"</b>",x.e>0?t("pct",Math.round(x.r*100)):t("nos"))+'</p><p>'+t("r2",d.um,F(x.mc),"<b>"+F(x.mm)+"</b>")+'</p></div>';
  h+='<div class="v '+cs2+'"><b>'+t("st",t("v"+vs))+'</b><p>'+t("st2",F(s.e),s.e>0?Math.round(s.r*100)+"%":t("all"))+'</p></div>';
  let b=d.mt,rows="",ti=0;const n=Math.min(d.pl,12);
  for(let k=1;k<=d.pl;k++){const it=b*x.i,cap=x.c-it;if(k<=n)rows+="<tr><td>"+k+"</td><td>"+F(x.c)+"</td><td>"+F(it)+"</td><td>"+F(cap)+"</td><td>"+F(Math.max(0,b-cap))+"</td></tr>";ti+=it;b-=cap}
  h+='<div class="box sc"><h3>'+t("tb",n)+'</h3><table><tr>'+L[lang].th.map(z=>"<th>"+z+"</th>").join("")+'</tr>'+rows+'</table><p>'+t("tot","<b>"+F(ti)+"</b>","<b>"+F(d.mt+ti)+"</b>")+'</p></div>';
  const R=(k,v)=>"<tr><td>"+t(k)+"</td><td>"+v+"</td></tr>";
  h+='<div class="box"><h3>'+t("sm")+'</h3><p><b>'+esc(d.nm||t("sol"))+'</b> · '+new Date().toLocaleDateString(lang)+'</p><table>'+R("ve",F(d.ve))+R("cv",F(d.cv))+R("go",F(d.go))+R("gf",F(d.gf))+R("od",F(d.od))+R("sur","<b>"+F(x.e)+"</b>")+R("rq",t("rqv",F(d.mt),d.pl,d.tc))+'</table><p><small>'+t("docs")+'</small></p><button class="btn g noprint" onclick="window.print()">'+t("pr")+'</button></div>';return h}
function render(){
 const d=read(),er=$("er"),box=$("res");if(typeof d==="string"){er.textContent=d;box.style.display="none";return}er.textContent="";
 let h="";
 if(!unlocked()){h='<div class="lock"><b>'+t("lockh")+'</b><p>'+t("lockp")+'</p><a class="btn" href="'+CFG.buy+'" '+(CFG.buy[0]=="#"?"":'target="_blank" rel="noopener"')+'>'+t("buy")+'</a><p style="margin-top:12px"><input id="cd" placeholder="'+t("code")+'" aria-label="'+t("code")+'"><button class="btn g" id="ap" type="button">'+t("act")+'</button></p></div>'}
 else h='<div class="box noprint" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span>'+t("ses")+'</span><button class="btn g" id="so" type="button">'+t("out")+'</button></div>'+full(d)
 box.innerHTML=h;box.style.display="block";$("exs").style.display="none";box.scrollIntoView({behavior:"smooth"});
 const so=$("so");if(so)so.onclick=()=>{try{sessionStorage.removeItem("cl_ok");localStorage.removeItem("cl_pass")}catch(e){}render()};
 const ap=$("ap");if(ap)ap.onclick=async()=>{try{const ok=await chk($("cd").value.trim());if(ok){setPass();render()}else alert(t("bad"))}catch(e){alert(t("fail"))}}}
const RP=/^[A-Za-z0-9\-]{4,30}$/,EM=/^[^\s@]+@[^\s@]+\.[^\s@]+$/,pst=m=>{$("pst").textContent=m};
$("pc").onchange=pw;
$("pd").onclick=async()=>{const r=$("pr").value.trim(),e=$("pe").value.trim();if(!RP.test(r)||!EM.test(e)){pst(t("pbad"));return}
 let u=[];try{u=JSON.parse(localStorage.getItem("cl_refs")||"[]")}catch(x){}if(u.includes(r.toUpperCase())){pst(t("pdup"));return}
 let ok=false;
 if(CFG.instant)ok=true;
 else if(!localMode()){pst(t("pchk"));try{ok=(await(await fetch(CFG.api+"/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ref:r,email:e,country:$("pc").value})})).json()).valid===true}catch(x){pst(t("fail"));return}}
 else{location.href="mailto:"+CFG.contact+"?subject="+encodeURIComponent("CréditoListo "+r)+"&body="+encodeURIComponent(r+" / "+e);pst(t("pmail"));return}
 if(!ok){pst(t("pnv"));return}
 try{u.push(r.toUpperCase());localStorage.setItem("cl_refs",JSON.stringify(u.slice(-200)))}catch(x){}
 setPass();pst(t("pok"));if(typeof read()!=="string")render()};
$("go1").onclick=render;$("buy").href=CFG.buy;if(CFG.buy[0]=="#")$("buy").removeAttribute("target");
$("lg").onchange=e=>{lang=e.target.value;ui();exr()};
$("cl").onclick=()=>{for(const k of["nm","ve","cv","go","gf","mt","pl","tc"])$(k).value="";$("od").value="0";$("um").value="70";$("er").textContent="";$("res").style.display="none";$("res").innerHTML="";$("exs").style.display="";$("fm").scrollIntoView({behavior:"smooth"})};
$("dm").onclick=()=>{const v={nm:"Ferretería Ejemplo",ve:10000,cv:5000,go:1500,gf:1500,od:300,mt:20000,pl:24,tc:24,um:70};for(const k in v)$(k).value=v[k];$("fm").scrollIntoView({behavior:"smooth"})};
$("fbs").onclick=async()=>{const m=$("fb").value.trim();if(!m)return;if(localMode()){window.open(CFG.issues+"?title=Sugerencia&body="+encodeURIComponent(m),"_blank","noopener");return}try{const r=await fetch(CFG.api+"/feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({m})});if(!r.ok)throw 0;$("fb").value="";$("fbm").textContent=t("fbok")}catch(e){$("fbm").textContent=t("fail")}};
const DEMO={nm:"Ferretería Ejemplo",ve:10000,cv:5000,go:1500,gf:1500,od:300,mt:20000,pl:24,tc:24,um:70};
function exr(){$("exs").innerHTML='<div class="box" style="border-style:dashed"><h2>'+t("exh")+'</h2><p>'+t("exp")+'</p></div>'+full({...DEMO,cur:$("cur").value||"USD"})}
$("cur").onchange=exr;exr();
ui();
})();
</script>
