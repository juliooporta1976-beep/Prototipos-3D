if(!L[lang])lang="en";
const t=(k,...a)=>{const v=L[lang][k];if(v==null)return k;return String(v).replace(/\{(\d)\}/g,(m,i)=>a[i]===undefined?"":a[i])};
let prof="b";
const tp=(k,...a)=>t(k+"_"+prof,...a);
const tarr=k=>L[lang][k+"_"+prof]||[];

const clearNF=()=>{_nfc={}};

let _toastT=0;
function showToast(msg,dur=2000){
  const tt=$("toast");if(!tt)return;
  tt.textContent=msg;tt.classList.add("on");
  clearTimeout(_toastT);
  _toastT=setTimeout(()=>tt.classList.remove("on"),dur);
}

const N=id=>{const v=($(id).value||"").replace(/[^\d.\-]/g,"");return v===""?NaN:Number(v)};
const pmt=(m,i,n)=>i?m*i/(1-Math.pow(1+i,-n)):m/n;
const pvv=(c,i,n)=>i?c*(1-Math.pow(1+i,-n))/i:c*n;
function calc(d,k){
  const u=d.ve*k-d.cv*k-d.go-d.gf;
  const e=u-d.od;
  const i=d.tc/1200;
  const c=pmt(d.mt,i,d.pl);
  const mc=Math.max(0,e*d.um/100);
  return {e:e,c:c,mc:mc,mm:pvv(mc,i,d.pl),r:e>0?c/e:Infinity,i:i};
}
const verdict=(x,um)=>x.e<=0||x.r>1?["b",2]:x.r>um/100?["a",1]:["",0];
const unlocked=()=>{try{return sessionStorage.getItem("cl_ok")==="1"||Number(localStorage.getItem("cl_pass"))>Date.now()}catch(e){return false}};
const setPass=()=>{try{localStorage.setItem("cl_pass",String(Date.now()+2592e6));sessionStorage.setItem("cl_ok","1")}catch(e){}};

function f(n,c){
  let e=_nfc[c];
  if(!e){
    if(c==="NIO"){e={pre:"C$ ",fmt:new Intl.NumberFormat(lang,{minimumFractionDigits:0,maximumFractionDigits:0})}}
    else{try{e={fmt:new Intl.NumberFormat(lang,{style:"currency",currency:c,minimumFractionDigits:0,maximumFractionDigits:0})}}
      catch(err){e={fmt:{format:x=>c+" "+Math.round(x)}}}}
    _nfc[c]=e;
  }
  const v=Number.isFinite(n)?n:0;
  return e.pre?e.pre+e.fmt.format(v):e.fmt.format(v);
}

function fmtDigits(str){
  let s=String(str).replace(/[^\d.\-]/g,"");
  const neg=s.startsWith("-");if(neg)s=s.slice(1);
  const dot=s.indexOf(".");
  let intp=dot>=0?s.slice(0,dot):s;
  let frac=dot>=0?s.slice(dot):"";
  intp=intp.replace(/^0+(?=\d)/,"");
  const grouped=intp.replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return (neg?"-":"")+grouped+frac;
}
function liveFormatInput(e){
  const el=e.target;
  if(!el||el.tagName!=="INPUT")return;
  if(el.id==="nm"||el.id==="pr"||el.id==="pe")return;
  const raw=el.value;
  const selStart=el.selectionStart||0;
  const digitsBefore=raw.slice(0,selStart).replace(/[^\d.\-]/g,"").length;
  const out=fmtDigits(raw);
  if(out!==raw){
    el.value=out;
    let pos=0,count=0;
    while(pos<out.length&&count<digitsBefore){
      if(/[\d.\-]/.test(out[pos]))count++;
      pos++;
    }
    try{el.setSelectionRange(pos,pos)}catch(e){}
  }
}

let badF="";
function read(){
  badF="";
  const d={nm:$("nm").value.trim(),cur:$("cur").value||"USD"};
  for(const k of["ve","cv","go","gf","od","mt","pl","tc","um"])d[k]=N(k);
  if(!(d.ve>0)){badF="ve";return t("eve")}
  if(!(d.mt>0)){badF="mt";return t("emt")}
  for(const k of["cv","go","gf","od"])if(!(d[k]>=0)){badF=k;return t("e1")}
  if(!Number.isInteger(d.pl)||d.pl<1||d.pl>360){badF="pl";return t("epl")}
  if(!(d.tc>=0&&d.tc<=200)){badF="tc";return t("etc")}
  if(!(d.um>=10&&d.um<=100)){badF="um";return t("eum")}
  return d;
}

let _pvRAF=0;
function updatePreview(){
  cancelAnimationFrame(_pvRAF);
  _pvRAF=requestAnimationFrame(()=>{
    const pv=$("pvVal"),ph=$("pvHint");if(!pv||!ph)return;
    const ve=N("ve");
    const cur=$("cur").value||"USD";
    if(!(Number.isFinite(ve)&&ve>0)){pv.textContent="—";ph.textContent=t("pvNeed");ph.style.color="";return}
    const cv=N("cv"),go=N("go"),gf=N("gf"),od=N("od");
    const surplus=ve-(Number.isFinite(cv)?cv:0)-(Number.isFinite(go)?go:0)-(Number.isFinite(gf)?gf:0)-(Number.isFinite(od)?od:0);
    pv.textContent=(surplus<0?"-":"")+f(Math.abs(surplus),cur);
    if(surplus<0){ph.textContent=t("pvNeg");ph.style.color="var(--bad)"}
    else{ph.textContent=t("pvOnly");ph.style.color="var(--mut)"}
  });
}

function speak(text){
  try{
    if(!("speechSynthesis" in window))return;
    window.speechSynthesis.cancel();
    const clean=String(text||"").slice(0,2000);
    const u=new SpeechSynthesisUtterance(clean);
    u.lang={es:"es-NI",en:"en-US",pt:"pt-BR",fr:"fr-FR"}[lang]||"en-US";
    u.rate=.95;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function fullText(d){
  const x=calc(d,1);
  const [,vi]=verdict(x,d.um);
  const c=d.cur,F=n=>f(n,c);
  return [
    t("v"+vi),
    t("r1",F(x.e),F(x.c),x.e>0?t("pct",Math.round(x.r*100)):t("nos")),
    t("r2",d.um,F(x.mc),F(x.mm)),
    tp("st",t("v"+vi))
  ].join(". ");
}

  let h="";
  const x=calc(d,1),s=calc(d,.8);
  const [cl,vi]=verdict(x,d.um),[cs2,vs]=verdict(s,d.um);
  const c=d.cur,F=n=>f(n,c);

  h+='<h2>'+t("res")+'</h2>';

  h+='<div class="v '+cl+'"><div class="vico">'+t("vico"+vi)+'</div><div><div class="big">'+t("v"+vi)+'</div>';

async function chk(k){
  if(localMode()){
    const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(k));
    const hex=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("");
    return CFG.hashes.indexOf(hex)!==-1;
  }
  const r=await fetch(CFG.api,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:k})});
  return (await r.json()).valid===true;
}

/* ─────────── Manifest dinámico con iconos PNG (Chrome/Android exige PNG 192 y 512) ─────────── */
const MANIFEST_ICON="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Crect%20fill='%230B7A5B'%20width='512'%20height='512'%20rx='112'/%3E%3Ccircle%20cx='256'%20cy='256'%20r='176'%20fill='none'%20stroke='%23fff'%20stroke-width='18'%20opacity='.35'/%3E%3Cpath%20d='M156%20256%20L216%20316%20L356%20176'%20fill='none'%20stroke='%23fff'%20stroke-width='42'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E";

function pngIcon(size){
  try{
    const c=document.createElement("canvas");
    c.width=c.height=size;
    const g=c.getContext("2d");
    if(!g)return"";
    const r=size*0.22;
    g.fillStyle="#0B7A5B";
    g.beginPath();
    g.moveTo(r,0);g.lineTo(size-r,0);g.quadraticCurveTo(size,0,size,r);
    g.lineTo(size,size-r);g.quadraticCurveTo(size,size,size-r,size);
    g.lineTo(r,size);g.quadraticCurveTo(0,size,0,size-r);
    g.lineTo(0,r);g.quadraticCurveTo(0,0,r,0);
    g.closePath();g.fill();
    g.beginPath();g.arc(size/2,size/2,size*0.345,0,Math.PI*2);
    g.strokeStyle="rgba(255,255,255,.35)";g.lineWidth=Math.max(2,size*0.035);g.stroke();
    g.beginPath();
    g.moveTo(size*0.30,size*0.51);
    g.lineTo(size*0.43,size*0.63);
    g.lineTo(size*0.71,size*0.35);
    g.strokeStyle="#fff";g.lineWidth=Math.max(3,size*0.082);
    g.lineCap="round";g.lineJoin="round";g.stroke();
    return c.toDataURL("image/png");
  }catch(e){return""}
}

function setupManifest(){
  const i192=pngIcon(192)||MANIFEST_ICON;
  const i512=pngIcon(512)||MANIFEST_ICON;
  const icoType=(i192===MANIFEST_ICON)?"image/svg+xml":"image/png";

  const full=location.href.split("#")[0].split("?")[0];

      {src:i512,sizes:"512x512",type:icoType,purpose:"maskable"}
    ]
  };
  try{
    const blob=new Blob([JSON.stringify(mf)],{type:"application/manifest+json"});
    const url=URL.createObjectURL(blob);
    let link=document.querySelector('link[rel="manifest"]');
    if(!link){link=document.createElement("link");link.rel="manifest";document.head.appendChild(link)}
    link.href=url;
    const at=document.querySelector('link[rel="apple-touch-icon"]');
    if(at&&i512!==MANIFEST_ICON)at.href=i512;

const AV=(document.querySelector('meta[name="app-version"]')||{}).content||"0";
const vcmp=(a,b)=>{a=a.split(".").map(Number);b=b.split(".").map(Number);for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0};

async function selfUpdate(){
  try{
    if(!/^https?:$/.test(location.protocol))return;
    if($("res").style.display==="block")return;
    if(Date.now()-lastInput<90000)return;
    const ae=document.activeElement;if(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName))return;
    const n=Number(sessionStorage.getItem("cl_su")||0);if(n>=2)return;
    const url=(CFG.upd||location.origin+location.pathname)+"?_="+Date.now();

    const x=await r.text();
    if(x.indexOf("CréditoListo")===-1||x.indexOf("</html>")===-1)return;
    const m=x.match(/name="app-version"\s+content="([^"]+)"/);
    const rv=m?m[1]:"0";
    if(vcmp(rv,AV)<0)return;
    let h=x.length;for(let i=0;i<x.length;i++)h=(h*31+x.charCodeAt(i))|0;h=String(h);
    if(localStorage.getItem("cl_h")===h)return;
    localStorage.setItem("cl_h",h);sessionStorage.setItem("cl_su",String(n+1));
    location.replace(location.pathname+"?v="+encodeURIComponent(h));
  }catch(e){}
}

    $("od").value="0";$("um").value="70";
    $("er").textContent="";
    $("res").style.display="none";$("res").innerHTML="";
    $("exs").style.display="";
    updateBars();updatePreview();
    try{$("fm").scrollIntoView({behavior:"smooth",block:"start"})}catch(e){$("fm").scrollIntoView()}
  });
  $("dm").addEventListener("click",()=>{
    const demo=DEMOS[prof];
    for(const k in demo)if(k!=="cur"&&$(k))$(k).value=demo[k];
    $("cur").value=demo.cur;
    saveF();updateBars();updatePreview();
    try{$("fm").scrollIntoView({behavior:"smooth",block:"start"})}catch(e){}
  });

  $("pd").addEventListener("click",async()=>{
    const r=$("pr").value.trim(),e=$("pe").value.trim();
    if(!RP.test(r)||!EM.test(e)){pst(t("pbad"));return}
    let u=[];try{u=JSON.parse(localStorage.getItem("cl_refs")||"[]")}catch(x){}
    if(u.indexOf(r.toUpperCase())!==-1){pst(t("pdup"));return}
    let ok=false;
    if(CFG.instant)ok=true;
    else if(!localMode()){
      pst(t("pchk"));
      try{
        const resp=await fetch(CFG.api+"/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ref:r,email:e,country:$("pc").value})});
        ok=(await resp.json()).valid===true;
      }catch(x){pst(t("fail"));return}
    }else{
      location.href="mailto:"+CFG.contact+"?subject="+encodeURIComponent("CréditoListo "+r)+"&body="+encodeURIComponent(r+" / "+e);
      pst(t("pmail"));return;
    }
    if(!ok){pst(t("pnv"));return}
    try{u.push(r.toUpperCase());localStorage.setItem("cl_refs",JSON.stringify(u.slice(-200)))}catch(x){}
    setPass();pst(t("pok"));
    if(typeof read()!=="string")render();
  });

  $("fbs").addEventListener("click",async()=>{
    const m=$("fb").value.trim();if(!m)return;
    if(localMode()){window.open(CFG.issues+"?title=Sugerencia&body="+encodeURIComponent(m),"_blank","noopener");return}
    try{
      const r=await fetch(CFG.api+"/feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({m})});
      if(!r.ok)throw 0;
      $("fb").value="";$("fbm").textContent=t("fbok");
    }catch(e){$("fbm").textContent=t("fail")}
  });

  $("buy").href=CFG.buy;
  if(CFG.buy.charAt(0)==="#")$("buy").removeAttribute("target");

  document.addEventListener("click",async e=>{
    const b=e.target.closest("[data-act]");if(!b)return;
    const act=b.dataset.act;
    if(act==="print"){window.print()}
    else if(act==="copy"){
      const d=window.__cl_last||read();if(typeof d==="string")return;
      const x=calc(d,1);
      const lines=[
        t("sm")+" — CréditoListo",
        new Date().toLocaleDateString(lang),
        t(prof==="b"?"profBiz":"profSal"),
        t("sol")+": "+(d.nm||t("sol")),
        tp("ve")+": "+f(d.ve,d.cur),
        tp("cv")+": "+f(d.cv,d.cur),
        tp("go")+": "+f(d.go,d.cur),
        t("gf")+": "+f(d.gf,d.cur),
        t("od")+": "+f(d.od,d.cur),
        t("sur")+": "+f(x.e,d.cur),
        t("rq")+": "+t("rqv",f(d.mt,d.cur),d.pl,d.tc)
      ].join("\n");
      try{await navigator.clipboard.writeText(lines);const m=$("cpMsg");if(m)m.textContent=t("cpok")}
      catch(err){const m=$("cpMsg");if(m)m.textContent=t("cpbad")}
    }
    else if(act==="voice"){
      const d=window.__cl_last||read();if(typeof d==="string")return;
      speak(fullText(d));
    }
    else if(act==="voiceSum"){
      const d=window.__cl_last||read();if(typeof d==="string")return;
      speak(fullText(d)+". "+t("docs"));
    }
  });
}

const RP=/^[A-Za-z0-9\-]{4,30}$/,EM=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const pst=m=>{const el=$("pst");if(el)el.textContent=m};

function init(){
  loadProf();
  ui();
  loadF();
  setupManifest();
  setupPWAButtons();
  setupNetStatus();
  setupEvents();
  loadFx().then(prc);
  const idle=window.requestIdleCallback||(cb=>setTimeout(()=>cb({timeRemaining:()=>50}),250));
  idle(()=>{exr();idle(()=>selfUpdate())});
  setInterval(selfUpdate,9e5);
  document.addEventListener("visibilitychange",()=>{
    if(!document.hidden){
      const idle2=window.requestIdleCallback||(cb=>setTimeout(cb,200));
      idle2(()=>selfUpdate());
    }
  });
  window.addEventListener("pagehide",saveF);
  ["ve","cv","go","gf","od","mt","pl","tc","um"].forEach(id=>{
    const el=$(id);if(!el||!el.value)return;
    el.value=fmtDigits(el.value);
  });
}

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);
else init();
})();
</script>
</body>
</html>
