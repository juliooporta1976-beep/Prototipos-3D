const PRICE=3,BCN={2026:36.6243},PCUR={es:"NIO",en:"USD",pt:"BRL",fr:"EUR"},FX={};
function bcnRate(){const y=new Date().getFullYear(),ks=Object.keys(BCN).map(Number).sort((a,b)=>a-b);return BCN[y]||BCN[ks[ks.length-1]]}
async function loadFx(){let c=null;try{c=JSON.parse(localStorage.getItem("cl_fx")||"null")}catch(e){}
 if(c&&c.r)Object.assign(FX,c.r);if(c&&Date.now()-c.t<432e5)return;
 try{const r=await fetch("https://open.er-api.com/v6/latest/USD");const j=await r.json();if(j&&j.rates&&j.rates.BRL&&j.rates.EUR){FX.BRL=j.rates.BRL;FX.EUR=j.rates.EUR;try{localStorage.setItem("cl_fx",JSON.stringify({t:Date.now(),r:{BRL:FX.BRL,EUR:FX.EUR}}))}catch(e){}}}catch(e){}}
const nf=(n,d)=>new Intl.NumberFormat(lang,{minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
function pm(n,c){if(c==="NIO")return"C$ "+nf(n,2);if(c==="USD")return"USD "+nf(n,2).replace(/[.,]00$/,"");try{return new Intl.NumberFormat(lang,{style:"currency",currency:c,currencyDisplay:"narrowSymbol",minimumFractionDigits:2,maximumFractionDigits:2}).format(n)}catch(e){return c+" "+nf(n,2)}}
function pui(){let dn=null;try{dn=new Intl.DisplayNames([lang],{type:"currency"})}catch(e){}
 const s=$("pcc");s.innerHTML=["NIO","USD","BRL","EUR"].map(c=>'<option value="'+c+'">'+(c==="NIO"?"C$ · ":"")+c+(dn?" · "+esc(dn.of(c)||""):"")+"</option>").join("");s.value=PCUR[lang]||"USD";prc()}
function prc(){const c=$("pcc").value||"USD",u="USD "+PRICE;let r=c==="USD"?1:c==="NIO"?bcnRate():FX[c],n="";
 if(c==="USD"){$("pcv").textContent=u;$("pcs").textContent="";return}
 if(!r){$("pcv").textContent=u;$("pcs").textContent=t("pqx");return}
 $("pcv").textContent=u+" ≈ "+pm(PRICE*r,c);
 $("pcs").textContent=c==="NIO"?t("pqb",String(r),new Date().toLocaleDateString(lang)):t("pqm",nf(r,4),c)}
$("pcc").onchange=prc;loadFx().then(prc);
$("cur").onchange=exr;exr();
ui();
const FK=["nm","ve","cv","go","gf","od","mt","pl","tc","um","cur"];
function saveF(){try{const o={};FK.forEach(k=>o[k]=$(k).value);localStorage.setItem("cl_form",JSON.stringify(o))}catch(e){}}
function loadF(){try{const o=JSON.parse(localStorage.getItem("cl_form")||"null");if(!o||typeof o!=="object")return;FK.forEach(k=>{if(k!=="cur"&&o[k]!=null)$(k).value=String(o[k]).slice(0,120)});if(o.cur&&[...$("cur").options].some(x=>x.value===o.cur))$("cur").value=o.cur}catch(e){}}
loadF();
$("fm").addEventListener("input",saveF);$("fm").addEventListener("change",saveF);
$("fm").addEventListener("submit",e=>{e.preventDefault();render()});
$("fm").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){e.preventDefault();render()}});
})();
</script>
</body>
