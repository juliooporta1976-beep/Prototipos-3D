/* ── Monedas: filtrado de códigos especiales y lista curada al frente ── */
const SPECIAL_CODE=/^(XAU|XAG|XPT|XPD|XDR|XSU|XUA|XTS|XBA|XBB|XBC|XBD|XXX)$/;
const SPECIAL_NAME=/^(oro|gold|plata|silver|platino|platinum|paladio|palladium|special drawing|derechos especiales|direitos especiais|droits de tirage)$/i;
let csFull;
try{csFull=Intl.supportedValuesOf("currency")}catch(e){csFull=["USD","EUR","GBP","NIO","MXN","COP","BRL","ARS","CLP","PEN","CRC","GTQ","HNL","JPY","CNY","INR"]}
let dnCheck=null;try{dnCheck=new Intl.DisplayNames([lang],{type:"currency"})}catch(e){}
try{
  csFull=csFull.filter(c=>{
    if(!c)return false;
    if(SPECIAL_CODE.test(c))return false;
    if(dnCheck){
      try{
        const nm=dnCheck.of(c)||"";
        if(SPECIAL_NAME.test(String(nm).trim()))return false;
      }catch(e){}
    }
    return true;
  });
}catch(e){}
if(!csFull.length)csFull=["USD","EUR","GBP","NIO","MXN","COP","BRL","ARS","CLP","PEN","CRC","GTQ","HNL","JPY","CNY","INR"];

const PRIORITY=["NIO","USD","EUR","BRL","MXN","COP","ARS","CLP","PEN","GTQ","HNL","CRC","PAB","DOP","CAD","JPY","CNY","GBP","CHF","INR"];
let cs=PRIORITY.filter(c=>csFull.indexOf(c)!==-1);
const csExtra=csFull.filter(c=>PRIORITY.indexOf(c)===-1).sort();

const CUR_OVERRIDE={NIO:"Córdoba"};
function curName(c){
  if(!c)return"";
  if(CUR_OVERRIDE[c])return CUR_OVERRIDE[c];
  try{
    const dn=new Intl.DisplayNames([lang],{type:"currency"});
    let n=String(dn.of(c)||"");
    n=n.replace(/\b(oro|gold|plata|silver|platine|platino|platinum|paladio|palladium)\b/gi,"")
       .replace(/\s+/g," ").trim();
    return n;
  }catch(e){return""}
}

const N=id=>{const el=$(id);if(!el)return NaN;const v=(el.value||"").replace(/[^\d.\-]/g,"");return v===""?NaN:Number(v)};
const pmt=(m,i,n)=>i?m*i/(1-Math.pow(1+i,-n)):m/n;
const pvv=(c,i,n)=>i?c*(1-Math.pow(1+i,-n))/i:c*n;

const isBoth=()=>prof==="a";
function calc(d,k){
  let u;
  const biz=d.ve*k-d.cv*k-d.go;
  if(d.prof==="a"){u=biz+(d.sal||0);}else{u=biz;}
  u-=d.gf;
  const e=u-d.od;
  const i=d.tc/1200;
  const c=pmt(d.mt,i,d.pl);
  const mc=Math.max(0,e*d.um/100);
  return {e:e,c:c,mc:mc,mm:pvv(mc,i,d.pl),r:e>0?c/e:Infinity,i:i};
}
const verdict=(x,um)=>x.e<=0||x.r>1?["b",2]:x.r>um/100?["a",1]:["",0];
const unlocked=()=>{try{return sessionStorage.getItem("cl_ok")==="1"||Number(localStorage.getItem("cl_pass"))>Date.now()}catch(e){return false}};
const setPass=()=>{try{localStorage.setItem("cl_pass",String(Date.now()+2592e6));sessionStorage.setItem("cl_ok","1")}catch(e){}};

function f(n,c){
  let e=_nfc[c];
  if(!e){
    if(c==="NIO"){e={pre:"C$ ",fmt:new Intl.NumberFormat(lang,{minimumFractionDigits:0,maximumFractionDigits:0})}}
    else{try{e={fmt:new Intl.NumberFormat(lang,{style:"currency",currency:c,minimumFractionDigits:0,maximumFractionDigits:0})}}
      catch(err){e={fmt:{format:x=>c+" "+Math.round(x)}}}}
    _nfc[c]=e;
  }
  const v=Number.isFinite(n)?n:0;
  return e.pre?e.pre+e.fmt.format(v):e.fmt.format(v);
}

function fmtDigits(str){
  let s=String(str).replace(/[^\d.\-]/g,"");
  const neg=s.startsWith("-");if(neg)s=s.slice(1);
  const dot=s.indexOf(".");
  let intp=dot>=0?s.slice(0,dot):s;
  let frac=dot>=0?s.slice(dot):"";
  intp=intp.replace(/^0+(?=\d)/,"");
  const grouped=intp.replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return (neg?"-":"")+grouped+frac;
}
function liveFormatInput(e){
  const el=e.target;
  if(!el||el.tagName!=="INPUT")return;
  if(el.id==="nm"||el.id==="cd")return;
  const raw=el.value;
  if(raw.length>15)return;
  const out=fmtDigits(raw);
  if(out===raw)return;
  const selStart=el.selectionStart||0;
  const digitsBefore=raw.slice(0,selStart).replace(/[^\d.\-]/g,"").length;
  el.value=out;
  let pos=0,count=0;
  while(pos<out.length&&count<digitsBefore){
    if(/[\d.\-]/.test(out[pos]))count++;
    pos++;
  }
  try{el.setSelectionRange(pos,pos)}catch(_){}
}

let badF="";

  return d;
}

      if(isBoth()&&sal>0)seg.push('<span class="pos" title="'+esc(t("sal"))+'">💼 '+esc(f(sal,cur))+'</span>');

/* ══════════ SÍNTESIS DE VOZ (con caché de voces) ══════════ */
let _voices=[];
let _voiceCache={};
function preloadVoices(){
  try{
    if(!("speechSynthesis" in window))return;
    _voices=window.speechSynthesis.getVoices()||[];
    if(!_voices.length){
      window.speechSynthesis.onvoiceschanged=()=>{
        try{
          _voices=window.speechSynthesis.getVoices()||[];
          _voiceCache={};
        }catch(e){}
      };
      try{
        const u=new SpeechSynthesisUtterance("");
        u.volume=0;
        window.speechSynthesis.speak(u);
        window.speechSynthesis.cancel();
      }catch(e){}
    }
  }catch(e){}
}
function pickVoice(want){
  if(_voiceCache[want])return _voiceCache[want];
  let v=null;
  try{
    const list=_voices.length?_voices:(window.speechSynthesis.getVoices()||[]);
    const w2=want.replace("-","_");
    v=list.find(x=>x.lang===want)
     ||list.find(x=>(x.lang||"").replace("_","-")===want)
     ||list.find(x=>x.lang===w2)
     ||list.find(x=>(x.lang||"").slice(0,2)===want.slice(0,2))
     ||list.find(x=>x.default)||null;
  }catch(e){}
  _voiceCache[want]=v;
  return v;
}

function speechClean(s){
  return String(s||"")
    .replace(/C\$/g,"córdobas")
    .replace(/USD/g,(lang==="es"||lang==="pt")?"dólares":"dollars")
    .replace(/EUR/g,"euros")
    .replace(/BRL/g,lang==="pt"?"reais":"reales")
    .replace(/\$/g,(lang==="es"||lang==="pt")?"dólares":"dollars")
    .replace(/[«»“”"]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

let _speakId=0;
let _speaking=false;

function showStopBtns(show){
  try{
    const box=($("res").style.display==="block")?$("res"):$("exs");
    if(!box)return;
    box.querySelectorAll('[data-act="voiceStop"]').forEach(b=>{b.hidden=!show});
    box.querySelectorAll('[data-act="voice"] span').forEach(s=>{
      if(show){
        if(!s.dataset.orig)s.dataset.orig=s.textContent;
        s.textContent=t("voiceReading");
      }else if(s.dataset.orig){
        s.textContent=s.dataset.orig;
      }
    });
  }catch(e){}
}

function speak(text){
  if(!("speechSynthesis" in window)){showToast(t("voiceNA"),2800);return}
  const synth=window.speechSynthesis;
  const clean=speechClean(text);
  if(!clean){showToast(t("voiceNA"),2000);return}

  const myId=++_speakId;
  const langMap={es:"es-NI",en:"en-US",pt:"pt-BR",fr:"fr-FR"};
  const want=langMap[lang]||"en-US";

  try{synth.cancel()}catch(e){}
  try{synth.resume()}catch(e){}

  const parts=[];
  const sentences=clean.match(/[^.!?;]+[.!?;]*\s*/g)||[clean];
  let buf="";
  for(const s of sentences){
    if((buf+s).length>180 && buf.trim()){parts.push(buf.trim());buf=s}
    else buf+=s;
  }
  if(buf.trim())parts.push(buf.trim());
  if(!parts.length)parts=[clean];

  const run=()=>{
    if(myId!==_speakId)return;
    const voice=pickVoice(want);
    let i=0;
    _speaking=true;
    showStopBtns(true);
    setTimeout(()=>{
      if(myId!==_speakId)return;
      try{
        if(!synth.speaking&&!synth.pending&&_speaking){
          showToast(t("voiceSilent"),3800);
        }
      }catch(e){}
    },900);
    const next=()=>{
      if(myId!==_speakId){_speaking=false;showStopBtns(false);return}
      if(i>=parts.length){_speaking=false;showStopBtns(false);return}
      const u=new SpeechSynthesisUtterance(parts[i]);
      u.lang=want;
      if(voice)u.voice=voice;
      u.rate=.95;u.volume=1;u.pitch=1;
      u.onend=()=>{i++;setTimeout(next,60)};
      u.onerror=(ev)=>{try{console.warn("TTS:",ev&&ev.error)}catch(_){}};
      try{synth.speak(u)}catch(e){try{console.warn(e)}catch(_){}}
    };
    next();
  };

  let tries=0;
  const kick=()=>{
    if(myId!==_speakId)return;
    let ok=false;
    try{ok=(synth.getVoices()||[]).length>0}catch(e){}
    if(ok||tries++>=15){run();return}
    setTimeout(kick,100);
  };
  kick();
}

  try{const r=await fetch("https://open.er-api.com/v6/latest/USD");const j=await r.json();
    if(j&&j.rates&&j.rates.BRL&&j.rates.EUR){
      FX.BRL=j.rates.BRL;FX.EUR=j.rates.EUR;
      try{localStorage.setItem("cl_fx",JSON.stringify({t:Date.now(),r:{BRL:FX.BRL,EUR:FX.EUR}}))}catch(e){}
    }
  }catch(e){}
}
const nf=(n,d)=>new Intl.NumberFormat(lang,{minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
function pm(n,c){
  if(c==="NIO")return"C$ "+nf(n,2);
  if(c==="USD"){const s=nf(n,2);return"USD "+(s.endsWith(".00")||s.endsWith(",00")?s.slice(0,-3):s)}
  try{return new Intl.NumberFormat(lang,{style:"currency",currency:c,currencyDisplay:"narrowSymbol",minimumFractionDigits:2,maximumFractionDigits:2}).format(n)}
  catch(e){return c+" "+nf(n,2)}
}

function prc(){

  if(!r){$("pcv").textContent=u;$("pcs").textContent=t("pqx");return}
  $("pcv").textContent=u+" ≈ "+pm(PRICE*r,c);

}

const MANIFEST_ICON="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Crect%20fill='%230B7A5B'%20width='512'%20height='512'%20rx='112'/%3E%3Ccircle%20cx='256'%20cy='256'%20r='176'%20fill='none'%20stroke='%23fff'%20stroke-width='18'%20opacity='.35'/%3E%3Cpath%20d='M156%20256%20L216%20316%20L356%20176'%20fill='none'%20stroke='%23fff'%20stroke-width='42'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3C/svg%3E";

function pngIcon(size){
  try{
    const c=document.createElement("canvas");
    c.width=c.height=size;
    const g=c.getContext("2d");
    if(!g)return"";
    const r=size*0.22;
    g.fillStyle="#0B7A5B";
    g.beginPath();
    g.moveTo(r,0);g.lineTo(size-r,0);g.quadraticCurveTo(size,0,size,r);
    g.lineTo(size,size-r);g.quadraticCurveTo(size,size,size-r,size);
    g.lineTo(r,size);g.quadraticCurveTo(0,size,0,size-r);
    g.lineTo(0,r);g.quadraticCurveTo(0,0,r,0);
    g.closePath();g.fill();
    g.beginPath();g.arc(size/2,size/2,size*0.345,0,Math.PI*2);
    g.strokeStyle="rgba(255,255,255,.35)";g.lineWidth=Math.max(2,size*0.035);g.stroke();
    g.beginPath();
    g.moveTo(size*0.30,size*0.51);
    g.lineTo(size*0.43,size*0.63);
    g.lineTo(size*0.71,size*0.35);
    g.strokeStyle="#fff";g.lineWidth=Math.max(3,size*0.082);
    g.lineCap="round";g.lineJoin="round";g.stroke();
    return c.toDataURL("image/png");
  }catch(e){return""}
}

function setupManifest(){
  const i192=pngIcon(192)||MANIFEST_ICON;
  const i512=pngIcon(512)||MANIFEST_ICON;
  const icoType=(i192===MANIFEST_ICON)?"image/svg+xml":"image/png";
  const full=location.href.split("#")[0].split("?")[0];
  const scope=full.slice(0,full.lastIndexOf("/")+1);
  const mf={
    id:scope,name:"CréditoListo — Sabe cuánto crédito puedes pagar",short_name:"CréditoListo",
    description:"Calcula tu capacidad de pago antes de ir al banco.",
    start_url:full,scope:scope,display:"standalone",display_override:["standalone","minimal-ui"],
    orientation:"portrait-primary",background_color:"#F4F7F5",theme_color:"#0B7A5B",
    lang:"es",dir:"ltr",categories:["finance","business","productivity"],prefer_related_applications:false,
    icons:[{src:i192,sizes:"192x192",type:icoType,purpose:"any"},{src:i512,sizes:"512x512",type:icoType,purpose:"any"},{src:i512,sizes:"512x512",type:icoType,purpose:"maskable"}]
  };
  try{
    const blob=new Blob([JSON.stringify(mf)],{type:"application/manifest+json"});
    const url=URL.createObjectURL(blob);
    let link=document.querySelector('link[rel="manifest"]');
    if(!link){link=document.createElement("link");link.rel="manifest";document.head.appendChild(link)}
    link.href=url;
    const at=document.querySelector('link[rel="apple-touch-icon"]');
    if(at&&i512!==MANIFEST_ICON)at.href=i512;
  }catch(e){}
}

const AV=(document.querySelector('meta[name="app-version"]')||{}).content||"0";
const vcmp=(a,b)=>{a=a.split(".").map(Number);b=b.split(".").map(Number);for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0};
let lastInput=0;
document.addEventListener("input",()=>{lastInput=Date.now()},{capture:true,passive:true});
document.addEventListener("change",()=>{lastInput=Date.now()},{capture:true,passive:true});
async function selfUpdate(){
  try{
    if(!/^https?:$/.test(location.protocol))return;
    if($("res").style.display==="block")return;
    if(Date.now()-lastInput<180000)return;
    const ae=document.activeElement;if(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName))return;
    const n=Number(sessionStorage.getItem("cl_su")||0);if(n>=2)return;
    const url=(CFG.upd||location.origin+location.pathname)+"?_="+Date.now();
    const r=await fetch(url,{cache:"no-store"});if(!r.ok)return;
    const x=await r.text();
    if(x.indexOf("CréditoListo")===-1||x.indexOf("</html>")===-1)return;
    const m=x.match(/name="app-version"\s+content="([^"]+)"/);
    const rv=m?m[1]:"0";
    if(vcmp(rv,AV)<0)return;
    let h=x.length;for(let i=0;i<x.length;i++)h=(h*31+x.charCodeAt(i))|0;h=String(h);
    if(localStorage.getItem("cl_h")===h)return;
    localStorage.setItem("cl_h",h);sessionStorage.setItem("cl_su",String(n+1));
    location.replace(location.origin+location.pathname+"?v="+encodeURIComponent(h));
  }catch(e){}
}

  try{
    const url = CFG.paymentUrl + "?action=approve&secret=" + encodeURIComponent(CFG.adminSecret) + "&receipt=" + encodeURIComponent(receipt) + "&app=" + encodeURIComponent(CFG.appId);
    const r = await fetch(url);

  }catch(e){ console.error("Error de red:", e); }
};
