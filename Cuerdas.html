    @keyframes pulseGlow {

    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes confettiBurst {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }

    .animate-pulse-slow { animation: pulseSlow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    .animate-fadeIn { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

      height: 14px;

      left: calc(50% - 7px);

    class QuantumAudioEngine {
      constructor() {
        this.ctx = null;
        this.osc1 = null;
        this.osc2 = null;
        this.filter = null;
        this.gain = null;
        this.isMuted = false;
        this.isStarted = false;
      }

      start() {
        if (this.isStarted) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          this.ctx = new AudioCtx();
          this.gain = this.ctx.createGain();
          this.gain.gain.setValueAtTime(this.isMuted ? 0 : 0.035, this.ctx.currentTime);

          this.filter = this.ctx.createBiquadFilter();
          this.filter.type = 'lowpass';
          this.filter.frequency.setValueAtTime(450, this.ctx.currentTime);

          this.osc1 = this.ctx.createOscillator();
          this.osc1.type = 'sine';
          this.osc1.frequency.setValueAtTime(54.7, this.ctx.currentTime);

          this.osc2 = this.ctx.createOscillator();
          this.osc2.type = 'triangle';
          this.osc2.frequency.setValueAtTime(109.4, this.ctx.currentTime);

          this.osc1.connect(this.filter);
          this.osc2.connect(this.filter);
          this.filter.connect(this.gain);
          this.gain.connect(this.ctx.destination);

          this.osc1.start();
          this.osc2.start();
          this.isStarted = true;
        } catch(e) {}
      }

      updateParameters(freqGHz, powerMW, isEmergency) {
        if (!this.ctx || !this.isStarted || this.isMuted) return;
        try {
          if (this.ctx.state === 'suspended') this.ctx.resume();
          if (isEmergency) {
            const baseAlarm = 600 + Math.sin(this.ctx.currentTime * 10) * 200;
            this.osc1?.frequency.setTargetAtTime(baseAlarm, this.ctx.currentTime, 0.05);
            this.osc2?.frequency.setTargetAtTime(baseAlarm * 1.5, this.ctx.currentTime, 0.05);
            this.gain?.gain.setTargetAtTime(0.06, this.ctx.currentTime, 0.05);
            return;
          }
          const baseHum = 40 + (freqGHz / 100) * 60;
          this.osc1?.frequency.setTargetAtTime(baseHum, this.ctx.currentTime, 0.2);
          this.osc2?.frequency.setTargetAtTime(baseHum * 2.01, this.ctx.currentTime, 0.2);
          const targetGain = Math.min(0.06, 0.008 + (powerMW / 60) * 0.04);
          this.gain?.gain.setTargetAtTime(targetGain, this.ctx.currentTime, 0.1);
        } catch(e) {}
      }

      playClick() {
        if (this.isMuted) return;
        try {
          if (!this.ctx) this.start();
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(440, this.ctx.currentTime + 0.04);
          g.gain.setValueAtTime(0.05, this.ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.04);
          osc.connect(g);
          g.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);
        } catch(e) {}
      }

      playPulseSound() {
        if (this.isMuted) return;
        try {
          if (!this.ctx) this.start();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.2);
          osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.6);
          g.gain.setValueAtTime(0.08, this.ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.6);
          osc.connect(g);
          g.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.6);
        } catch(e) {}
      }

      toggleMute() {
        this.isMuted = !this.isMuted;
        if (this.gain && this.ctx) {
          this.gain.gain.setTargetAtTime(this.isMuted ? 0 : 0.035, this.ctx.currentTime, 0.1);
        }
        return this.isMuted;
      }
    }
    window.quantumAudio = new QuantumAudioEngine();

      }
      chamberGroup.add(upperCryo);
      rootGroup.add(chamberGroup);

      // 2. Cosmic Strings & Particles
      const stringCore = new THREE.Group();
      stringCore.position.y = 2.8;
      const stringLines = [];
      const stringColors = [0x38bdf8, 0x06b6d4, 0xf43f5e, 0x8b5cf6, 0x0284c7, 0x10b981, 0xd946ef, 0x00f5ff];

      // 8 string lines
      for (let s = 0; s < 8; s++) {
        const pts = [];
        for (let i = 0; i <= 100; i++) pts.push(new THREE.Vector3());
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        const mat = new THREE.LineBasicMaterial({
          color: stringColors[s % stringColors.length],
          linewidth: 2.5,
          transparent: true,
          opacity: 0.9,
        });
        const line = new THREE.Line(geo, mat);
        stringCore.add(line);
        stringLines.push(line);
      }

      // 450 Particles Vortex
      const pCount = 450;
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(pCount * 3);
      const pCols = new Float32Array(pCount * 3);
      for (let p = 0; p < pCount; p++) {
        const r = 0.2 + Math.random() * 1.5;
        const th = Math.random() * Math.PI * 2;
        const ph = (Math.random() - 0.5) * Math.PI;
        pPos[p * 3] = r * Math.cos(th) * Math.cos(ph);
        pPos[p * 3 + 1] = (Math.random() - 0.5) * 3.2;
        pPos[p * 3 + 2] = r * Math.sin(th) * Math.cos(ph);
        pCols[p * 3] = 0.2 + Math.random() * 0.8;
        pCols[p * 3 + 1] = 0.7 + Math.random() * 0.3;
        pCols[p * 3 + 2] = 1.0;
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
      pGeo.setAttribute('color', new THREE.BufferAttribute(pCols, 3));
      const coreParticles = new THREE.Points(
        pGeo,
        new THREE.PointsMaterial({
          size: 0.055,
          vertexColors: true,
          transparent: true,
          opacity: 0.85,
          blending: THREE.AdditiveBlending,
        })
      );
      stringCore.add(coreParticles);

      // BEC Cloud (600 Particles)
      const becGeo = new THREE.BufferGeometry();
      const becPos = new Float32Array(600 * 3);
      for (let i = 0; i < 600 * 3; i += 3) {
        becPos[i] = (Math.random() - 0.5) * 0.9;
        becPos[i + 1] = (Math.random() - 0.5) * 0.9;
        becPos[i + 2] = (Math.random() - 0.5) * 0.9;
      }
      becGeo.setAttribute('position', new THREE.BufferAttribute(becPos, 3));
      const becParticles = new THREE.Points(
        becGeo,
        new THREE.PointsMaterial({ color: 0x06b6d4, size: 0.065, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending })
      );
      stringCore.add(becParticles);

      // Soliton Mesh
      const solitonMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.2, 24, 24),
        new THREE.MeshBasicMaterial({ color: 0xec4899, transparent: true, opacity: 0.9 })
      );
      solitonMesh.visible = false;
      stringCore.add(solitonMesh);
      rootGroup.add(stringCore);

      // 3. Sensors
      const sensorsGroup = new THREE.Group();
      for (let i = 0; i < 4; i++) {
        const a = (i * Math.PI) / 2 + Math.PI / 8;
        const pod = new THREE.Group();
        pod.position.set(Math.cos(a) * 3.6, 2.8, Math.sin(a) * 3.6);
        pod.lookAt(0, 2.8, 0);
        pod.add(new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.4), titaniumMat));
        const diode = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 12), new THREE.MeshBasicMaterial({ color: 0x10b981 }));
        diode.position.set(0, 0.3, 0.24);
        pod.add(diode);
        sensorsGroup.add(pod);
      }
      rootGroup.add(sensorsGroup);

      // 4. Oscillators
      const oscGroup = new THREE.Group();
      oscGroup.position.set(4.5, 0, 0);
      const oscBox = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.2, 2.2), titaniumMat);
      oscBox.position.y = 1.3;
      oscGroup.add(oscBox);
      for (let qx = -0.5; qx <= 0.5; qx += 1.0) {
        for (let qy = 0.9; qy <= 1.7; qy += 0.8) {
          const sc = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.6), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
          sc.position.set(qx * 0.9, qy, 1.11);
          oscGroup.add(sc);
        }
      }
      rootGroup.add(oscGroup);

      // 5. AI Rack with Node Graph
      const rackGroup = new THREE.Group();
      rackGroup.position.set(8.5, 0, 2.5);
      const rackBox = new THREE.Mesh(new THREE.BoxGeometry(2.0, 4.5, 1.8), new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9 }));
      rackBox.position.y = 2.25;
      rackGroup.add(rackBox);
      for (let b = 0; b < 6; b++) {
        const blade = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.55, 0.05), new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.7 }));
        blade.position.set(0, 0.6 + b * 0.65, 0.92);
        rackGroup.add(blade);
        const led = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
        led.position.set(0.7, 0.6 + b * 0.65, 0.96);
        rackGroup.add(led);
      }
      rootGroup.add(rackGroup);

      // AI Nodes Graph
      const aiNodesGroup = new THREE.Group();
      const aiLinesGroup = new THREE.Group();
      const nodeCount = 12;
      const nodeRadius = 3.8;
      const nodePositions = [];
      for (let i = 0; i < nodeCount; i++) {
        const phi = Math.acos(-1 + 2 * i / nodeCount);
        const theta = Math.sqrt(nodeCount * Math.PI) * phi;
        const pos = new THREE.Vector3(
          nodeRadius * Math.cos(theta) * Math.sin(phi),
          nodeRadius * Math.sin(theta) * Math.sin(phi),
          nodeRadius * Math.cos(phi)
        );
        nodePositions.push(pos);
        const nodeMesh = new THREE.Mesh(
          new THREE.IcosahedronGeometry(0.18, 1),
          new THREE.MeshBasicMaterial({ color: i % 2 === 0 ? 0x4fc3f7 : 0x81c784, wireframe: true })
        );
        nodeMesh.position.copy(pos);
        aiNodesGroup.add(nodeMesh);
      }
      for (let i = 0; i < nodeCount; i++) {
        for (let j = i + 1; j < nodeCount; j++) {
          if (nodePositions[i].distanceTo(nodePositions[j]) < 4.5) {
            const lineGeo = new THREE.BufferGeometry().setFromPoints([nodePositions[i], nodePositions[j]]);
            const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0x4fc3f7, transparent: true, opacity: 0.35 }));
            aiLinesGroup.add(line);
          }
        }
      }
      aiNodesGroup.position.set(8.5, 2.25, 2.5);
      aiLinesGroup.position.set(8.5, 2.25, 2.5);
      rootGroup.add(aiNodesGroup);
      rootGroup.add(aiLinesGroup);

      // 6. Laser Coupler & Pylon
      const laserBeamMesh = new THREE.Mesh(
        new THREE.TubeGeometry(new THREE.LineCurve3(new THREE.Vector3(0, 2.8, 2.8), new THREE.Vector3(12.0, 8.0, -10.0)), 30, 0.09, 16, false),
        new THREE.MeshBasicMaterial({ color: 0xf43f5e, transparent: true, opacity: 0.85 })
      );
      rootGroup.add(laserBeamMesh);

      const pylonGroup = new THREE.Group();
      pylonGroup.position.set(12.0, 0, -10.0);
      const pylonPole = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.4, 8, 16), titaniumMat);
      pylonPole.position.y = 4;
      pylonGroup.add(pylonPole);
      const recv = new THREE.Mesh(new THREE.SphereGeometry(0.75, 24, 24), new THREE.MeshBasicMaterial({ color: 0xf43f5e }));
      recv.position.y = 8.0;
      pylonGroup.add(recv);
      rootGroup.add(pylonGroup);

      // 7. Operator Station
      const operatorGroup = new THREE.Group();
      operatorGroup.position.set(-3.5, 0, 4.5);
      operatorGroup.rotation.y = Math.PI / 5;
      const desk = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.15, 1.6), titaniumMat);
      desk.position.y = 1.0;
      operatorGroup.add(desk);
      const holoScreen = new THREE.Mesh(
        new THREE.CylinderGeometry(2.0, 2.0, 1.4, 32, 1, true, -Math.PI / 4, Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.45, side: THREE.DoubleSide })
      );
      holoScreen.position.set(0, 1.8, -0.4);
      operatorGroup.add(holoScreen);
      rootGroup.add(operatorGroup);

      // 8. Shield & Shockwave & Section
      const shieldMesh = new THREE.Mesh(
        new THREE.IcosahedronGeometry(5.4, 2),
        new THREE.MeshStandardMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.15, metalness: 0.9 })
      );
      shieldMesh.position.y = 2.8;
      shieldMesh.visible = false;
      rootGroup.add(shieldMesh);

      const pulseMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 24, 24),
        new THREE.MeshBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.65 })
      );
      pulseMesh.position.set(0, 2.8, 0);
      pulseMesh.visible = false;
      rootGroup.add(pulseMesh);

      const sectionPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(8, 8),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.2, side: THREE.DoubleSide })
      );
      sectionPlane.rotation.x = Math.PI / 2;
      sectionPlane.position.y = 2.8;
      sectionPlane.visible = false;
      rootGroup.add(sectionPlane);

      // Lightning (for storm mode)
      const lightningGroup = new THREE.Group();
      lightningGroup.visible = false;
      scene.add(lightningGroup);

      // Flow particles
      const flowParticles = [];

      // ---- Interaction handlers ----
      const targetCamPos = new THREE.Vector3(12, 8, 16);
      const targetLookAt = new THREE.Vector3(0, 2.8, 0);
      let isDragging = false;
      let lastMouse = { x: 0, y: 0 };

      const handleMouseDown = (e) => {
        isDragging = true;
        lastMouse = { x: e.clientX, y: e.clientY };
      };

      const handleMouseMove = (e) => {
        if (!isDragging) return;
        const dx = e.clientX - lastMouse.x;
        const dy = e.clientY - lastMouse.y;
        const radius = Math.hypot(targetCamPos.x, targetCamPos.z);
        const angle = Math.atan2(targetCamPos.z, targetCamPos.x) - dx * 0.008;
        targetCamPos.x = radius * Math.cos(angle);
        targetCamPos.z = radius * Math.sin(angle);
        targetCamPos.y = Math.max(-2, Math.min(22, targetCamPos.y + dy * 0.03));
        lastMouse = { x: e.clientX, y: e.clientY };
      };

      const handleMouseUp = () => { isDragging = false; };

      const handleWheel = (e) => {
        e.preventDefault();
        const factor = e.deltaY > 0 ? 1.08 : 0.92;
        targetCamPos.multiplyScalar(factor);
        targetCamPos.clampLength(2.5, 45);
      };

      const handleDblClick = () => {
        const props = getProps();
        if (props && props.onTriggerPulse) props.onTriggerPulse();
      };

      const handleResize = () => {
        if (!container || !renderer || !camera) return;
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      };

      container.addEventListener('mousedown', handleMouseDown);
      window.addEventListener('mousemove', handleMouseMove);
      window.addEventListener('mouseup', handleMouseUp);
      container.addEventListener('wheel', handleWheel, { passive: false });
      container.addEventListener('dblclick', handleDblClick);
      window.addEventListener('resize', handleResize);

      // ---- Mode Colors Map ----
      const modeColors = {
        standby: { bg: 0x020617, beam: 0x38bdf8, light: 0x38bdf8, intensity: 1.0 },
        analysis: { bg: 0x022c22, beam: 0x10b981, light: 0x10b981, intensity: 2.2 },
        diagnostic: { bg: 0x1c1917, beam: 0xf59e0b, light: 0xf59e0b, intensity: 2.0 },
        simulation: { bg: 0x0f172a, beam: 0x8b5cf6, light: 0x8b5cf6, intensity: 2.5 },
        operation: { bg: 0x030712, beam: 0xf43f5e, light: 0x38bdf8, intensity: 3.5 },
        maintenance: { bg: 0x1e1b4b, beam: 0x6366f1, light: 0x6366f1, intensity: 1.8 },
        emergency: { bg: 0x450a0a, beam: 0xef4444, light: 0xef4444, intensity: 4.5 },
        energy_boost: { bg: 0x2e1065, beam: 0xd946ef, light: 0xd946ef, intensity: 4.8 },
        ai_mode: { bg: 0x082f49, beam: 0x06b6d4, light: 0x06b6d4, intensity: 3.2 },
        hybrid: { bg: 0x052e16, beam: 0x22c55e, light: 0x22c55e, intensity: 3.0 },
        enjambre: { bg: 0x0c0a09, beam: 0x0284c7, light: 0x0284c7, intensity: 3.0 },
        espectral: { bg: 0x18181b, beam: 0xa855f7, light: 0xa855f7, intensity: 2.8 },
        transferencia: { bg: 0x1e1e24, beam: 0xf59e0b, light: 0xf59e0b, intensity: 3.6 },
        historico: { bg: 0x111827, beam: 0x14b8a6, light: 0x14b8a6, intensity: 2.0 },
        tormenta: { bg: 0x310505, beam: 0xff0055, light: 0xff3300, intensity: 5.0 },
        quantum_tunneling: { bg: 0x1e0b36, beam: 0xc084fc, light: 0xa855f7, intensity: 4.2 },
        superposition: { bg: 0x032830, beam: 0x22d3ee, light: 0x06b6d4, intensity: 3.8 },
        reposo: { bg: 0x01050d, beam: 0x1e3a5f, light: 0x38bdf8, intensity: 0.8 },
      };

      let lastSystemMode = '';

      // ---- Animation Loop ----
      const clock = new THREE.Clock();
      let animId;

      function animate() {
        animId = requestAnimationFrame(animate);
        const elapsed = clock.getElapsedTime();
        const props = getProps() || {};
        const {
          systemMode = 'operation',
          cameraView = 'orbit',
          viewMode = 'normal',
          focusTarget = 'all',
          explodedDistance = 0,
          autoRotate = false,
          physicsParams = {},
          interactions = {},
          telemetry = {}
        } = props;

        // ---- Mode lighting & atmosphere ----
        if (systemMode !== lastSystemMode) {
          lastSystemMode = systemMode;
          const cfg = modeColors[systemMode] || modeColors.operation;
          scene.background.setHex(cfg.bg);
          if (scene.fog) scene.fog.color.setHex(cfg.bg);
          if (laserBeamMesh && laserBeamMesh.material) laserBeamMesh.material.color.setHex(cfg.beam);
          if (coreLight) {
            coreLight.color.setHex(cfg.light);
            coreLight.intensity = cfg.intensity;
          }
        }

        // ---- Camera target ----
        if (!isDragging) {
          if (focusTarget === 'cryostat') {
            targetCamPos.set(4, 7.5, 4);
            targetLookAt.set(0, 5.8, 0);
          } else if (focusTarget === 'sensors') {
            targetCamPos.set(4.5, 3.5, 4.5);
            targetLookAt.set(2.5, 2.8, 2.5);
          } else if (focusTarget === 'ai') {
            targetCamPos.set(11, 4, 6);
            targetLookAt.set(8.5, 2.5, 2.5);
          } else if (focusTarget === 'graphene') {
            targetCamPos.set(8, 3.5, 3);
            targetLookAt.set(4.5, 1.3, 0);
          } else if (focusTarget === 'shield') {
            targetCamPos.set(10, 5, 12);
            targetLookAt.set(0, 2.8, 0);
          } else if (focusTarget === 'laser') {
            targetCamPos.set(5, 5, 8);
            targetLookAt.set(4, 3.5, 0);
          } else if (focusTarget === 'operator') {
            targetCamPos.set(-2, 2.5, 7);
            targetLookAt.set(-3.5, 1.5, 4.5);
          } else if (focusTarget === 'chamber' || focusTarget === 'strings') {
            targetCamPos.set(6, 3.8, 6);
            targetLookAt.set(0, 2.8, 0);
          } else if (cameraView === 'exploded') {
            targetCamPos.set(18, 12, 20);
            targetLookAt.set(3, 2.8, 0);
          } else if (cameraView === 'xray') {
            targetCamPos.set(0, 4, 9);
            targetLookAt.set(0, 2.8, 0);
          } else if (cameraView === 'section') {
            targetCamPos.set(6, 4, 7);
            targetLookAt.set(0, 2.8, 0);
          } else if (cameraView === 'internal') {
            targetCamPos.set(0.05, 2.8, 0.05);
            targetLookAt.set(0, 3.2, 2);
          } else if (cameraView === 'drone') {
            targetCamPos.set(19, 15, -10);
            targetLookAt.set(4, 2, 0);
          } else {
            targetCamPos.set(12, 8, 16);
            targetLookAt.set(0, 2.8, 0);
          }
        }

        if (autoRotate) {
          const rad = Math.hypot(targetCamPos.x, targetCamPos.z);
          const ang = Math.atan2(targetCamPos.z, targetCamPos.x) + 0.008;
          targetCamPos.x = rad * Math.cos(ang);
          targetCamPos.z = rad * Math.sin(ang);
        }

        camera.position.lerp(targetCamPos, 0.05);
        camera.lookAt(targetLookAt);

        // ---- Exploded View ----
        const d = explodedDistance;
        upperCryo.position.y = d * 3.8;
        lowerBase.position.y = -d * 2.2;
        flanges.scale.set(1 + d * 0.85, 1, 1 + d * 0.85);
        sensorsGroup.position.set(0, 0, d * 3.2);
        oscGroup.position.x = 4.5 + d * 4.5;
        rackGroup.position.x = 8.5 + d * 5.5;
        rackGroup.position.z = 2.5 + d * 4.5;

        // ---- X-ray / Section view modes ----
        if (viewMode === 'xray') {
          titaniumMat.wireframe = true;
          titaniumMat.transparent = true;
          titaniumMat.opacity = 0.25;
          glassMat.opacity = 0.9;
          glassMat.color.setHex(0x00ccff);
        } else if (viewMode === 'section') {
          titaniumMat.wireframe = false;
          titaniumMat.transparent = true;
          titaniumMat.opacity = 0.35;
          sectionPlane.visible = true;
          sectionPlane.position.y = 2.8 + Math.sin(elapsed * 0.8) * 1.2;
        } else {
          titaniumMat.wireframe = false;
          titaniumMat.transparent = false;
          titaniumMat.opacity = 1.0;
          glassMat.opacity = 0.6;
          glassMat.color.setHex(0x38bdf8);
          sectionPlane.visible = false;
        }

        // ---- Cosmic strings harmonics ----
        const freq = ((physicsParams.oscillatorFreqGHz || 43.25) / 43.25) * 2.4;
        const amp = 0.65 * (physicsParams.stringTensionExp || 1.0);
        const hModes = physicsParams.harmonicModes || 6;

        const isTunneling = systemMode === 'quantum_tunneling';
        const isSuperposition = systemMode === 'superposition';
        const isReposo = systemMode === 'reposo';
        const isEspectral = systemMode === 'espectral';
        const isEnjambre = systemMode === 'enjambre';

        stringLines.forEach((line, s) => {
          const pos = line.geometry.attributes.position;
          const count = pos.count;
          const phase = (s * Math.PI) / 4;
          for (let i = 0; i < count; i++) {
            const u = (i / count) * Math.PI * 2;
            const y = ((i / count) - 0.5) * 3.6;
            const waveSimFactor = interactions.waveSim ? 1.35 * Math.sin(elapsed * 4 + u * 3) : 0;
            let r = 0.7 + amp * 0.25 * Math.sin(hModes * u + elapsed * freq + phase) + waveSimFactor * 0.15;
            let th = u * 2 + Math.cos(elapsed * 1.5 + phase) * 0.4;

            if (isTunneling) {
              if (Math.sin(elapsed * 8 + i * 0.5) > 0.85) r += (Math.random() - 0.5) * 0.35;
            } else if (isSuperposition) {
              r += 0.22 * Math.sin(u * 5 + elapsed * 3) * Math.cos(u * 3 - elapsed * 2);
              th += 0.3 * Math.sin(elapsed * 3 + u * 4);
            } else if (isReposo) {
              r = 0.65 + 0.05 * Math.sin(u * 2 + elapsed * 0.5);
            } else if (isEspectral) {
              r += 0.12 * Math.sin(u * (s + 1) * 2 + elapsed * 6);
            }

            pos.setXYZ(i, r * Math.cos(th), y, r * Math.sin(th));
          }
          pos.needsUpdate = true;
        });

        if (isEspectral) {
          stringCore.children.forEach(child => {
            if (child.isLine && child.material) {
              const hue = (elapsed * 0.05 + child.id * 0.3) % 1;
              child.material.color.setHSL(hue, 0.9, 0.6);
            }
          });
        } else {
          stringLines.forEach((line, idx) => {
            line.material.color.setHex(stringColors[idx % stringColors.length]);
          });
        }

        const pRotSpeed = isTunneling ? 1.2 : isSuperposition ? 0.7 : isReposo ? 0.08 : isEnjambre ? 0.9 : 0.35;
        coreParticles.rotation.y = elapsed * pRotSpeed;
        const becRotSpeed = isReposo ? -0.05 : isEnjambre ? -0.8 : -0.25;
        becParticles.rotation.y = elapsed * becRotSpeed;

        if (isEnjambre) {
          aiNodesGroup.children.forEach((node, i) => {
            const ang = elapsed * 0.5 + i;
            node.position.x += Math.sin(ang) * 0.002;
            node.position.y += Math.cos(ang * 1.3) * 0.002;
            node.position.z += Math.sin(ang * 0.7 + 1) * 0.002;
          });
        }

        // ---- Orbital Flow ----
        if (interactions.flowSim) {
          if (flowParticles.length === 0) {
            for (let i = 0; i < 70; i++) {
              const geo = new THREE.SphereGeometry(0.06, 8, 8);
              const mat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.8 });
              const mesh = new THREE.Mesh(geo, mat);
              const ang = Math.random() * Math.PI * 2;
              const rad = 1.8 + Math.random() * 2.2;
              mesh.position.set(rad * Math.cos(ang), 2.8 + (Math.random() - 0.5) * 1.5, rad * Math.sin(ang));
              mesh.userData = { angle: ang, rad: rad, speed: 0.6 + Math.random() * 0.8 };
              scene.add(mesh);
              flowParticles.push(mesh);
            }
          }
          flowParticles.forEach((p, idx) => {
            const speed = (p.userData.speed || 1.0) * 0.8;
            p.userData.angle = (p.userData.angle || 0) + 0.015 * speed;
            const rad = p.userData.rad || 2.2;
            p.position.x = rad * Math.cos(p.userData.angle);
            p.position.z = rad * Math.sin(p.userData.angle);
            p.position.y = 2.8 + Math.sin(elapsed * 2 + idx) * 0.8;
            p.material.color.setHSL(0.08 + 0.1 * Math.sin(elapsed + p.userData.angle), 1, 0.5);
          });
        } else if (!interactions.flowSim && flowParticles.length > 0) {
          flowParticles.forEach(p => scene.remove(p));
          flowParticles.length = 0;
        }

        // ---- Soliton ----
        if (interactions.soliton || systemMode === 'transferencia' || systemMode === 'tormenta') {
          solitonMesh.visible = true;
          const ang = elapsed * 3;
          solitonMesh.position.set(1.2 * Math.cos(ang), Math.sin(elapsed * 4) * 1.2, 1.2 * Math.sin(ang));
        } else {
          solitonMesh.visible = false;
        }

        // ---- Shield ----
        shieldMesh.visible = interactions.shield || systemMode === 'maintenance' || systemMode === 'tormenta';

        // ---- Pulse ----
        if (interactions.pulseActive) {
          pulseMesh.visible = true;
          const dt = (Date.now() - (interactions.pulseTime || Date.now())) / 1800;
          const sc = 0.5 + dt * 5.0;

          particles.push({

            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2,
            r: 2 + Math.random() * 4,

          grad.addColorStop(0, 'rgba(56, 189, 248, 0.2)');
          grad.addColorStop(1, 'rgba(2, 6, 23, 0.9)');
          ctx.fillStyle = grad;

          ctx.lineWidth = 1;

            ctx.beginPath();

            ctx.lineTo(w, y);
            ctx.stroke();

          React.createElement('aside', {
            className: 'absolute top-0 bottom-0 left-0 z-30 w-80 sm:w-96 p-3 transition-transform duration-300 ease-in-out ' + (isControlsOpen ? 'translate-x-0' : '-translate-x-full')
          },
            React.createElement('div', { className: 'relative h-full' },
              React.createElement(StandaloneControlsPanel, {
                lang, systemMode, onSetSystemMode: setSystemMode, physicsParams,
                onUpdatePhysics: (p) => setPhysicsParams(prev => ({ ...prev, ...p })),
                interactions, onUpdateInteractions: (i) => setInteractions(prev => ({ ...prev, ...i })),
                onEmergencyStop: handleEmergencyStop, onResetSystem: handleResetSystem, t
              }),
              React.createElement('button', {
                onClick: () => setIsControlsOpen(false),
                className: 'absolute top-4 right-4 p-1.5 rounded-xl bg-slate-800 text-slate-300 hover:text-white cursor-pointer'
              }, React.createElement(window.Icon, { name: 'x', className: 'w-4 h-4' }))
            )
          ),
          !isControlsOpen && React.createElement('button', {
            onClick: () => { if (window.quantumAudio) window.quantumAudio.playClick(); setIsControlsOpen(true); },
            className: 'absolute top-4 left-4 z-20 px-3.5 py-2 rounded-2xl bg-slate-950/90 hover:bg-slate-900 text-cyan-300 border border-cyan-500/40 text-xs font-mono font-bold flex items-center gap-2 shadow-2xl cursor-pointer'
          }, React.createElement(window.Icon, { name: 'sliders', className: 'w-4 h-4 text-cyan-400' }), React.createElement('span', null, t.header.calibration)),

          React.createElement('div', { className: 'relative flex-1 w-full h-full' },
            React.createElement('div', { ref: mountRef, className: 'w-full h-full cursor-grab active:cursor-grabbing select-none' }),
            React.createElement(StandaloneTacticalHUD, {
              lang, systemMode, onSetSystemMode: setSystemMode,
              cameraView, onSetCameraView: setCameraView,
              viewMode, onSetViewMode: setViewMode,
              focusTarget, onSetFocusTarget: setFocusTarget,
              explodedDistance, onSetExplodedDistance: setExplodedDistance,
              autoRotate, onToggleAutoRotate: () => setAutoRotate(!autoRotate),
              telemetry, selectedModule, onSelectModule: setSelectedModule,
              onOpenManual: () => setIsManualOpen(true),
              onOpenPhysicsLab: () => setIsPhysicsLabOpen(true),
              onOpenAR: () => setIsAROpen(true),
              onOpenExport: () => setIsExportOpen(true),
              onEmergencyStop: handleEmergencyStop, t
            })
          )
        ),

        isManualOpen && React.createElement(StandaloneManualModal, { lang, onClose: () => setIsManualOpen(false), t }),
        isPhysicsLabOpen && React.createElement(StandalonePhysicsLabModal, {
          lang, onClose: () => setIsPhysicsLabOpen(false), physicsParams,
          onUpdateParams: (p) => setPhysicsParams(p),
          onApplyScenario: handleApplyScenario, t
        }),
        isAROpen && React.createElement(StandaloneARModal, { lang, onClose: () => setIsAROpen(false), t }),
        isExportOpen && React.createElement(StandaloneExportModal, { lang, onClose: () => setIsExportOpen(false), t }),
        isProjectInfoOpen && React.createElement(StandaloneProjectInfoModal, { lang, onClose: () => setIsProjectInfoOpen(false), t })
      );
    }

    // ============================================================
    // 8. BOOT
    // ============================================================
    const rootElem = document.getElementById('root');
    if (ReactDOM.createRoot) {
      ReactDOM.createRoot(rootElem).render(React.createElement(StandaloneApp));
    } else {
      ReactDOM.render(React.createElement(StandaloneApp), rootElem);
    }
  </script>
</body>
</html>
