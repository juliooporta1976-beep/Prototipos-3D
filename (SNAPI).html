    // ----- GENERADORES DE TEXTURAS DE BANDERAS (procedural) -----
    function createNicaraguaFlagTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 2048;
      canvas.height = 1280;
      const ctx = canvas.getContext('2d');
      if (!ctx) return new THREE.CanvasTexture(canvas);
      const w = canvas.width, h = canvas.height, sH = h / 3;
      ctx.fillStyle = '#0055A5';
      ctx.fillRect(0, 0, w, sH);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, sH, w, sH);
      ctx.fillStyle = '#0055A5';
      ctx.fillRect(0, sH * 2, w, sH);
      const cx = w / 2, cy = h / 2, ringRadius = 160;
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, ringRadius + 20, 0, Math.PI * 2);
      ctx.strokeStyle = '#D4AF37';
      ctx.lineWidth = 6;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, ringRadius - 8, 0, Math.PI * 2);
      ctx.strokeStyle = '#D4AF37';
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.font = 'bold 32px sans-serif';
      ctx.fillStyle = '#D4AF37';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const textTop = 'REPÚBLICA DE NICARAGUA';
      const textRadiusTop = ringRadius + 6;
      const angleSpanTop = Math.PI * 0.88;
      const startAngleTop = -Math.PI / 2 - angleSpanTop / 2;
      const stepTop = angleSpanTop / (textTop.length - 1);
      for (let i = 0; i < textTop.length; i++) {
        const angle = startAngleTop + i * stepTop;
        ctx.save();
        ctx.translate(cx + Math.cos(angle) * textRadiusTop, cy + Math.sin(angle) * textRadiusTop);
        ctx.rotate(angle + Math.PI / 2);
        ctx.fillText(textTop[i], 0, 0);
        ctx.restore();
      }
      const textBottom = 'AMÉRICA CENTRAL';
      const textRadiusBottom = ringRadius + 6;
      const angleSpanBottom = Math.PI * 0.65;
      const startAngleBottom = Math.PI / 2 + angleSpanBottom / 2;
      const stepBottom = angleSpanBottom / (textBottom.length - 1);
      for (let i = 0; i < textBottom.length; i++) {
        const angle = startAngleBottom - i * stepBottom;
        ctx.save();
        ctx.translate(cx + Math.cos(angle) * textRadiusBottom, cy + Math.sin(angle) * textRadiusBottom);
        ctx.rotate(angle - Math.PI / 2);
        ctx.fillText(textBottom[i], 0, 0);
        ctx.restore();
      }
      const triSize = 180;
      const tApex = { x: cx, y: cy - triSize * 0.58 };
      const tLeft = { x: cx - triSize / 2, y: cy + triSize * 0.42 };
      const tRight = { x: cx + triSize / 2, y: cy + triSize * 0.42 };
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(tApex.x, tApex.y);
      ctx.lineTo(tRight.x, tRight.y);
      ctx.lineTo(tLeft.x, tLeft.y);
      ctx.closePath();
      ctx.clip();
      const grad = ctx.createLinearGradient(cx, tApex.y, cx, tLeft.y);
      grad.addColorStop(0, '#4fc3f7');
      grad.addColorStop(0.5, '#bbdefb');
      grad.addColorStop(1, '#90caf9');
      ctx.fillStyle = grad;
      ctx.fillRect(cx - 120, cy - 120, 240, 240);
      const rainbowColors = ['#e53935', '#fb8c00', '#fdd835', '#43a047', '#00acc1', '#1e88e5', '#8e24aa'];
      const rainbowCenterY = cy + 40;
      const rainbowR = 100;
      rainbowColors.forEach((color, idx) => {
        ctx.beginPath();
        ctx.arc(cx, rainbowCenterY, rainbowR - idx * 5, Math.PI, 0, false);
        ctx.strokeStyle = color;
        ctx.lineWidth = 5;
        ctx.stroke();
      });
      const capX = cx, capY = cy - 30;
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 215, 0, 0.9)';
      ctx.lineWidth = 3;
      for (let a = 0; a < Math.PI * 2; a += Math.PI / 10) {
        ctx.beginPath();
        ctx.moveTo(capX, capY);
        ctx.lineTo(capX + Math.cos(a) * 50, capY + Math.sin(a) * 50);
        ctx.stroke();
      }
      ctx.restore();
      const volcanoBaseY = cy + 30;
      const volcanoes = [
        { x: cx - 70, w: 40, h: 50 },
        { x: cx - 35, w: 45, h: 60 },
        { x: cx,      w: 50, h: 70 },
        { x: cx + 35, w: 45, h: 60 },
        { x: cx + 70, w: 40, h: 50 }
      ];
      volcanoes.forEach((v) => {
        ctx.beginPath();
        ctx.moveTo(v.x, volcanoBaseY - v.h);
        ctx.lineTo(v.x, volcanoBaseY);
        ctx.lineTo(v.x - v.w / 2, volcanoBaseY);
        ctx.closePath();
        ctx.fillStyle = '#388E3C';
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(v.x, volcanoBaseY - v.h);
        ctx.lineTo(v.x + v.w / 2, volcanoBaseY);
        ctx.lineTo(v.x, volcanoBaseY);
        ctx.closePath();
        ctx.fillStyle = '#1B5E20';
        ctx.fill();
        ctx.strokeStyle = '#81C784';
        ctx.lineWidth = 2;
        ctx.stroke();
      });
      const seaGrad = ctx.createLinearGradient(cx, volcanoBaseY - 2, cx, tLeft.y + 20);
      seaGrad.addColorStop(0, '#0277bd');
      seaGrad.addColorStop(0.6, '#01579b');
      seaGrad.addColorStop(1, '#002f6c');
      ctx.fillStyle = seaGrad;
      ctx.fillRect(cx - 120, volcanoBaseY - 2, 240, 50);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 2;
      for (let wy = volcanoBaseY + 4; wy < volcanoBaseY + 45; wy += 6) {
        ctx.beginPath();
        ctx.moveTo(cx - 80, wy);
        ctx.lineTo(cx + 80, wy);
        ctx.stroke();
      }
      ctx.fillStyle = '#d50000';
      ctx.beginPath();
      ctx.arc(capX, capY, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(capX - 8, capY);
      ctx.lineTo(capX + 14, capY - 12);
      ctx.lineTo(capX + 8, capY + 6);
      ctx.closePath();
      ctx.fillStyle = '#b71c1c';
      ctx.fill();
      ctx.fillStyle = '#fff59d';
      ctx.beginPath();
      ctx.arc(capX, capY, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.beginPath();
      ctx.moveTo(tApex.x, tApex.y);
      ctx.lineTo(tRight.x, tRight.y);
      ctx.lineTo(tLeft.x, tLeft.y);
      ctx.closePath();
      ctx.strokeStyle = '#D4AF37';
      ctx.lineWidth = 6;
      ctx.stroke();
      ctx.restore();
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

        // ===== ETIQUETAS 3D =====

          const ctx = canvas.getContext('2d');
          canvas.width = 512;
          canvas.height = 128;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.shadowBlur = 0;
          ctx.fillStyle = 'rgba(0,0,0,0.65)';
          const pad = 30;
          ctx.font = `bold ${fontSize}px 'Plus Jakarta Sans', sans-serif`;
          const metrics = ctx.measureText(text);
          const textWidth = metrics.width || 200;
          const w = Math.min(textWidth + pad * 2, canvas.width);
          const h = 70;
          const x = (canvas.width - w) / 2;
          const y = (canvas.height - h) / 2;
          ctx.beginPath();
          ctx.roundRect(x, y, w, h, 16);
          ctx.fill();
          ctx.strokeStyle = color;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.roundRect(x, y, w, h, 16);
          ctx.stroke();
          ctx.shadowColor = 'rgba(0,0,0,0.95)';
          ctx.shadowBlur = 12;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = color;
          ctx.fillText(text, canvas.width/2, canvas.height/2);
          const texture = new THREE.CanvasTexture(canvas);
          texture.needsUpdate = true;
          const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false, depthWrite: false });
          const sprite = new THREE.Sprite(material);
          // Guardamos la escala base para poder ampliar después
          sprite.userData.baseScale = new THREE.Vector3(scaleX, scaleY, 1);
          sprite.scale.set(scaleX, scaleY, 1);
          sprite.renderOrder = 0;
          sprite.userData.isLabel = true;
          return sprite;
        }

        const labelGroup = new THREE.Group();
        scene.add(labelGroup);
        labelGroupRef.current = labelGroup;

        function addLabel(text, pos, color = '#ffffff', fontSize = 18, scaleX = 4.5, scaleY = 1.1) {
          const sprite = createLabelSprite(text, color, fontSize, scaleX, scaleY);
          sprite.position.copy(pos);
          sprite.position.y += 2.0;
          labelGroup.add(sprite);
          return sprite;
        }

        phasePositions.forEach((p) => {
          const labelText = `${t.label_phase || 'Fase'} ${p.id}`;
          const pos = new THREE.Vector3(p.x, p.y + 1.5, p.z);
          addLabel(labelText, pos, '#4fc3f7', 18, 4.5, 1.1);
        });

        princPositions.forEach((p) => {
          const labelText = t[p.labelKey] || p.labelKey;
          const pos = new THREE.Vector3(p.x, p.y + 1.5, p.z);
          addLabel(labelText, pos, '#ffffff', 18, 4.2, 1.0);
        });

        tierPositions.forEach((tp, idx) => {
          const tier = tiers[idx];
          let labelText = tier ? (t[tier.id] || tier.title?.es || 'Nivel') : 'Nivel';
          const pos = new THREE.Vector3(0, tp.y + 1.5, 0);
          addLabel(labelText, pos, '#ffffff', 16, 4.0, 0.95);
        });

        vData.forEach((v) => {
          const labelText = t[v.labelKey] || v.labelKey;
          const pos = v.pos.clone();
          pos.y += 1.5;
          addLabel(labelText, pos, '#ffffff', 20, 4.8, 1.2);
        });

        const centerPos = new THREE.Vector3(0, 2.8, 0);
        addLabel(t.label_snapi || 'SNAPI', centerPos, '#00e5ff', 28, 6.0, 1.4);

        // ===== INTERACCIÓN =====
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const onPointerDown = (e) => { isMouseDown.current = true; mousePrev.current = { x: e.clientX, y: e.clientY }; };
        const onPointerMove = (e) => {
          if (!isMouseDown.current) return;
          spherical.current.theta -= (e.clientX - mousePrev.current.x) * 0.006;
          spherical.current.phi = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, spherical.current.phi - (e.clientY - mousePrev.current.y) * 0.006));
          mousePrev.current = { x: e.clientX, y: e.clientY };
        };
        const onPointerUp = () => { isMouseDown.current = false; };
        const onWheel = (e) => {
          e.preventDefault();
          spherical.current.radius = Math.max(2, Math.min(80, spherical.current.radius + e.deltaY * 0.04));
          setZoomLevel(Math.round(spherical.current.radius));
          if (onZoomChange) onZoomChange(Math.round(spherical.current.radius));
        };
        const onClick = (e) => {
          const rect = renderer.domElement.getBoundingClientRect();
          mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          const hits = raycaster.intersectObjects(scene.children, true);
          if (hits.length > 0) {
            for (const hit of hits) {
              let cur = hit.object;
              while (cur && cur !== scene) {
                if (cur.userData && cur.userData.isLabel) {
                  // Alternar tamaño de todas las etiquetas
                  toggleLabels();
                  return;
                }
                if (cur.userData && cur.userData.isPhase && cur.userData.phaseId) {
                  onSelectPhase(cur.userData.phaseId);
                  return;
                }
                if (cur.userData && cur.userData.isTriangle) {
                  onSelectTriangle(cur.userData.vertexKey);
                  return;
                }
                if (cur.userData && cur.userData.isPrinciple) {
                  onSelectPrinciple(cur.userData.principleId);
                  return;
                }
                if (cur.userData && cur.userData.isTier) {
                  onSelectTier(cur.userData.tierId);
                  return;
                }
                cur = cur.parent;
              }
            }
          }
        };

        const dom = renderer.domElement;
        dom.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        dom.addEventListener('wheel', onWheel, { passive: false });
        dom.addEventListener('click', onClick);

        // ===== ANIMACIÓN CON ZOOM MEJORADO =====
        let frameId;
        let clock = new THREE.Clock();
        const animate = () => {
          frameId = requestAnimationFrame(animate);
          const t = clock.getElapsedTime();

          triGroup.rotation.y = t * 0.12;
          instGroup.rotation.y = t * 0.05;

          // Ondas de banderas
          if (nicFlagGeoRef.current) {
            const pos = nicFlagGeoRef.current.attributes.position;
            for (let i = 0; i < pos.count; i++) {
              const vx = pos.getX(i);
              const vy = pos.getY(i);
              const factor = Math.pow(Math.min(1, Math.max(0, vx / 5.0)), 1.2);
              pos.setZ(i, (Math.sin(vx * 3 - t * 5) * 0.3 + Math.sin(vy * 2 + t * 3) * 0.15) * factor);
            }
            pos.needsUpdate = true;
            nicFlagGeoRef.current.computeVertexNormals();
          }
          if (fslnFlagGeoRef.current) {
            const pos = fslnFlagGeoRef.current.attributes.position;
            for (let i = 0; i < pos.count; i++) {
              const vx = pos.getX(i);
              const vy = pos.getY(i);
              const factor = Math.pow(Math.min(1, Math.max(0, vx / 5.0)), 1.2);
              pos.setZ(i, (Math.sin(vx * 3 - t * 5 + 0.5) * 0.3 + Math.sin(vy * 2 + t * 3 + 0.3) * 0.15) * factor);
            }
            pos.needsUpdate = true;
            fslnFlagGeoRef.current.computeVertexNormals();
          }

          const currentMode = modeRef.current;
          const currentView = viewRef.current;
          const currentSimType = simTypeRef.current;

          // Simulaciones diferenciadas (igual que antes)
          if (currentSimType === 'mode_standby') {
            princMeshes.forEach(m => { m.material.emissiveIntensity = 0.2; });
            phaseMeshes.forEach(m => { m.scale.setScalar(1.0); });
            aiNodesMeshes.forEach(n => { n.material.emissiveIntensity = 0.3; });
            particles.material.opacity = 0.2;
            scene.background = new THREE.Color(0x05080c);
          } else {
            particles.material.opacity = 0.7;
            if (currentSimType === 'mode_analysis' || currentMode === 'analysis') {
              princMeshes.forEach((m, idx) => {
                m.material.emissiveIntensity = 1.2 + Math.sin(t * 2 + idx) * 0.4;
              });
            } else {
              princMeshes.forEach(m => { m.material.emissiveIntensity = 0.8; });
            }

            if (currentSimType === 'mode_scaling' || currentMode === 'scaling') {
              phaseMeshes.forEach((m, idx) => {
                const scale = 1.0 + 0.4 * Math.sin(t * 1.5 + idx * 1.2);
                m.scale.setScalar(scale);
              });
            } else {
              phaseMeshes.forEach((m, idx) => {
                const isAct = idx + 1 === activePhaseId;
                m.scale.setScalar(isAct ? 1.3 + Math.sin(t * 3) * 0.05 : 1.0);
              });
            }

            const particleSpeed = (currentSimType === 'mode_operation' || currentMode === 'operation') ? 0.12 : 0.025;
            if (currentSimType === 'mode_ai' || currentMode === 'ai') {
              aiNodesMeshes.forEach((n, i) => {
                n.material.emissiveIntensity = 0.5 + 0.5 * Math.sin(t * 3 + i);
              });
              aiConnections.forEach((line, i) => {
                line.material.opacity = 0.3 + 0.3 * Math.sin(t * 2 + i);
              });
            } else {
              aiNodesMeshes.forEach(n => { n.material.emissiveIntensity = 0.9; });
              aiConnections.forEach(line => { line.material.opacity = 0.2; });
            }

            if (currentSimType === 'mode_ar' || currentMode === 'ar') {
              scene.background = new THREE.Color(0x0a1a2a);
              labelGroup.children.forEach(sprite => {
                sprite.material.opacity = 1.0;
              });
            } else {
              scene.background = new THREE.Color(0x0a0d12);
              labelGroup.children.forEach(sprite => {
                sprite.material.opacity = 0.9;
              });
            }
          }

          // Partículas
          const pos = particles.geometry.attributes.position.array;
          const spdBase = (currentSimType === 'mode_operation' || currentMode === 'operation') ? 0.12 : 0.025;
          for (let i = 0; i < pCount; i++) {
            const spd = spdBase + (i % 5) * 0.002;
            const cx = pos[i * 3];
            const cz = pos[i * 3 + 2];
            const ang = Math.atan2(cz, cx) + spd;
            const rad = Math.sqrt(cx * cx + cz * cz);
            pos[i * 3] = Math.cos(ang) * rad;
            pos[i * 3 + 1] = 1.0 + Math.sin(t * 1.5 + i) * 0.5;
            pos[i * 3 + 2] = Math.sin(ang) * rad;
          }
          particles.geometry.attributes.position.needsUpdate = true;

          // Explosión
          const targetExplode = currentView === 'exploded' ? 1.0 : 0.0;
          explodedProgress.current = THREE.MathUtils.lerp(explodedProgress.current, targetExplode, 0.06);
          modulesGroup.children.forEach(c => {
            if (c.userData && c.userData.basePos && c.userData.dir) {
              c.position.copy(c.userData.basePos).add(c.userData.dir.clone().multiplyScalar(explodedProgress.current * 7));
            }
          });

          // Rayos X
          const isXray = currentView === 'xray';
          scene.traverse(obj => {
            if (obj.isMesh && obj.material && 'wireframe' in obj.material) {
              obj.material.wireframe = isXray;
            }
          });

          // Vistas especiales
          if (currentView === 'internal') {
            spherical.current.phi = Math.PI / 3;
            spherical.current.radius = 16;
          } else if (currentView === 'top') {
            spherical.current.phi = 0.05;
            spherical.current.radius = 38;
          } else if (currentView === 'orbit') {
            spherical.current.phi = Math.PI / 3;
            spherical.current.radius = 34;
          }

          if (currentView === 'autotour') {
            spherical.current.theta += 0.005;
          }

          // --- ZOOM MEJORADO: paso de 8 y límite mínimo de 2 ---
          const tx = spherical.current.radius * Math.sin(spherical.current.phi) * Math.sin(spherical.current.theta);
          const ty = spherical.current.radius * Math.cos(spherical.current.phi);
          const tz = spherical.current.radius * Math.sin(spherical.current.phi) * Math.cos(spherical.current.theta);
          camera.position.lerp(new THREE.Vector3(tx, Math.max(3, ty), tz), 0.25);
          currentLookAt.current.lerp(targetLookAt.current, 0.1);
          camera.lookAt(currentLookAt.current);

          setZoomLevel(Math.round(spherical.current.radius));
          if (onZoomChange) onZoomChange(Math.round(spherical.current.radius));

          renderer.render(scene, camera);
        };
        animate();

        const onResize = () => {
          const w = container.clientWidth;
          const h = container.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', onResize);

        window.__threeScene = {
          resetCamera: () => {
            spherical.current.radius = defaultSpherical.radius;
            spherical.current.theta = defaultSpherical.theta;
            spherical.current.phi = defaultSpherical.phi;
            setZoomLevel(defaultSpherical.radius);
            if (onZoomChange) onZoomChange(defaultSpherical.radius);
          },
          zoomIn: () => {
            spherical.current.radius = Math.max(2, spherical.current.radius - 8);
            setZoomLevel(Math.round(spherical.current.radius));
            if (onZoomChange) onZoomChange(Math.round(spherical.current.radius));
            // Forzar actualización inmediata
            const tx = spherical.current.radius * Math.sin(spherical.current.phi) * Math.sin(spherical.current.theta);
            const ty = spherical.current.radius * Math.cos(spherical.current.phi);
            const tz = spherical.current.radius * Math.sin(spherical.current.phi) * Math.cos(spherical.current.theta);
            camera.position.set(tx, Math.max(3, ty), tz);
            camera.lookAt(currentLookAt.current);
          },
          zoomOut: () => {
            spherical.current.radius = Math.min(80, spherical.current.radius + 8);
            setZoomLevel(Math.round(spherical.current.radius));
            if (onZoomChange) onZoomChange(Math.round(spherical.current.radius));
            const tx = spherical.current.radius * Math.sin(spherical.current.phi) * Math.sin(spherical.current.theta);
            const ty = spherical.current.radius * Math.cos(spherical.current.phi);
            const tz = spherical.current.radius * Math.sin(spherical.current.phi) * Math.cos(spherical.current.theta);
            camera.position.set(tx, Math.max(3, ty), tz);
            camera.lookAt(currentLookAt.current);
          },
          setZoom: (val) => {
            spherical.current.radius = Math.max(2, Math.min(80, val));
            setZoomLevel(Math.round(spherical.current.radius));
            if (onZoomChange) onZoomChange(Math.round(spherical.current.radius));
            const tx = spherical.current.radius * Math.sin(spherical.current.phi) * Math.sin(spherical.current.theta);
            const ty = spherical.current.radius * Math.cos(spherical.current.phi);
            const tz = spherical.current.radius * Math.sin(spherical.current.phi) * Math.cos(spherical.current.theta);
            camera.position.set(tx, Math.max(3, ty), tz);
            camera.lookAt(currentLookAt.current);
          }
        };

        return () => {
          cancelAnimationFrame(frameId);
          dom.removeEventListener('mousedown', onPointerDown);
          window.removeEventListener('mousemove', onPointerMove);
          window.removeEventListener('mouseup', onPointerUp);
          dom.removeEventListener('wheel', onWheel);
          dom.removeEventListener('click', onClick);
          window.removeEventListener('resize', onResize);
          renderer.dispose();
        };
      }, []);

      useEffect(() => {
        modeRef.current = mode;
        viewRef.current = viewMode;
        simTypeRef.current = simType;
      }, [mode, viewMode, simType]);

      return <div ref={mountRef} className="absolute inset-0 w-full h-full cursor-grab active:cursor-grabbing select-none overflow-hidden touch-none" />;
    }

    // ===== COMPONENTE PRINCIPAL =====
    function App() {
      const [language, setLanguage] = useState('es');
      const [mode, setMode] = useState('simulation');
      const [viewMode, setViewMode] = useState('orbit');
      const [activeDay, setActiveDay] = useState(1);
      const [isPlaying, setIsPlaying] = useState(true);
      const [speed, setSpeed] = useState(1);
      const [zoomLevel, setZoomLevel] = useState(34);

      const [selectedPhaseId, setSelectedPhaseId] = useState(null);
      const [showTriangle, setShowTriangle] = useState(false);
      const [showCalculator, setShowCalculator] = useState(false);
      const [showAINodes, setShowAINodes] = useState(false);
      const [showDoc, setShowDoc] = useState(false);
      const [showPrinciples, setShowPrinciples] = useState(false);
      const [selectedPrincipleId, setSelectedPrincipleId] = useState(null);
      const [showTiers, setShowTiers] = useState(false);
      const [selectedTierId, setSelectedTierId] = useState(null);
      const [showAR, setShowAR] = useState(false);

      const [simType, setSimType] = useState(null);
      const [simData, setSimData] = useState({
        inmediatez: 75,
        simplificacion: 82,
        resultados: 68,
        revenue: 120,
        principlesCompliance: [70, 80, 65, 75],
        tierResources: [40, 30, 20, 10, 5],
        aiConfidence: 94,
        chapterHighlight: 0,
        phaseKPI: { beneficiaries: 1250, incomeBoost: 20, povertyReduc: 12 }
      });
      const [activeSimLabel, setActiveSimLabel] = useState('');

      const [calcPresetId, setCalcPresetId] = useState(presets[0].id);
      const [calcMultiplier, setCalcMultiplier] = useState(1.0);
      const [calcReinvestRate, setCalcReinvestRate] = useState(25);
      const [aiApplicantScore, setAiApplicantScore] = useState(94.5);
      const [isAiEvaluating, setIsAiEvaluating] = useState(false);
      const [arScale, setArScale] = useState(1.0);
      const [arRotation, setArRotation] = useState(0);
      const [docSearch, setDocSearch] = useState('');

      const activePhaseId = activeDay <= 2 ? 1 : activeDay <= 4 ? 2 : activeDay <= 7 ? 3 : activeDay <= 15 ? 4 : 5;
      const t = translations[language] || translations.es;

      useEffect(() => {
        if (!isPlaying) return;
        const timer = setInterval(() => {
          setActiveDay(prev => {
            const next = prev + 0.08 * speed;
            if (next >= 30.9) {
              sound.playChime();
              return 1;
            }
            return next;
          });
        }, 50);
        return () => clearInterval(timer);
      }, [isPlaying, speed]);

      useEffect(() => {
        if (!simType) { setActiveSimLabel(''); return; }
        let interval;
        const updateSim = () => {
          switch (simType) {
            case 'triangle':
              setSimData(prev => ({ ...prev, inmediatez: 65 + Math.random() * 30, simplificacion: 70 + Math.random() * 25, resultados: 55 + Math.random() * 35 }));
              setActiveSimLabel('🔺 ' + (t.sim_triangle || 'Triángulo'));
              break;
            case 'principles':
              setSimData(prev => ({ ...prev, principlesCompliance: prev.principlesCompliance.map(v => Math.min(100, Math.max(40, v + (Math.random() - 0.5) * 10))) }));
              setActiveSimLabel('★ ' + (t.sim_principles || 'Principios'));
              break;
            case 'tiers':
              setSimData(prev => ({ ...prev, tierResources: prev.tierResources.map(v => Math.min(50, Math.max(5, v + (Math.random() - 0.5) * 6))) }));
              setActiveSimLabel('🏛 ' + (t.sim_tiers || 'Alcance'));
              break;
            case 'calculator':
              setSimData(prev => ({ ...prev, revenue: Math.max(50, prev.revenue + (Math.random() - 0.3) * 20) }));
              setActiveSimLabel('$ ' + (t.sim_calculator || 'Calculadora'));
              break;
            case 'ai':
              setSimData(prev => ({ ...prev, aiConfidence: Math.min(99, Math.max(80, prev.aiConfidence + (Math.random() - 0.5) * 4)) }));
              setActiveSimLabel('⚙ ' + (t.sim_ai || 'Red IA'));
              break;
            case 'doc':
              setSimData(prev => ({ ...prev, chapterHighlight: (prev.chapterHighlight + 1) % chapters.length }));
              setActiveSimLabel('📖 ' + (t.sim_doc || 'Documento'));
              break;
            case 'phase':
              setSimData(prev => ({ ...prev, phaseKPI: { beneficiaries: Math.floor(1200 + Math.random() * 300), incomeBoost: (15 + Math.random() * 25).toFixed(1), povertyReduc: (8 + Math.random() * 20).toFixed(1) } }));
              setActiveSimLabel('📌 ' + (t.sim_phase || 'Fase'));
              break;
            case 'mode_analysis': setActiveSimLabel('🔍 ' + (t.sim_mode_analysis || 'Análisis')); break;
            case 'mode_scaling': setActiveSimLabel('📈 ' + (t.sim_mode_scaling || 'Escalamiento')); break;
            case 'mode_operation': setActiveSimLabel('⚡ ' + (t.sim_mode_operation || 'Operación')); break;
            case 'mode_ai': setActiveSimLabel('🧠 ' + (t.sim_mode_ai || 'Red IA')); break;
            case 'mode_ar': setActiveSimLabel('📷 ' + (t.sim_mode_ar || 'AR')); break;
            case 'mode_standby': setActiveSimLabel('⏸ ' + (t.sim_mode_standby || 'Standby')); break;
            case 'mode_simulation': setActiveSimLabel('▶ ' + (t.sim_mode_simulation || 'Simulación')); break;
            case 'view_orbit': setActiveSimLabel('🔄 ' + (t.sim_view_orbit || 'Orbital')); break;
            case 'view_exploded': setActiveSimLabel('💥 ' + (t.sim_view_exploded || 'Explotada')); break;
            case 'view_xray': setActiveSimLabel('☢ ' + (t.sim_view_xray || 'Rayos X')); break;
            case 'view_internal': setActiveSimLabel('🔬 ' + (t.sim_view_internal || 'Corte')); break;
            case 'view_autotour': setActiveSimLabel('🎬 ' + (t.sim_view_autotour || 'Auto Tour')); break;
            case 'view_top': setActiveSimLabel('⬇ ' + (t.sim_view_top || 'Cenital')); break;
            default: setActiveSimLabel('');
          }
        };
        interval = setInterval(updateSim, 1200);
        return () => clearInterval(interval);
      }, [simType, t]);

      const triggerSim = (type) => {
        setSimType(null);
        setTimeout(() => setSimType(type), 50);
      };

      const closeModal = (setter) => {
        setter(false);
        setSimType(null);
      };

      const handleReset = () => {
        setMode('simulation');
        setViewMode('orbit');
        setActiveDay(1);
        setIsPlaying(true);
        setSimType(null);
        setSimData({
          inmediatez: 75,
          simplificacion: 82,
          resultados: 68,
          revenue: 120,
          principlesCompliance: [70, 80, 65, 75],
          tierResources: [40, 30, 20, 10, 5],
          aiConfidence: 94,
          chapterHighlight: 0,
          phaseKPI: { beneficiaries: 1250, incomeBoost: 20, povertyReduc: 12 }
        });
        if (window.__threeScene) window.__threeScene.resetCamera();
        setZoomLevel(34);
      };

      // Nueva función toggleZoom (alterna entre cerca y lejos)
      const toggleZoom = () => {
        if (window.__threeScene) {
          const current = zoomLevel;
          // Si el zoom es menor que 20, lo alejamos a 50; si es mayor o igual, lo acercamos a 8
          const target = current < 20 ? 50 : 8;
          window.__threeScene.setZoom(target);
          // El estado se actualizará vía onZoomChange, pero forzamos la actualización visual
          setZoomLevel(target);
        }
      };

      const activePreset = presets.find(p => p.id === calcPresetId) || presets[0];
      const effectiveCost = Math.round(activePreset.initialCostUsd * calcMultiplier);
      const effectiveWeeklyRev = Math.round(activePreset.weeklyRevenueUsd * calcMultiplier);
      const monthlyRev = effectiveWeeklyRev * 4;
      const monthlyProfit = Math.round(monthlyRev * (activePreset.marginPercent / 100));
      const monthlyReinvest = Math.round(monthlyProfit * (calcReinvestRate / 100));
      const familyTakeHome = monthlyProfit - monthlyReinvest;
      const basketCoverage = Math.min(100, Math.round((familyTakeHome / 280) * 100));
      const phaseKPIs = simData.phaseKPI;

      return (
        <div className="relative w-screen h-screen overflow-hidden bg-slate-950 text-slate-100">
          <ThreeScene
            mode={mode}
            viewMode={viewMode}
            activeDay={activeDay}
            activePhaseId={activePhaseId}
            onSelectPhase={(id) => { setSelectedPhaseId(id); triggerSim('phase'); setMode('simulation'); }}
            onSelectTriangle={() => { setShowTriangle(true); triggerSim('triangle'); setMode('analysis'); }}
            onSelectPrinciple={(id) => { setSelectedPrincipleId(id); setShowPrinciples(true); triggerSim('principles'); setMode('analysis'); }}
            onSelectTier={(id) => { setSelectedTierId(id); setShowTiers(true); triggerSim('tiers'); setMode('operation'); }}
            language={language}
            onZoomChange={(level) => setZoomLevel(level)}
            simType={simType}
          />

          {/* El indicador de zoom ha sido eliminado */}

          <div className="pointer-events-none absolute inset-0 z-10 flex flex-col justify-between p-3">
            <div className="flex flex-wrap items-start justify-between gap-2 pointer-events-auto">
              <div className="bg-slate-900/80 backdrop-blur-xl border border-cyan-500/30 rounded-lg px-3 py-2 shadow-lg max-w-xs">
                <div className="flex items-center gap-2">
                  <div className="flex items-center gap-1 shrink-0">
                    <div className="w-5 h-3.5 rounded-xs overflow-hidden border border-blue-400/50 flex flex-col shadow-sm">
                      <div className="h-1/3 bg-[#0055A5]" /><div className="h-1/3 bg-white flex items-center justify-center"><div className="w-1 h-1 rounded-full bg-amber-400" /></div><div className="h-1/3 bg-[#0055A5]" />
                    </div>
                    <div className="w-5 h-3.5 rounded-xs overflow-hidden border border-red-500/50 flex flex-col shadow-sm relative">
                      <div className="h-1/2 bg-[#D50000]" /><div className="h-1/2 bg-[#111111]" /><span className="absolute inset-0 flex items-center justify-center text-[4px] font-black text-white">FSLN</span>
                    </div>
                  </div>

                <div className="flex justify-between pb-3 border-b border-slate-800">
                  <div>
                    <h3 className="text-lg font-bold text-purple-400">{t.modal_ai_title}</h3>
                    <p className="text-xs text-slate-400">{t.modal_ai_sub}</p>
                  </div>
                  <button onClick={() => closeModal(setShowAINodes)} className="p-1.5 rounded-lg bg-slate-800 text-slate-300">{t.btn_close}</button>
                </div>
                <div className="mt-4 p-4 bg-slate-950/60 rounded-xl border border-slate-800">
                  <span className="text-slate-400 text-xs block">{t.lbl_ai_confidence}</span>
                  <strong className="text-3xl font-mono text-cyan-300">{simData.aiConfidence.toFixed(1)} / 100</strong>
                  <div className="mt-2 h-3 w-full bg-slate-800 rounded-full overflow-hidden">
                    <div className="h-full bg-purple-400 transition-all duration-700" style={{ width: simData.aiConfidence + '%' }}></div>
                  </div>
                  <button onClick={() => { setIsAiEvaluating(true); setTimeout(() => { setAiApplicantScore(Number((89 + Math.random() * 10).toFixed(1))); setIsAiEvaluating(false); sound.playChime(); }, 700); }} className="mt-3 px-4 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs shadow-md transition-colors">
                    {isAiEvaluating ? t.ai_evaluating : t.ai_evaluate}
                  </button>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4 text-xs">
                  {aiNodes.map(n => (
                    <div key={n.id} className="bg-slate-950/70 border border-slate-800 rounded-xl p-3">
                      <div className="flex justify-between items-center mb-1">
                        <strong className="text-slate-100 font-bold">{n.label[language]}</strong>
                        <span className="text-[10px] font-mono text-purple-400 uppercase">{n.layer}</span>
                      </div>
                      <p className="text-slate-400 text-[11px]">{n.description[language]}</p>
                      <div className="mt-2 text-[10px] font-mono text-emerald-400">Confianza: {(n.confidence * 100).toFixed(0)}%</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Modal Documento */}
          {showDoc && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md">
              <div className="w-full max-w-4xl bg-slate-900 border border-blue-500/40 rounded-2xl p-6 shadow-2xl text-slate-100 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between pb-3 border-b border-slate-800">
                  <div>
                    <h3 className="text-lg font-bold text-blue-400">{t.modal_doc_title}</h3>
                    <div className="text-xs text-slate-400">{t.modal_doc_sub}</div>
                  </div>
                  <button onClick={() => closeModal(setShowDoc)} className="p-1.5 rounded-lg bg-slate-800 text-slate-300">{t.btn_close}</button>
                </div>
                <div className="mt-3">
                  <input type="text" placeholder={t.lbl_search_placeholder} value={docSearch} onChange={e => setDocSearch(e.target.value)} className="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-hidden focus:border-blue-400" />
                </div>
                <div className="space-y-3 mt-4 text-xs">
                  {chapters.map((c, idx) => (
                    <div key={c.num} className={`bg-slate-950/70 border rounded-xl p-4 transition-all ${idx === simData.chapterHighlight ? 'border-blue-400 bg-blue-950/40' : 'border-slate-800'}`}>
                      <div className="flex justify-between items-center mb-1">
                        <strong className="text-slate-100 font-bold text-sm">Cap. {c.num}: {c.title}</strong>
                        <span className="text-[10px] font-mono text-emerald-400">{t.lbl_doc_official}</span>
                      </div>
                      <p className="text-slate-300 text-xs">{c.summary}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Modal AR */}
          {showAR && (
            <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-lg flex flex-col justify-between p-4">
              <div className="flex justify-between items-center">
                <span className="px-3 py-1 rounded-lg bg-emerald-950 border border-emerald-500/40 text-emerald-300 text-xs font-mono font-bold">{t.lbl_ar_simulator}</span>
                <button onClick={() => closeModal(setShowAR)} className="p-2 rounded-lg bg-slate-800 text-slate-300">{t.btn_close}</button>
              </div>
              <div className="self-center flex flex-col items-center justify-center pointer-events-none" style={{ transform: `scale(${arScale}) rotate(${arRotation}deg)` }}>
                <div className="w-64 h-64 rounded-full border-2 border-cyan-400/60 bg-cyan-950/20 flex flex-col items-center justify-center shadow-[0_0_50px_rgba(0,229,255,0.4)] animate-pulse-slow">
                  <div className="text-xs font-mono font-bold text-cyan-300">{t.lbl_ar_hologram}</div>
                  <div className="text-base font-black text-white mt-1">NICARAGUA • FSLN</div>
                  <div className="text-[10px] text-emerald-400 font-mono mt-1">{t.lbl_ar_active}</div>
                </div>
              </div>
              <div className="self-center w-full max-w-md bg-slate-900/90 border border-cyan-500/40 p-4 rounded-xl flex gap-4 text-xs">
                <div className="flex-1">
                  <label className="block text-slate-400 mb-1">{t.lbl_ar_scale} {arScale}x</label>
                  <input type="range" min="0.6" max="2.0" step="0.1" value={arScale} onChange={e => setArScale(parseFloat(e.target.value))} className="w-full accent-cyan-400" />
                </div>
                <div className="flex-1">
                  <label className="block text-slate-400 mb-1">{t.lbl_ar_rotation} {arRotation}°</label>
                  <input type="range" min="0" max="360" step="5" value={arRotation} onChange={e => setArRotation(parseInt(e.target.value))} className="w-full accent-emerald-400" />
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Función auxiliar para manejar el slider de zoom desde el componente padre
    function handleZoomSlider(val) {
      if (window.__threeScene) {
        window.__threeScene.setZoom(parseFloat(val));
      }
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
