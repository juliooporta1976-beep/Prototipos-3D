<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>FarmaBusca</title>
<!-- Fonts: offline fallback, no remote references -->
<style>
@font-face{font-family:'Atkinson Hyperlegible';src:local('Atkinson Hyperlegible'),local('AtkinsonHyperlegible');font-display:swap;font-weight:400 700}

:root{--bg:#f3f8f7;--ink:#10262b;--mut:#4c666b;--card:#fff;--line:#cfe0de;--acc:#0b6e6e;--acc2:#e8f3f1;--warn:#8a5a00;--warnbg:#fff4d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b1e;--ink:#e6f2f1;--mut:#9bb5b8;--card:#14282c;--line:#27424a;--acc:#4fc3bd;--acc2:#16343a;--warn:#ffd27a;--warnbg:#3a2f12}}
:root[data-theme="dark"]{--bg:#0d1b1e;--ink:#e6f2f1;--mut:#9bb5b8;--card:#14282c;--line:#27424a;--acc:#4fc3bd;--acc2:#16343a;--warn:#ffd27a;--warnbg:#3a2f12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,Arial,sans-serif}
.w{max-width:860px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:22px;color:var(--acc)}
select,input,button{font:inherit;color:var(--ink)}
select,input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1{font-size:clamp(26px,5vw,38px);line-height:1.15;margin:24px 0 8px;max-width:20ch}
.sub{color:var(--mut);max-width:60ch;margin:0 0 18px}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
#payForm .grid{grid-template-columns:1fr 1fr}
#pf_result{line-height:1.5;font-size:0.95em}
label{display:block;font-weight:700;font-size:15px;margin-bottom:4px}
.btn{background:var(--acc);color:var(--bg);border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.note{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:15px}
.res{display:grid;grid-template-columns:1fr auto;gap:8px 16px;border-top:1px solid var(--line);padding:14px 0}
.res:first-child{border-top:0}
.price{font-size:24px;font-weight:700;color:var(--acc);text-align:right}
.tag{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:99px;padding:1px 10px;font-size:14px;margin-right:6px}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.acts a{color:var(--acc);font-weight:700;border:1.5px solid var(--line);border-radius:8px;padding:6px 12px;text-decoration:none}
.small{font-size:14px;color:var(--mut)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.plans div{border:1.5px solid var(--line);border-radius:10px;padding:14px}
.plans b{font-size:20px}
.lock{border:2px dashed var(--acc);border-radius:12px;padding:16px}.lock p{margin:8px 0}textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);font:inherit;color:var(--ink)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}.stats div{background:var(--acc2);border-radius:8px;padding:8px 12px;font-size:15px}.stats b{display:block;font-size:18px;color:var(--acc)}
footer{padding:20px 0 40px;color:var(--mut);font-size:14px}
.upd-badge{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:99px;padding:2px 12px;font-size:13px;font-weight:700;margin-top:8px}
.upd-timer{display:flex;align-items:center;gap:6px;background:var(--acc2);color:var(--acc);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:700;margin-top:10px;flex-wrap:wrap}
.upd-timer .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pulse-dot 1.5s infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
.upd-timer .seg{display:inline-flex;align-items:center;gap:2px}
</style>
</head>
<body>
<div class="w">
<header><span class="logo">FarmaBusca</span>
<div style="width:160px"><select id="lang" aria-label="Language"><option value="es">Español</option><option value="en">English</option><option value="pt">Português</option><option value="fr">Français</option><option value="it">Italiano</option><option value="de">Deutsch</option><option value="zh">中文</option></select></div></header>

<h1 id="t_h1"></h1>
<p class="sub" id="t_sub"></p>

<div class="panel">
<div class="grid">
<div><label for="q" id="t_q"></label><input id="q" list="sug" placeholder="Ibuprofeno, andador, muletas…"><datalist id="sug"></datalist></div>
<div><label for="cat" id="t_cat"></label><select id="cat"></select></div>
<div><label for="ver" id="t_ver"></label><select id="ver"></select></div>
<div><label for="co" id="t_co"></label><select id="co"></select></div>
<div><label for="rg" id="t_rg"></label><input id="rg" maxlength="60"></div>
<div><label for="city" id="t_city"></label><input id="city" maxlength="60"></div>
<div><label for="srt" id="t_srt"></label><select id="srt"><option value="p"></option><option value="d"></option><option value="n"></option></select></div>
</div>
<p style="margin:14px 0 0"><button class="btn" id="go"></button></p>
</div>

<div class="note" id="t_demo"></div>
<div class="panel" style="margin-top:18px"><div id="out"></div></div>

<div class="panel" id="reqp">
<h2 id="t_req" style="margin-top:0"></h2><p class="small" id="t_reqd"></p>
<div class="grid">
<div><label for="rq_n" id="l_rqn"></label><input id="rq_n" maxlength="100"></div>
<div><label for="rq_k" id="l_rqk"></label><select id="rq_k"><option value="med"></option><option value="ort"></option></select></div>
<div><label for="rq_c" id="l_rqc"></label><select id="rq_c"></select></div>
</div>
<div style="margin-top:12px"><label for="rq_d" id="l_rqd"></label><textarea id="rq_d" rows="2" maxlength="500"></textarea></div>
<p style="margin:14px 0 0"><button class="btn alt" id="rqb" type="button"></button> <span id="rqm" class="small" role="status"></span></p>
</div>
<div class="panel">
<h2 id="t_rep" style="margin-top:0"></h2>
<p class="small" id="t_repd"></p>
<form id="rf" onsubmit="return false">
<div class="grid">
<div><label for="r_p" id="l_p"></label><input id="r_p" required maxlength="80"></div>
<div><label for="r_n" id="l_n"></label><input id="r_n" required maxlength="80"></div>
<div><label for="r_a" id="l_a"></label><input id="r_a" required maxlength="120"></div>
<div><label for="r_t" id="l_t"></label><input id="r_t" inputmode="tel" maxlength="30"></div>
<div><label for="r_co" id="l_co"></label><select id="r_co" required></select></div>
<div><label for="r_rg" id="l_rg"></label><input id="r_rg" maxlength="60"></div>
<div><label for="r_c" id="l_c"></label><input id="r_c" required maxlength="60"></div>
<div><label for="r_pr" id="l_pr"></label><input id="r_pr" type="number" min="0.01" step="0.01" required></div>
<div><label for="r_cur" id="l_cur"></label><select id="r_cur"></select></div>
</div>
<p style="margin:14px 0 0"><button class="btn alt" id="rb"></button> <span id="rmsg" class="small" role="status"></span></p>
</form>
</div>

<div class="panel" id="updP"><h2 id="t_updh" style="margin-top:0"></h2><p id="t_updD" class="small"></p><div id="updTimer" class="upd-timer"></div>
<p class="small" id="netStatus" style="margin:10px 0 0"></p>
<p style="margin:10px 0 0"><button class="btn alt" id="chk_btn" type="button"></button> <span id="chk_msg" class="small" role="status"></span></p></div>
<div class="panel" id="pay"><h2 id="t_price" style="margin-top:0"></h2><p id="t_p1"></p></div>
<div class="panel" id="wu"><h2 id="t_wuh" style="margin-top:0"></h2><div id="wut"></div>
<div id="payForm" style="margin-top:14px">
<div class="grid">
<div><label for="pf_ref" id="l_pf_ref"></label><input id="pf_ref" maxlength="30" placeholder=""><span class="small" id="pf_refHint"></span></div>
<div><label for="pf_email" id="l_pf_email"></label><input id="pf_email" type="email" maxlength="80" placeholder=""></div>
</div>
<p style="margin:10px 0 0"><button class="btn" id="pf_go" type="button"></button> <span id="pf_msg" class="small" role="status"></span></p>
<div id="pf_result" style="display:none;margin-top:12px;padding:12px;border-radius:8px"></div>
<p style="margin:10px 0 0"><a href="#recP" id="pf_recLink" class="small" style="color:var(--acc)"></a></p>
</div></div>
<div class="panel" id="recP"><h2 id="t_recH" style="margin-top:0"></h2><p class="small" id="t_recD"></p>
<div class="grid"><div><label for="rec_em" id="l_rec_em"></label><input id="rec_em" type="email" maxlength="80"></div></div>
<p style="margin:10px 0 0"><button class="btn alt" id="rec_go" type="button"></button> <span id="rec_msg" class="small" role="status"></span></p>
<div id="rec_result" style="display:none;margin-top:12px;padding:12px;border-radius:8px;background:var(--acc2);color:var(--acc);border:1.5px solid var(--acc)"></div></div>

<div class="panel" id="admP"><h2 id="t_admH" style="margin-top:0"></h2>
<p class="small" id="t_impD"></p>
<p style="margin:8px 0"><button class="btn alt" id="imp_btn" type="button"></button> <span id="imp_msg" class="small" role="status"></span></p>
<input type="file" id="imp_file" accept=".json" style="display:none">
<p class="small" id="t_expD" style="margin-top:14px"></p>
<p style="margin:8px 0"><button class="btn alt" id="exp_btn" type="button"></button> <span id="exp_msg" class="small" role="status"></span></p>
<p class="small" id="t_verD" style="margin-top:12px"></p></div>

<div class="panel" id="statsP"><h2 id="t_statsH" style="margin-top:0"></h2><div id="statsGrid" class="stats" style="margin:0"></div></div>

<div class="panel"><h2 id="t_fbh" style="margin-top:0"></h2><textarea id="fb" rows="3" maxlength="1000"></textarea><p style="margin:10px 0 0"><button class="btn alt" id="fbs" type="button"></button></p></div>
<div class="panel">
<h2 id="t_pl" style="margin-top:0"></h2>
<div class="plans" id="plans"></div>
</div>
<footer id="t_foot"></footer>
</div>

let searched=false;function run(){searched=true;search()}function refresh(){if(searched)search()}

 if(more!==true)shown=20;
 if(!more)trackEvent("search");
 const t=T[L],lab=X[L],mm=M[L],q=$("q").value.trim().toLowerCase(),c=$("cat").value,v=$("ver").value,co=$("co").value,rg=$("rg").value.trim().toLowerCase(),ci=$("city").value.trim().toLowerCase();

 if(CFG.paywall&&!unlocked()){lockView(r.length);return}
 const fmt=n=>Number(n).toLocaleString(L,{minimumFractionDigits:2,maximumFractionDigits:2}),avg=a=>a.reduce((x,y)=>x+y,0)/a.length;

 if(r.length>1&&new Set(r.map(x=>x[8])).size===1){

const localMode=()=>CFG.api.includes("TU-WORKER");
async function chk(k){if(!k)return false;if(localMode()){const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(k));return CFG.hashes.includes([...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join(""))}

function autoActivate(){const p=P[L],ref=$("pf_ref").value.trim(),em=$("pf_email").value.trim(),msg=$("pf_msg"),res=$("pf_result");if(!ref||!REF_PATTERN.test(ref)){msg.textContent=p.pf_bad;return}if(!em||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){msg.textContent=p.pf_bad;return}try{const used=JSON.parse(localStorage.getItem("fb_refs")||"[]");if(used.includes(ref)){msg.textContent=p.pf_dup;return}used.push(ref);localStorage.setItem("fb_refs",JSON.stringify(used.slice(-200)))}catch(e){}const code="FB-"+ref.replace(/\s+/g,"").toUpperCase().slice(0,8)+"-"+Math.random().toString(36).slice(2,6).toUpperCase();try{localStorage.setItem("fb_pass",String(Date.now()+2592e6));localStorage.setItem("fb_code",code);const emList=JSON.parse(localStorage.getItem("fb_emails")||"[]");if(!emList.find(x=>x.e===em)){emList.push({e:em,c:code,t:Date.now()});localStorage.setItem("fb_emails",JSON.stringify(emList.slice(-50)))}}catch(e){}msg.textContent="";res.style.display="block";res.style.background="#1a3a2a";res.style.color="#4ade80";res.style.border="1px solid #22c55e";res.innerHTML=p.pf_ok.replace("{0}",esc(code));$("pf_ref").value="";$("pf_email").value="";trackEvent("activate");search();setTimeout(()=>{res.scrollIntoView({behavior:"smooth",block:"center"})},200)}

function recoverCode(){const p=P[L],em=$("rec_em").value.trim(),msg=$("rec_msg"),res=$("rec_result");if(!em||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){msg.textContent=p.pf_bad;return}try{const emList=JSON.parse(localStorage.getItem("fb_emails")||"[]");const found=emList.find(x=>x.e===em);if(found){msg.textContent="";res.style.display="block";res.innerHTML="<b>"+esc(p.recOk)+esc(found.c)+"</b>"}else{msg.textContent=p.recNo;res.style.display="none"}}catch(e){msg.textContent=p.recNo;res.style.display="none"}}

function importData(file){const p=P[L],msg=$("imp_msg");if(!file){return}const reader=new FileReader();reader.onload=e=>{try{const data=JSON.parse(e.target.result);const list=Array.isArray(data)?data:(data.records||[]);if(!Array.isArray(list)){msg.textContent="Invalid format";return}const valid=list.filter(r=>Array.isArray(r)&&r.length>=8&&typeof r[7]==="number").map(normRec);if(!valid.length){msg.textContent="No valid records found";return}const m=mine();const existSet=new Set(m.map(r=>(r[0]+"|"+r[3]+"|"+r[7]).toLowerCase()));let added=0;valid.forEach(r=>{const key=(r[0]+"|"+r[3]+"|"+r[7]).toLowerCase();if(!existSet.has(key)){m.push(r);existSet.add(key);added++}});localStorage_set("fb_reports",JSON.stringify(m.slice(-500)));msg.textContent=p.impOk.replace("{0}",added);trackEvent("import");refresh()}catch(err){msg.textContent="Error: "+err.message}};reader.readAsText(file)}

function exportData(){const p=P[L],msg=$("exp_msg");const data=all();const json=JSON.stringify({version:DATA_VERSION,exported:new Date().toISOString(),records:data},null,2);const blob=new Blob([json],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="FarmaBusca_data_"+DATA_VERSION+".json";a.click();URL.revokeObjectURL(url);msg.textContent=p.expOk;trackEvent("export")}

function trackEvent(type){try{const ev=JSON.parse(localStorage.getItem("fb_events")||"[]");ev.push({type:type,t:Date.now()});localStorage.setItem("fb_events",JSON.stringify(ev.slice(-500)))}catch(e){}}

function fillStats(){const p=P[L]||P.es;try{const ev=JSON.parse(localStorage.getItem("fb_events")||"[]");const searches=ev.filter(x=>x.type==="search").length;const reports=mine().length;const lastImp=ev.filter(x=>x.type==="import").slice(-1)[0];const lastUpd=lastImp?new Date(lastImp.t).toLocaleDateString(L):DATA_VERSION;$("statsGrid").innerHTML=`<div>${esc(p.statsS)}<b>${searches}</b></div><div>${esc(p.statsR)}<b>${reports}</b></div><div>${esc(p.statsU)}<b>${esc(lastUpd)}</b></div>`}catch(e){$("statsGrid").innerHTML=""}}
function lockView(n){const p=P[L],loc=[$("city").value.trim(),$("rg").value.trim(),$("co").value?cname($("co").value):""].filter(Boolean).join(", ");
 $("out").innerHTML=`<div class="lock"><b>${esc(p.lockh)}</b>${loc?`<p><b>${esc(loc)}</b></p>`:""}<p>${esc(p.found.replace("{0}",n))}</p><p>${esc(p.lockp2)}</p><a class="btn" style="display:inline-block;text-decoration:none" href="#wu">${esc(p.pf_go)}</a><p style="margin-top:12px">${esc(p.lockp)}</p><p style="margin-top:8px"><input id="cd" placeholder="${esc(p.code)}" aria-label="${esc(p.code)}" style="max-width:260px"> <button class="btn alt" id="ap" type="button">${esc(p.act)}</button></p></div>`;
 $("ap").onclick=async()=>{try{if(await chk($("cd").value.trim())){try{localStorage.setItem("fb_pass",String(Date.now()+2592e6))}catch(e){}search()}else alert(p.bad)}catch(e){alert(p.fail)}}}

let updInterval=null;
function startUpdTimer(lang){
  if(updInterval)clearInterval(updInterval);
  const cycle=3*24*60*60*1000;
  const base=new Date('2026-10-01T00:00:00Z').getTime();
  const pp=P[lang]||P.es;
  function render(){
    const el=Date.now()-base;
    const rem=Math.max(0,cycle-(el%cycle));
    const d=Math.floor(rem/(24*3600000));
    const h=Math.floor((rem%(24*3600000))/3600000);
    const m=Math.floor((rem%3600000)/60000);
    const s=Math.floor((rem%60000)/1000);
    const pad=n=>String(n).padStart(2,'0');
    const box=$("updTimer");if(!box)return;
    box.innerHTML='<span class="dot"></span> <span>'+esc(pp.updNext)+'</span> <span class="seg"><b>'+d+'</b> '+esc(pp.updDays)+'</span> <span class="seg"><b>'+pad(h)+'</b> '+esc(pp.updHrs)+'</span> <span class="seg"><b>'+pad(m)+'</b> '+esc(pp.updMin)+'</span> <span class="seg"><b>'+pad(s)+'</b> '+esc(pp.updSec)+'</span>';
  }
  render();
  updInterval=setInterval(render,1000);
}

/* ============================================================
   MOTOR DE AUTOACTUALIZACIÓN
   ============================================================ */
const NET=/^https?:$/.test(location.protocol);
let APP_VERSION="0";
try{const mv=document.querySelector('meta[name="app-version"]');if(mv)APP_VERSION=(mv.getAttribute("content")||"0").trim()}catch(e){}

function vcmp(a,b){
  const pa=String(a).split(/[.\-+_]/).map(n=>parseInt(n,10)||0);
  const pb=String(b).split(/[.\-+_]/).map(n=>parseInt(n,10)||0);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){
    const x=pa[i]||0,y=pb[i]||0;
    if(x!==y)return x>y?1:-1;
  }
  return 0;
}
function remoteMeta(){try{return JSON.parse(localStorage.getItem("fb_remote")||"null")||{}}catch(e){return{}}}
function remoteRecs(){const m=remoteMeta();return Array.isArray(m.records)?m.records:[]}
function dedupe(a){const s=new Set();return a.filter(r=>{const k=[r[0],r[3],r[4],r[7],r[8]].join("|").toLowerCase();if(s.has(k))return false;s.add(k);return true})}
function normRec(r){
  const x=r.slice(0,12);
  while(x.length<12)x.push("");
  x[7]=Number(x[7])||0;
  x[8]=x[8]||"USD";
  if(!x[9]&&META[x[6]])x[9]=META[x[6]][0];
  if(!x[10]&&META[x[6]])x[10]=META[x[6]][1];
  if(!x[11])x[11]=Date.now();
  return x;
}
function netLine(){
  const el=$("netStatus");if(!el)return;
  const u=U[L]||U.es,m=remoteMeta();
  const when=m.t?new Date(m.t).toLocaleString(L):u.never;
  el.textContent=u.last+when+(m.version?" · v"+m.version:"")+(remoteRecs().length?" · "+remoteRecs().length+" reg.":"");
}
function afterDataChange(){
  try{$("t_verD").textContent=(P[L]||P.es).verD+DATA_VERSION}catch(e){}
  try{$("sug").innerHTML=[...new Set(all().map(r=>r[0]))].map(n=>`<option value="${esc(n)}">`).join("")}catch(e){}
  try{fillStats()}catch(e){}
  try{if(searched)search(true)}catch(e){}
}
let syncing=false;
async function syncRemoteData(force){
  if(!NET)return "off";
  const u=CFG.dataUrl;
  if(!u||!/^https?:/i.test(u)||/TU-SERVIDOR|TU-WORKER/i.test(u))return "off";
  if(syncing)return "same";
  syncing=true;
  try{
    const url=u+(u.includes("?")?"&":"?")+"_="+Date.now();
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),12000);
    const res=await fetch(url,{cache:"no-store",signal:ctl.signal});
    clearTimeout(to);
    if(!res.ok)throw new Error("HTTP "+res.status);
    const j=await res.json();
    const list=Array.isArray(j)?j:(j.records||j.data||[]);
    const valid=(Array.isArray(list)?list:[]).filter(r=>Array.isArray(r)&&r.length>=8&&isFinite(Number(r[7]))).map(normRec);
    if(!valid.length)throw new Error("sin registros válidos");
    const ver=String(j&&j.version?j.version:DATA_VERSION);
    const prev=remoteMeta();
    if(!force&&prev.version===ver&&(prev.records||[]).length===valid.length){netLine();return "same"}
    localStorage_set("fb_remote",JSON.stringify({version:ver,records:valid,t:Date.now()}));
    DATA_VERSION=ver;
    afterDataChange();
    netLine();
    return "ok";
  }catch(e){
    return "err";
  }finally{syncing=false}
}
async function selfUpdate(force){
  if(!NET)return "off";
  if(document.readyState!=="complete"){window.addEventListener("load",()=>selfUpdate(),{once:true});return "wait"}
  const url=CFG.selfUrl||location.href.split("#")[0].split("?")[0];
  if(!/^https?:/i.test(url))return "off";
  const n=Number(sessionStorage.getItem("fb_selfupd")||0);
  if(!force&&n>=2)return "same";
  try{
    const r=await fetch(url+(url.includes("?")?"&":"?")+"_v="+Date.now(),{cache:"no-store"});
    if(!r.ok)return "err";
    const txt=await r.text();
    const tag=txt.match(/<meta[^>]*name=["']app-version["'][^>]*>/i);
    const rv=tag?((tag[0].match(/content=["']([^"']+)["']/i)||[])[1]||"").trim():"";
    if(!rv)return "same";
    if(vcmp(rv,APP_VERSION)<=0)return "same";
    sessionStorage.setItem("fb_selfupd",String(n+1));
    document.open("text/html","replace");
    document.write(txt);
    document.close();
    return "new";
  }catch(e){return "err"}
}
function boot(){
  try{fill()}catch(e){$("out").textContent="Error: "+e.message}
  syncRemoteData(false);
  if(document.readyState==="complete")selfUpdate(false);
  else window.addEventListener("load",()=>selfUpdate(false),{once:true});
  setInterval(()=>{syncRemoteData(false);selfUpdate(false)},CFG.autoUpdateMs);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden){syncRemoteData(false);selfUpdate(false)}});
  window.addEventListener("online",()=>{syncRemoteData(false);selfUpdate(false)});
  window.addEventListener("offline",()=>{const el=$("chk_msg");if(el)el.textContent=(U[L]||U.es).off});
  const cb=$("chk_btn");
  if(cb)cb.onclick=async()=>{
    const u=U[L]||U.es,msg=$("chk_msg");
    msg.textContent=u.wait;
    const r=await syncRemoteData(true);
    const s=await selfUpdate(true);
    if(s==="new"){msg.textContent=u.newv;return}
    if(r==="ok")msg.textContent=u.dok.replace("{0}",String(remoteRecs().length)).replace("{1}",DATA_VERSION);
    else if(r==="same")msg.textContent=u.dcur;
    else if(r==="off")msg.textContent=u.off;
    else msg.textContent=u.err;
    netLine();
  };
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
