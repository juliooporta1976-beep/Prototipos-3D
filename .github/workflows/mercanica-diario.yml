name: Actualizacion Diaria de Apps
on:
  schedule:
    - cron: "15 11 * * *"   # 5:15 a.m. Nicaragua
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Aplicar mejoras idempotentes a MercaNica
        run: python scripts/patch_mercanica.py MercaNica.html

      - name: Generar datos de MercaNica
        run: python scripts/update_mercanica.py

      - name: Generar datos de FarmaBusca
        run: python scripts/update_farmabusca.py

      - name: Generar datos de Repuestos
        run: python scripts/update_repuestos.py

      - name: Guardar cambios
        run: |
          git config user.name "mercanica-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .
          git diff --cached --quiet || (git commit -m "Actualización diaria de datos $(date -u +%F)" && git push)
