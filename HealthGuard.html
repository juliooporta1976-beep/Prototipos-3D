#hgq-guide-root{position:fixed;inset:0;z-index:2147483000;pointer-events:none;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;}

.hgq-launch:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(2,132,199,.6);}
.hgq-launch .dot{width:9px;height:9px;border-radius:50%;background:#34d399;animation:hgqpulse 1.8s infinite;}

.hgq-back.on{opacity:1;}

.hgq-back.on .hgq-modal{transform:none;}
.hgq-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #1e293b;background:linear-gradient(90deg,#0b1220,#0f1b33);}
.hgq-badge{font-size:9px;font-weight:900;letter-spacing:.12em;background:#10b981;color:#042018;padding:3px 7px;border-radius:5px;white-space:nowrap;}

.hgq-x{background:#1e293b;color:#fff;border:0;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;}

.hgq-body{padding:18px;overflow-y:auto;}
.hgq-h{font-size:14px;font-weight:900;color:#fff;margin:0 0 6px;}
.hgq-p{font-size:12.5px;line-height:1.6;color:#cbd5e1;margin:0 0 14px;}
.hgq-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:10px;margin-bottom:14px;}
.hgq-card{background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:12px;}
.hgq-card h4{margin:0 0 5px;font-size:12.5px;font-weight:800;color:#fff;}

.hgq-kpi{font-size:20px;font-weight:900;}

.hgq-step .ic{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--c,#38bdf8);color:#04121f;font-weight:900;box-shadow:0 0 0 0 var(--c);animation:hgqflow 2.4s infinite;}
@keyframes hgqflow{0%{box-shadow:0 0 0 0 rgba(56,189,248,.5)}70%{box-shadow:0 0 0 12px rgba(56,189,248,0)}100%{box-shadow:0 0 0 0 rgba(56,189,248,0)}}
.hgq-step .tx{padding-bottom:14px;}
.hgq-step .tx b{font-size:13px;color:#fff;}
.hgq-step .tx p{margin:3px 0 0;font-size:11.5px;color:#94a3b8;line-height:1.5;}
.hgq-conn{width:2px;height:14px;background:#334155;margin:0 0 0 20px;}
.hgq-tour{margin:0;padding-left:18px;}
.hgq-tour li{font-size:12px;color:#cbd5e1;line-height:1.6;margin-bottom:9px;}

.hgq-note{font-size:10.5px;color:#64748b;border-top:1px solid #1e293b;padding-top:10px;margin-top:6px;line-height:1.5;}
.hgq-ph{display:flex;gap:10px;align-items:flex-start;border-left:3px solid var(--c,#38bdf8);background:#0f172a;border-radius:0 8px 8px 0;padding:9px 12px;margin-bottom:8px;}

.hgq-ph .pi{font-size:11px;font-weight:800;color:#38bdf8;margin-left:auto;white-space:nowrap;}
.hgq-ph .pd{font-size:11px;color:#94a3b8;margin-top:3px;line-height:1.45;}
@media(max-width:640px){.hgq-modal{max-height:92vh;}.hgq-title{font-size:13px;}.hgq-launch{padding:9px 13px;font-size:12px;}}

 title:'Health Guard Quantum+ (HGQ+)',sub:'Standalone interactive guide • Understand the project without reading the document',badge:'GUIDE',
 tabs:{home:'Home',arch:'Architecture',flow:'Data flow',obj:'Objectives',phases:'Phases',biz:'Business',tour:'Tour'},
 home:{whatT:'What is it?',whatP:'Health Guard Quantum+ (HGQ+) is an integrated predictive and preventive health platform based on complexity sciences. It combines quantum biophotonics, biomimetic artificial intelligence, behavioral neuroscience and blockchain to anticipate chronic diseases before symptoms appear.',
 probT:'The problem',probP:'Chronic diseases (type 2 diabetes, cardiovascular disease, obesity) affect more than 500 million people and cost USD 1.3 trillion per year. Health systems are reactive: they diagnose late and treat symptoms instead of causes.',
 solT:'The solution',solP:'A multi-layer architecture that detects molecular changes non-invasively, builds a digital twin of the patient to simulate interventions, and rewards healthy habits through a decentralized data economy.',
 benT:'Key benefits',ben:['Detection up to 6 months before clinical markers','Up to 40% reduction in healthcare costs','15% reduction in type 2 diabetes incidence','Personalized, continuous prevention instead of reaction'],
 innT:'Proposed innovation',inn:['Quantum biophotonics with single-photon SPAD sensors','Multi-scale digital twin (from cell to organ)','Data economy with blockchain HealthTokens'],
 impT:'Expected impact',impP:'To become the gold standard of predictive health, easing the collapse of global health systems through early, scalable and sustainable prevention.'},
 arch:{intro:'The platform is organized into 5 technological layers that work together. Click each layer to see its technology, algorithm and objective.',layers:[
  {name:'1 · Quantum Biophotonic Layer',tag:'SENSING',c:'#38bdf8',tech:'High-sensitivity SPAD sensors (single-photon avalanche diodes).',algo:'Detects mitochondrial emissions and reactive oxygen species (ROS) to measure oxidative stress.',obj:'Detect cellular changes up to 6 months before clinical markers, with >95% sensitivity.'},
  {name:'2 · Microbiome & Metabolome Layer',tag:'BIOCHEMISTRY',c:'#22c55e',tech:'Next-generation sequencing (NGS) and mass spectrometry (LC-MS/MS).',algo:'Profiles the gut microbiome and metabolites to cross-reference the biophotonic signal.',obj:'Provide the patient biochemical context to the digital twin.'},
  {name:'3 · Biomimetic AI Layer',tag:'DIGITAL TWIN',c:'#a855f7',tech:'Digital twin based on multi-scale physiological models (cell to organ).',algo:'Machine learning that simulates interventions in silico (diet, exercise) before applying them.',obj:'Predict patient response with >90% accuracy and mean absolute error (MAE) <5%.'},
  {name:'4 · Neurocognitive & Gamified Layer',tag:'BEHAVIOR',c:'#f59e0b',tech:'Portable EEG and natural language processing for emotional analysis.',algo:'Adaptive neurofeedback and gamification (challenges, achievements, rankings) to change habits.',obj:'Achieve >70% weekly adherence and sustained behavior change.'},
  {name:'5 · Blockchain & Data Economy Layer',tag:'INCENTIVES',c:'#f43f5e',tech:'Smart contracts on Ethereum 2.0 or Hyperledger Fabric.',algo:'HealthTokens reward healthy habits and enable a transparent data economy.',obj:'An economy with >50,000 active users and user-governed data.'}]},
 flow:{intro:'This is how information travels through the system, from the body signal to preventive action:',steps:[
  {t:'Input – Non-invasive capture',d:'SPAD sensors measure biophotons and ROS; the kit samples microbiome and metabolome.',c:'#38bdf8'},
  {t:'Processing – Digital twin',d:'Biomimetic AI integrates all data and builds a multi-scale digital twin of the patient.',c:'#a855f7'},
  {t:'Decision – In silico simulation',d:'Interventions are simulated and risk predicted; oxidative anomalies trigger a preclinical alert.',c:'#f59e0b'},
  {t:'Action – Neurofeedback & habits',d:'The neurocognitive layer delivers personalized, gamified recommendations to the user.',c:'#22c55e'},
  {t:'Incentive – HealthTokens',d:'Blockchain rewards healthy habits with tokens inside a data economy.',c:'#f43f5e'}],note:'Every control in the 3D prototype (dynamic states, cameras, telemetry) reflects part of this flow.'},
 obj:{intro:'Scientific and commercial goals with their success metrics, per the technical document:',items:[
  {t:'Early biophotonic detection',m:'6 months ahead • >95% sensitivity (preclinical validation)'},
  {t:'High-accuracy digital twin',m:'>90% accuracy • absolute error (MAE) <5%'},
  {t:'Type 2 diabetes reduction',m:'-15% incidence in 12 months (randomized controlled trial)'},
  {t:'Adopted data economy',m:'>50,000 active users in Phase 3 • monthly adoption >5%'}]},
 phases:{intro:'6-phase development plan (total investment ~$8.5M; CAPEX+OPEX $14M):',items:[
  {n:'Phase 1 · Biophotonic Kit & Microbiome',inv:'12 mo • $1.5M',d:'Sensor engineering, preclinical validation, RCT with 100 volunteers and CE Class IIa certification.',c:'#38bdf8'},
  {n:'Phase 2 · Biomimetic Digital Twin',inv:'9 mo • $1.0M',d:'Core platform, predictive models (MAE <5%) and RESTful API for third parties.',c:'#a855f7'},
  {n:'Phase 3 · Neurocognitive AI + Gamification',inv:'6 mo • $0.8M',d:'iOS/Android app with neurofeedback (EEG) and gamification; NPS >40.',c:'#f59e0b'},
  {n:'Phase 4 · Predictive Community Scaling',inv:'18 mo • $2.5M',d:'Federated AI, dashboard for authorities and rollout in 3 Latin American pilot cities.',c:'#22c55e'},
  {n:'Phase 5 · Circular Health Economy',inv:'12 mo • $1.2M',d:'HealthToken mainnet, wallet and marketplace with >50,000 active users.',c:'#f43f5e'},
  {n:'Phase 6 · Continuous Quantum Optimization',inv:'Ongoing • $1.5M',d:'Quantum algorithms (IBM Q, QML) to improve predictive performance by 10%.',c:'#8b5cf6'}]},
 biz:{intro:'How the project creates value and revenue:',market:[{t:'Global market',v:'$1.3 trillion',d:'Annual cost of chronic diseases'},{t:'Potential savings',v:'Up to 40%',d:'In healthcare system costs'},{t:'5-year ROI',v:'~629%',d:'Break-even in Year 4'}],revenue:[{t:'Premium subscription',v:'$30/mo – digital twin and coaching'},{t:'B2B licenses',v:'$50,000/yr per hospital – community AI'},{t:'Data economy',v:'10% fee on HealthToken transactions'}],gtmT:'Go-to-market strategy',gtm:'Pilot in Latin America with public and private health systems, then expansion to the European Union under GDPR.',roiT:'Key numbers',roi:'Cumulative investment $14.0M • Projected revenue $102.07M • Net benefit $88.07M.'},
 tour:{intro:'Explore the 3D prototype and you will see live what this document describes. Try these controls:',tips:['In the bottom bar, open <b>Simulation & Modes</b> and switch between <b>Basal Surveillance, Biophotonic Scan, Preclinical Alert and Optimization</b>: the decision flow in action.','Use the <b>cameras</b> (SPAD Sensor, Digital Twin, Biomimetic AI, Campus) to focus each architecture layer.','Watch the <b>Telemetry</b> top-right: SPAD sensitivity, oxidative stress (MDA), twin error (MAE) and HealthTokens in circulation.','In <b>Biomechanics & Physics</b> adjust the exploded view and heart rate to see inside the digital twin.','In <b>Infrastructure & Campus</b> tour the buildings: Biophotonics, AI, Neurocognitive Clinic and Blockchain Tower.','Open <b>Technical Document & Patent</b> for full phases, financials and bibliography.'],note:'The ↺ Reset View button restores the scene to its original state.'},
 note:'Content based entirely on the HGQ+ technical document (Dr. Julio Cesar Oporta Barrera, 2025). No features were invented: anything not specified in the document is flagged as pending, not assumed.'

function mount(){document.body.appendChild(root);wire();setLang('es');}
var E={};
function wire(){
 E.launch=root.querySelector('#hgqLaunch');E.ltxt=root.querySelector('#hgqLaunchTxt');

 E.title=root.querySelector('#hgqTitle');E.sub=root.querySelector('#hgqSub');

 E.back.addEventListener('click',function(e){if(e.target===E.back)closeGuide();});
 root.querySelector('#hgqLang').addEventListener('click',function(e){var b=e.target.closest('button');if(b)setLang(b.getAttribute('data-l'));});

function openGuide(t){cur=t||cur;E.back.style.display='flex';renderTabs();renderBody();requestAnimationFrame(function(){E.back.classList.add('on');});}

 }else if(cur==='flow'){var f=d.flow;s+='<p class="hgq-p">'+f.intro+'</p><div class="hgq-flow">';
